import groovy.json.JsonOutput
import org.gradle.api.artifacts.component.ModuleComponentIdentifier
import org.gradle.api.file.ConfigurableFileCollection
import org.gradle.api.file.DirectoryProperty
import org.gradle.api.file.RegularFileProperty
import org.gradle.api.provider.ListProperty
import org.gradle.api.provider.MapProperty
import org.gradle.api.tasks.*
import org.gradle.process.ExecOperations
import java.security.MessageDigest
import javax.inject.Inject

/** Preserve the existing raw-resource names while requiring reviewed, local attribution inputs. */
@CacheableTask
abstract class GenerateLocalLicenseResources extends DefaultTask {
    /** Archive contents participate in task caching independently of machine-local paths. */
    @InputFiles @PathSensitive(PathSensitivity.NONE)
    abstract ConfigurableFileCollection getRuntimeArtifacts()

    /** Runtime paths are internal; file contents and coordinate keys are tracked separately. */
    @Internal
    abstract MapProperty<String, List<File>> getArtifactFilesByIdentity()

    /** Include coordinate/name changes in cache identity even when archive bytes are identical. */
    @Input
    abstract ListProperty<String> getArtifactIdentities()

    /** Respect the same Python executable override and Windows convention as MarmotKit preparation. */
    @Input
    abstract org.gradle.api.provider.Property<String> getPythonExecutable()

    /** Reviewed attribution associates each exact artifact digest with its notice identities. */
    @InputFile @PathSensitive(PathSensitivity.NONE)
    abstract RegularFileProperty getCatalog()

    /** Every variant must preserve the source-bound original attribution baseline. */
    @InputFile @PathSensitive(PathSensitivity.NONE)
    abstract RegularFileProperty getBaseline()

    /** Local icon attribution is checked alongside dependency notice retention. */
    @InputFile @PathSensitive(PathSensitivity.NONE)
    abstract RegularFileProperty getIconNotice()

    /** The shared packaged-resource validator also enforces generated notice equivalence. */
    @InputFile @PathSensitive(PathSensitivity.NONE)
    abstract RegularFileProperty getBaselineValidator()

    /** Retained original attribution and source receipts are part of baseline validation. */
    @InputDirectory @PathSensitive(PathSensitivity.RELATIVE)
    abstract DirectoryProperty getBaselineEvidence()

    /** Track the source-receipt helper imported by baseline validation. */
    @InputFile @PathSensitive(PathSensitivity.NONE)
    abstract RegularFileProperty getEvidenceValidator()

    /** Track checked-in text bytes so a changed or truncated input cannot reuse old outputs. */
    @InputDirectory @PathSensitive(PathSensitivity.RELATIVE)
    abstract DirectoryProperty getNoticeTexts()

    /** Generator implementation changes invalidate the cached resource output. */
    @InputFile @PathSensitive(PathSensitivity.NONE)
    abstract RegularFileProperty getGeneratorScript()

    /** AGP supplies this directory and consumes its raw resources for this variant only. */
    @OutputDirectory
    abstract DirectoryProperty getGeneratedDirectory()

    /** Use Gradle's injected execution service without retaining a Project in task state. */
    @Inject
    abstract ExecOperations getExecOperations()

    /** Fingerprint actual selected bytes before invoking the deterministic, network-free generator. */
    @TaskAction
    void generateResources() {
        def selected = artifactFilesByIdentity.get().collect { identity, files ->
            def separator = identity.lastIndexOf('/')
            def hashes = files.collect { file ->
                def digest = MessageDigest.getInstance('SHA-256')
                file.withInputStream { stream ->
                    byte[] buffer = new byte[1024 * 1024]
                    int count
                    while ((count = stream.read(buffer)) != -1) digest.update(buffer, 0, count)
                }
                digest.digest().encodeHex().toString()
            }.toSet()
            if (hashes.size() != 1) throw new GradleException("Conflicting notice artifact bytes: ${identity}")
            [coordinate: identity.substring(0, separator), name: identity.substring(separator + 1),
             sha256: hashes.first()]
        }.sort { "${it.coordinate}:${it.name}" }
        def input = new File(temporaryDir, 'selected-artifacts.json')
        input.text = JsonOutput.toJson(selected)
        execOperations.exec {
            commandLine pythonExecutable.get(), generatorScript.get().asFile.absolutePath,
                '--catalog', catalog.get().asFile.absolutePath,
                '--selected', input.absolutePath,
                '--baseline', baseline.get().asFile.absolutePath,
                '--icons-notice', iconNotice.get().asFile.absolutePath,
                '--output', new File(generatedDirectory.get().asFile, 'raw').absolutePath
        }.assertNormalExitValue()
    }
}

def root = project.rootDir
def components = extensions.getByName('androidComponents')
components.onVariants(components.selector().all()) { variant ->
    def artifacts = variant.runtimeConfiguration.incoming.artifactView {
        componentFilter { it instanceof ModuleComponentIdentifier }
    }.artifacts.resolvedArtifacts
    def byIdentity = artifacts.map { resolved ->
        def files = [:]
        resolved.each { artifact ->
            def id = artifact.id.componentIdentifier
            def key = "${id.group}:${id.module}:${id.version}/${artifact.file.name}".toString()
            // Several selected capabilities can refer to the same archive. Keep all
            // paths as inputs and require identical bytes before emitting one identity.
            if (!files.containsKey(key)) files[key] = []
            files[key].add(artifact.file)
        }
        files
    }
    def task = tasks.register("${variant.name}LocalNotices", GenerateLocalLicenseResources) {
        pythonExecutable.set(providers.environmentVariable('WHITENOISE_PYTHON').orElse(
            System.getProperty('os.name').toLowerCase(Locale.ROOT).startsWith('windows') ? 'python' : 'python3'))
        runtimeArtifacts.from(artifacts.map { it.collect { artifact -> artifact.file } })
        artifactFilesByIdentity.set(byIdentity)
        artifactIdentities.set(byIdentity.map { it.keySet().toList().sort() })
        catalog.set(new File(root, 'config/licenses/catalog.json'))
        baseline.set(new File(root, 'config/licenses/baseline.json'))
        iconNotice.set(new File(root, 'app/src/main/res/raw/material_icons_notice.txt'))
        baselineValidator.set(new File(root, 'scripts/verify_notice_resources.py'))
        baselineEvidence.set(new File(root, 'config/licenses/evidence'))
        evidenceValidator.set(new File(root, 'scripts/retain_dependency_evidence.py'))
        noticeTexts.set(new File(root, 'config/licenses/texts'))
        generatorScript.set(new File(root, 'scripts/generate_local_notices.py'))
    }
    variant.sources.res.addGeneratedSourceDirectory(task, GenerateLocalLicenseResources::getGeneratedDirectory)
}
