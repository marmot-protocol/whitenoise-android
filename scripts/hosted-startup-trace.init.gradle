import javax.inject.Inject
import org.gradle.process.ExecOperations

abstract class StartupTraceExecution {
    @Inject
    abstract ExecOperations getExecOperations()
}

// This init script is passed only by the fixed healthy startup-trace command.
// Select the existing release-derived app variant before AGP creates test variants.
gradle.beforeProject { project ->
    if (project.path == ':app') {
        project.pluginManager.withPlugin('com.android.application') {
            project.extensions.getByName('androidComponents').finalizeDsl { android ->
                android.testBuildType = 'benchmarkRelease'
                def benchmark = android.buildTypes.getByName('benchmarkRelease')
                if (benchmark.debuggable || !benchmark.minifyEnabled || !benchmark.shrinkResources) {
                    throw new GradleException(
                        'Startup timing requires the nondebuggable minified benchmarkRelease variant')
                }
            }
        }
    }
}

// Opt-in only: start after compilation dependencies, before the connected test task.
gradle.projectsEvaluated {
    def selected = gradle.rootProject.findProject(':app')
    def execution = selected.objects.newInstance(StartupTraceExecution)
    def workspace = gradle.rootProject.projectDir
    selected.tasks.named('connectedDevZapstoreBenchmarkReleaseAndroidTest').configure {
        doFirst {
            execution.execOperations.exec { spec ->
                spec.commandLine 'python3', 'scripts/hosted-startup-trace.py', 'start'
                spec.workingDir(workspace)
            }
        }
    }
}
