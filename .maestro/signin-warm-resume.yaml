appId: dev.ipf.whitenoise.android.dev
name: signin-warm-resume
---
# Stop the previous foreground process before Android clears its data.
- stopApp
- setOrientation: PORTRAIT
- launchApp:
    clearState: true
    permissions:
      all: deny
# Back closes this known optional sheet and records declined sharing choices.
- runFlow:
    when:
      visible: "Help Improve White Noise"
    commands:
      - back
- assertVisible: "Sign Up"
- assertVisible: "Sign In"
- tapOn: "Sign In"
- tapOn: "Private key"
- inputText: "not-a-key"
- hideKeyboard
- pressKey: Home
- launchApp:
    stopApp: false
    clearState: false
    permissions:
      all: deny
- assertVisible: "Private key"
- assertVisible:
    id: "onboarding.sign_in.action"
    enabled: true
- tapOn:
    id: "onboarding.sign_in.action"
- assertVisible: "That doesn't look like a valid nsec or npub key."
- tapOn: "Back"
- assertVisible: "Sign Up"
- assertVisible: "Sign In"
- takeScreenshot: signin-warm-resume
