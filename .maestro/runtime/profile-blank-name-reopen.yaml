appId: dev.ipf.whitenoise.android.maestrolab
name: profile-blank-name-reopen
---
- runFlow: ../fixtures/runtime-ready.yaml
- assertVisible: Maestro group
- runFlow: ../fixtures/open-settings.yaml
- assertVisible: Settings
- tapOn: Profile
- assertVisible:
    id: profile.edit
- tapOn:
    id: profile.edit
- scrollUntilVisible:
    element:
      id: profile.name_field
    direction: DOWN
- assertVisible:
    id: profile.name_field
- tapOn:
    id: profile.name_field
- longPressOn:
    id: profile.name_field
- runFlow:
    when:
      visible: (?i)select all
    commands:
    - tapOn: (?i)select all
- assertVisible:
    id: profile.name_field
    focused: true
- eraseText: 100
- assertNotVisible:
    id: profile.name_field
    text: .+
- inputText: '   '
- assertVisible:
    id: profile.name_field
    text: ^   $
- hideKeyboard
- assertVisible:
    id: profile.save
    enabled: true
- tapOn:
    id: profile.save
- assertVisible:
    id: profile.edit
- assertNotVisible:
    id: profile.save
- tapOn:
    id: profile.edit
- scrollUntilVisible:
    element:
      id: profile.name_field
    direction: UP
- assertVisible:
    id: profile.name_field
- assertNotVisible:
    id: profile.name_field
    text: .+
- back
- assertVisible:
    id: profile.edit
