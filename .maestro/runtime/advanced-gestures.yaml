appId: dev.ipf.whitenoise.android.maestrolab
name: advanced-gestures
---
- runFlow: ../fixtures/runtime-ready.yaml
- assertVisible: "Maestro group"
- runFlow: ../fixtures/open-settings.yaml
- assertVisible: "Settings"
- scrollUntilVisible:
    element:
      text: "Chats"
    direction: DOWN
- tapOn: "Chats"
- assertVisible:
    id: "settings.chats.group"
- scrollUntilVisible:
    element:
      text: "Swipe actions"
    direction: DOWN
- tapOn: "Swipe actions"
- assertVisible:
    id: "gestures.MessageLeft"
- tapOn:
    id: gestures.MessageLeft
- assertVisible:
    id: speech.choice.0
- assertVisible: "Off"
- tapOn: Cancel
- assertNotVisible:
    id: speech.choice.0
- tapOn:
    id: gestures.MessageLeft
- assertVisible:
    id: speech.choice.0
- back
- assertNotVisible:
    id: speech.choice.0
- assertVisible:
    id: gestures.MessageLeft
- back
- assertVisible:
    id: "settings.chats.group"
- back
- assertVisible: "Settings"
