appId: dev.ipf.whitenoise.android.maestrolab
name: preferences-language-traditional-chinese
---
- runFlow: ../fixtures/runtime-ready.yaml
- assertVisible: "Maestro group"
- runFlow: ../fixtures/open-settings.yaml
- assertVisible: "Settings"
- scrollUntilVisible:
    element:
      text: "Voice & language"
    direction: DOWN
- tapOn: "Voice & language"
- assertVisible:
    id: "settings.voice_language.group"
- scrollUntilVisible:
    element:
      text: "Language"
    direction: DOWN
- tapOn: "Language"
- scrollUntilVisible:
    element:
      text: "繁體中文"
    direction: DOWN
- tapOn: "繁體中文"
- assertVisible: "語言"
- back
- assertVisible:
    id: "settings.voice_language.group"
- scrollUntilVisible:
    element:
      id: "appearance.language.group"
    direction: DOWN
- tapOn: "語言"
- scrollUntilVisible:
    element:
      text: "繁體中文"
    direction: DOWN
- assertVisible: "繁體中文"
- scrollUntilVisible:
    element:
      text: "English"
    direction: UP
- tapOn: "English"
- assertVisible: "Language"
- tapOn: "System default"
- assertVisible: "Language"
- back
- assertVisible:
    id: "settings.voice_language.group"
- back
- assertVisible: "Settings"
- back
- assertVisible: "Maestro group"
