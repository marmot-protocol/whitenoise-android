appId: dev.ipf.whitenoise.android.maestrolab
name: folders-details-clear-reopen
---
- runFlow: ../fixtures/folder-details-draft.yaml
- runFlow: ../fixtures/save-folder-reopen.yaml
- runFlow: ../fixtures/reveal-folder-description.yaml
- longPressOn:
    id: folder.description
- runFlow:
    when:
      notVisible: (?i)select all
    commands:
    - tapOn: More options
- tapOn: (?i)select all
- assertVisible:
    id: folder.description
    focused: true
- eraseText: 1
- assertNotVisible:
    id: folder.description
    text: (?s)^(?!Description$).+
# Android hideKeyboard sends Back when selection deletion has already hidden the IME.
- runFlow:
    when:
      visible:
        id: com\.google\.android\.inputmethod\.latin:id/.*
    commands:
      - hideKeyboard
- scrollUntilVisible:
    element:
      id: folder.showWhenEmpty
    direction: DOWN
- assertVisible:
    id: folder.showWhenEmpty
    checked: true
- tapOn:
    id: folder.showWhenEmpty
- assertVisible:
    id: folder.showWhenEmpty
    checked: false
- scrollUntilVisible:
    element:
      id: folder.sort.RECENT
    direction: DOWN
- tapOn:
    id: folder.sort.RECENT
- runFlow: ../fixtures/save-folder-reopen.yaml
- runFlow: ../fixtures/reveal-folder-description.yaml
- assertNotVisible:
    id: folder.description
    text: (?s)^(?!Description$).+
- scrollUntilVisible:
    element:
      id: folder.showWhenEmpty
    direction: DOWN
- assertVisible:
    id: folder.showWhenEmpty
    checked: false
- scrollUntilVisible:
    element:
      id: folder.sort.RECENT
    direction: DOWN
- assertVisible:
    id: folder.sort.RECENT
- back
- assertVisible:
    id: chat-folders-content
