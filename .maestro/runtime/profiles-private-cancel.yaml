appId: dev.ipf.whitenoise.android.maestrolab
name: profiles-private-cancel
---
- runFlow: ../fixtures/open-external-private-details.yaml
- scrollUntilVisible:
    element:
      text: "Name"
    direction: DOWN
- tapOn: "Name"
- inputText: "Maestro unsaved nickname"
- scrollUntilVisible:
    element:
      text: "Notes"
    direction: DOWN
- tapOn: "Notes"
- inputText: "Maestro unsaved note"
- hideKeyboard
- tapOn: "Cancel"
- assertVisible: "User Profile"
- scrollUntilVisible:
    element:
      text: "Nickname & notes"
    direction: DOWN
- tapOn: "Nickname & notes"
- scrollUntilVisible:
    element:
      text: "Name"
    direction: UP
- assertNotVisible: "Maestro unsaved nickname"
- scrollUntilVisible:
    element:
      text: "Notes"
    direction: DOWN
- assertNotVisible: "Maestro unsaved note"
- tapOn: "Cancel"
