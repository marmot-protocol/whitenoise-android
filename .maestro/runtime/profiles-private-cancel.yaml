appId: dev.ipf.whitenoise.android.maestrolab
name: profiles-private-cancel
---
- runFlow: ../fixtures/runtime-ready.yaml
- assertVisible: "Maestro group"
- tapOn: "Maestro group"
- runFlow: ../fixtures/assert-fixture-conversation.yaml
- tapOn: "Maestro group"
- assertVisible:
    id: "chat_info.list"
- scrollUntilVisible:
    element:
      text: "Maestro Bob"
    direction: DOWN
- tapOn: "Maestro Bob"
- assertVisible: "User Profile"
- scrollUntilVisible:
    element:
      text: "Nickname & notes"
    direction: DOWN
- tapOn: "Nickname & notes"
- scrollUntilVisible:
    element:
      text: "Name"
    direction: DOWN
- tapOn: "Name"
- inputText: "Maestro unsaved nickname"
- scrollUntilVisible:
    element:
      text: "Notes"
    direction: DOWN
- tapOn: "Notes"
- inputText: "Maestro unsaved note"
- hideKeyboard
- tapOn: "Cancel"
- assertVisible: "User Profile"
- scrollUntilVisible:
    element:
      text: "Nickname & notes"
    direction: DOWN
- tapOn: "Nickname & notes"
- scrollUntilVisible:
    element:
      text: "Name"
    direction: UP
- assertNotVisible: "Maestro unsaved nickname"
- scrollUntilVisible:
    element:
      text: "Notes"
    direction: DOWN
- assertNotVisible: "Maestro unsaved note"
- tapOn: "Cancel"
