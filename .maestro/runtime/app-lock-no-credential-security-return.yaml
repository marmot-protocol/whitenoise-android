appId: dev.ipf.whitenoise.android.maestrolab
name: app-lock-no-credential-security-return
---
- runFlow: ../fixtures/runtime-no-credential-privacy.yaml
- tapOn: Open Android security settings
- assertVisible:
    id: ^com.android.(settings|permissioncontroller):id/.*
- assertNotVisible:
    id: privacy.device_protection.group
- back
- assertVisible:
    id: privacy.device_protection.group
- runFlow: ../fixtures/assert-no-credential-privacy.yaml
- back
- assertVisible: Settings
- back
- assertVisible: Maestro group
