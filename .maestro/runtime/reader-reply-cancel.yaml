appId: dev.ipf.whitenoise.android.maestrolab
name: reader-reply-cancel
---
- runFlow: ../fixtures/runtime-ready.yaml
- assertVisible: "Maestro group"
- tapOn: "Maestro group"
- scrollUntilVisible:
    element:
      text: "Read More"
    direction: UP
- tapOn: "Read More"
- assertVisible:
    id: "composer-pill-surface"
- scrollUntilVisible:
    element:
      text: "Maestro reader heading"
    direction: UP
- assertVisible: "Maestro reader heading"
- longPressOn:
    text: "Maestro reader heading"
- tapOn: "Reply"
- assertVisible:
    id: "conversation.reply.bar"
- tapOn: "Cancel reply"
- assertNotVisible:
    id: "conversation.reply.bar"
