appId: dev.ipf.whitenoise.android.maestrolab
name: advanced-folders
---
- runFlow: ../fixtures/runtime-ready.yaml
- assertVisible: "Maestro group"
- runFlow: ../fixtures/open-settings.yaml
- assertVisible: "Settings"
- scrollUntilVisible:
    element:
      text: "Chats"
    direction: DOWN
- tapOn: "Chats"
- assertVisible:
    id: "settings.chats.group"
- scrollUntilVisible:
    element:
      text: "Folders"
    direction: DOWN
- tapOn: "Folders"
- assertVisible:
    id: "chat-folders-content"
- back
- assertVisible:
    id: "settings.chats.group"
- back
- assertVisible: "Settings"
