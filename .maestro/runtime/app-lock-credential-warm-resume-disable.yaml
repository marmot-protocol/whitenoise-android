appId: dev.ipf.whitenoise.android.maestrolab
name: app-lock-credential-warm-resume-disable
---
- runFlow: ../fixtures/runtime-credential-privacy.yaml
- runFlow: ../fixtures/cancel-device-pin.yaml
- runFlow: ../fixtures/retry-device-pin.yaml
- runFlow: ../fixtures/runtime-warm-resume.yaml
- runFlow: ../fixtures/enter-device-pin.yaml
- assertVisible: Maestro group
- runFlow: ../fixtures/open-credential-privacy.yaml
- tapOn:
    enabled: true
    checked: true
    containsChild:
      text: '(?s).*Require device authentication.*'
- assertVisible:
    enabled: true
    checked: false
    containsChild:
      text: '(?s).*Require device authentication.*'
- assertNotVisible: Auto-lock
- tapOn: Back
- tapOn: Back
- assertVisible: Maestro group
- runFlow: ../fixtures/runtime-warm-resume.yaml
- assertVisible: Maestro group
- assertNotVisible:
    id: app.lock
- assertNotVisible:
    id: '^(com.android.systemui|com.android.settings):id/(pinEntry|password_entry|lockPassword)$'
