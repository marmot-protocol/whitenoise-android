appId: dev.ipf.whitenoise.android.maestrolab
name: preferences-language-cancel
---
- assertVisible: "Maestro group"
- tapOn: "Open settings.*"
- assertVisible: "Settings"
- scrollUntilVisible:
    element:
      text: "Appearance"
    direction: DOWN
- tapOn: "Appearance"
- scrollUntilVisible:
    element:
      text: "Language"
    direction: DOWN
- tapOn: "Language"
- assertVisible: "English"
- back
- assertVisible:
    id: "appearance.language.group"
