appId: dev.ipf.whitenoise.android.maestrolab
name: profiles-private-rotation
---
- runFlow: ../fixtures/open-external-private-details.yaml
- scrollUntilVisible:
    element:
      text: "Name"
    direction: DOWN
- tapOn: "Name"
- inputText: "Maestro unsaved nickname"
- scrollUntilVisible:
    element:
      text: "Notes"
    direction: DOWN
- tapOn: "Notes"
- inputText: "Maestro unsaved note"
- hideKeyboard
- setOrientation: LANDSCAPE_LEFT
- runFlow:
    file: ../fixtures/private-dialog-landscape-scroll.yaml
    env:
      PRIVATE_FIELD: Maestro unsaved nickname
- setOrientation: PORTRAIT
- scrollUntilVisible:
    element:
      text: "Maestro unsaved note"
    direction: DOWN
- assertVisible: "Maestro unsaved note"
- tapOn: "Cancel"
- assertVisible: "User Profile"
- scrollUntilVisible:
    element:
      text: "Maestro Dave"
    direction: UP
- assertVisible: "Maestro Dave"
