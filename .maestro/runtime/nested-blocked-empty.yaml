appId: dev.ipf.whitenoise.android.maestrolab
name: nested-blocked-empty
---
- runFlow: ../fixtures/runtime-ready.yaml
- assertVisible: "Maestro group"
- runFlow: ../fixtures/open-settings.yaml
- assertVisible: "Settings"
- scrollUntilVisible:
    element:
      text: "Privacy & Security"
    direction: DOWN
- tapOn: "Privacy & Security"
- scrollUntilVisible:
    element:
      text: "Blocked users"
    direction: DOWN
- tapOn:
    text: "Blocked users"
    index: 1
- assertVisible: "Blocked users"
- assertVisible: "You haven’t blocked anyone."
- back
- assertVisible: "Privacy & Security"
- scrollUntilVisible:
    element:
      id: "privacy.device_protection.group"
    direction: UP
- assertVisible:
    id: "privacy.device_protection.group"
