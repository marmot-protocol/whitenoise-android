appId: dev.ipf.whitenoise.android.maestrolab
name: nested-blocked-empty
---
- runFlow: ../fixtures/runtime-ready.yaml
- assertVisible: "Maestro group"
- tapOn: "Open settings.*"
- assertVisible: "Settings"
- scrollUntilVisible:
    element:
      text: "Privacy & Security"
    direction: DOWN
- tapOn: "Privacy & Security"
- scrollUntilVisible:
    element:
      text: "Blocked users"
    direction: DOWN
- tapOn: "Blocked users"
- assertVisible:
    id: "blocked-users-content"
- assertVisible: "You haven’t blocked anyone."
- back
- assertVisible:
    id: "privacy.device_protection.group"
