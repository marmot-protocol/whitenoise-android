appId: dev.ipf.whitenoise.android.maestrolab
name: keys-raw-export-cancel
---
- runFlow: ../fixtures/runtime-profile-keys-ready.yaml
- scrollUntilVisible:
    element:
      text: Export Private Key
    direction: DOWN
- tapOn: Export Private Key
- assertVisible: Keep Your Private Key Safe
- assertVisible: Export Private Key
- assertVisible: Share
- assertVisible: Cancel
- tapOn: Cancel
- assertNotVisible: Keep Your Private Key Safe
- scrollUntilVisible:
    element:
      text: Private key hidden
    direction: UP
- assertVisible: Private key hidden
- tapOn: Back
- assertVisible: Settings
- tapOn: Back
- assertVisible: Maestro group
