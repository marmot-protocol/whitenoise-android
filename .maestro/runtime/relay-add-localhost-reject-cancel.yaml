appId: dev.ipf.whitenoise.android.maestrolab
name: relay-add-localhost-reject-cancel
---
- runFlow: ../fixtures/open-fixture-empty-relay-draft.yaml
- inputText: wss://localhost
- assertVisible:
    id: relay.add.url
    text: ^wss://localhost$
- hideKeyboard
- assertVisible:
    id: relay.add.submit
    enabled: false
- back
- assertNotVisible:
    id: relay.add.url
- assertVisible:
    id: relays.group
- back
- assertVisible: Settings
