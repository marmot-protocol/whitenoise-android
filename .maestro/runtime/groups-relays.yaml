appId: dev.ipf.whitenoise.android.maestrolab
name: groups-relays
---
- runFlow: ../fixtures/runtime-ready.yaml
- assertVisible: "Maestro group"
- tapOn: "Maestro group"
- runFlow: ../fixtures/assert-fixture-conversation.yaml
- tapOn: "Maestro group"
- assertVisible:
    id: "chat_info.list"
- scrollUntilVisible:
    element:
      id: "chat_info.relays"
    direction: DOWN
- tapOn:
    id: "chat_info.relays"
- assertVisible: "Configured relays"
- back
- assertVisible:
    id: "chat_info.list"
