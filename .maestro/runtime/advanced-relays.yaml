appId: dev.ipf.whitenoise.android.maestrolab
name: advanced-relays
---
- assertVisible: "Maestro group"
- tapOn: "Open settings.*"
- assertVisible: "Settings"
- scrollUntilVisible:
    element:
      text: "Relays"
    direction: DOWN
- tapOn: "Relays"
- assertVisible:
    id: "relays.group"
- back
- assertVisible: "Settings"
