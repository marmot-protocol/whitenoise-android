appId: dev.ipf.whitenoise.android.maestrolab
name: relay-add-private-ip-reject-cancel
---
- runFlow: ../fixtures/open-fixture-empty-relay-draft.yaml
- inputText: wss://192.168.1.2
- assertVisible:
    id: relay.add.url
    text: ^wss://192\.168\.1\.2$
- hideKeyboard
- assertVisible:
    id: relay.add.submit
    enabled: false
- back
- assertNotVisible:
    id: relay.add.url
- assertVisible:
    id: relays.group
- back
- assertVisible: Settings
