appId: dev.ipf.whitenoise.android.maestrolab
name: relay-add-private-ip-reject-cancel
---
- runFlow: ../fixtures/runtime-ready.yaml
- assertVisible: Maestro group
- runFlow: ../fixtures/open-settings.yaml
- assertVisible: Settings
- scrollUntilVisible:
    element:
      text: Relays
    direction: DOWN
- tapOn: Relays
- assertVisible:
    id: relays.group
- scrollUntilVisible:
    element:
      text: ^Add relay$
    direction: DOWN
- tapOn: Add relay
- assertVisible:
    id: relay.add.url
- assertVisible:
    id: relay.add.submit
    enabled: false
- tapOn:
    id: relay.add.url
- assertVisible:
    id: relay.add.url
    focused: true
- eraseText: 100
- assertNotVisible:
    id: relay.add.url
    text: .+
- inputText: wss://192.168.1.2
- assertVisible:
    id: relay.add.url
    text: ^wss://192\.168\.1\.2$
- hideKeyboard
- assertVisible:
    id: relay.add.submit
    enabled: false
- back
- assertNotVisible:
    id: relay.add.url
- assertVisible:
    id: relays.group
- back
- assertVisible: Settings
