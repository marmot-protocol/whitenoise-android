appId: dev.ipf.whitenoise.android.maestrolab
name: keys-public-copy-warm-resume
---
- runFlow: ../fixtures/runtime-ready.yaml
- assertVisible: Maestro group
- runFlow: ../fixtures/open-fixture-profile-keys.yaml
- runFlow: ../fixtures/copy-fixture-public-key.yaml
- runFlow: ../fixtures/runtime-warm-resume.yaml
- assertVisible: Private key hidden
- scrollUntilVisible:
    element:
      id: profile_keys.public_key_value
    direction: UP
- assertVisible:
    id: profile_keys.public_key_value
- runFlow: ../fixtures/copy-fixture-public-key.yaml
- tapOn: Back
- assertVisible: Settings
- tapOn: Back
- assertVisible: Maestro group
