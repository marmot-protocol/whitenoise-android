appId: dev.ipf.whitenoise.android.maestrolab
name: inbound-share-account-switch-clears
---
- runFlow: ../fixtures/runtime-share-text-ready.yaml
- assertVisible:
    id: performance.share_picker
- assertVisible:
    text: ^Maestro group$
- assertVisible:
    enabled: false
    containsChild:
      text: ^Share$
- tapOn: Maestro group
- assertVisible:
    id: performance.share_picker
- assertVisible:
    text: ^Maestro group$
- assertVisible:
    enabled: true
    text: ^Share to 1 chat$
- tapOn: Choose sending account
- assertVisible:
    text: ^Choose which signed-in account will own these shared drafts\.$
- assertVisible:
    text: ^Maestro Bob$
- assertVisible:
    text: ^Maestro Carol$
- tapOn: Maestro Bob
- assertNotVisible: ^Choose which signed-in account will own these shared drafts\.$
- assertVisible:
    text: ^Maestro Bob$
- assertVisible:
    id: performance.share_picker
- assertVisible:
    text: ^Maestro group$
- assertVisible:
    enabled: false
    containsChild:
      text: ^Share$
- tapOn: Close
- assertNotVisible: Some files could not be imported
- assertNotVisible:
    id: performance.share_picker
- assertVisible:
    text: ^Maestro group$
