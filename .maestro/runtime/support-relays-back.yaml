appId: dev.ipf.whitenoise.android.maestrolab
name: support-relays-back
---
- assertVisible: "Maestro group"
- tapOn: "Open settings.*"
- assertVisible: "Settings"
- scrollUntilVisible:
    element:
      text: "Chat with support"
    direction: DOWN
- tapOn: "Chat with support"
- assertVisible: "White Noise Support"
- assertVisible:
    id: "support.start"
- scrollUntilVisible:
    element:
      id: "support.relays"
    direction: DOWN
- tapOn:
    id: "support.relays"
- assertVisible:
    id: "relays.group"
- back
- assertVisible: "White Noise Support"
