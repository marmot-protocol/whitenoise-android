appId: dev.ipf.whitenoise.android.maestrolab
name: settings-appearance
---
- runFlow: ../fixtures/runtime-ready.yaml
# The instrumentation host owns launch, reset and disposal.
- assertVisible: "Maestro group"
- runFlow: ../fixtures/open-settings.yaml
- assertVisible: "Settings"
- scrollUntilVisible:
    element:
      text: "Appearance"
    direction: DOWN
- tapOn: "Appearance"
- assertVisible:
    id: "appearance.theme.group"
- scrollUntilVisible:
    element:
      text: "Composer"
    direction: DOWN
- tapOn: "Composer"
- assertVisible:
    id: "composer.customize"
- assertNotVisible: "Done"
- assertNotVisible: "Cancel"
- back
- assertNotVisible:
    id: "composer.customize"
- scrollUntilVisible:
    element:
      id: "appearance.theme.group"
    direction: UP
- assertVisible:
    id: "appearance.theme.group"
- tapOn: "Back"
- assertVisible: "Settings"
- tapOn: "Back"
- assertVisible: "Maestro group"
