appId: dev.ipf.whitenoise.android.maestrolab
name: accounts-wipe-valid-cancel
---
- runFlow: ../fixtures/runtime-ready.yaml
- assertVisible: "Maestro group"
- runFlow: ../fixtures/open-wipe-confirm.yaml
- tapOn: "Confirmation"
- inputText: "WIPE"
- hideKeyboard
- assertVisible:
    containsChild:
      text: "Wipe"
    enabled: true
- tapOn: "Cancel"
- assertNotVisible: "Wipe this account[?]"
- assertNotVisible: "What gets destroyed"
- assertVisible: "Private key hidden"
- back
- assertVisible: "Settings"
- back
- assertVisible: "Maestro group"
- tapOn: "Maestro group"
- runFlow: ../fixtures/assert-fixture-conversation.yaml
