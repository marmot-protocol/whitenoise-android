appId: dev.ipf.whitenoise.android.maestrolab
name: speech-rate-return
---
- runFlow: ../fixtures/runtime-ready.yaml
- assertVisible: Maestro group
- runFlow: ../fixtures/open-settings.yaml
- assertVisible: Settings
- scrollUntilVisible:
    element:
      text: "Voice & language"
    direction: DOWN
- tapOn: "Voice & language"
- assertVisible:
    id: "settings.voice_language.group"
- scrollUntilVisible:
    element:
      text: Read Aloud
    direction: DOWN
- tapOn: Read Aloud
- assertVisible:
    id: speech.engine.group
- tapOn: Speech rate
- back
- tapOn: Back
- assertVisible:
    id: "settings.voice_language.group"
- tapOn: "Back"
- assertVisible: Settings
- tapOn: Back
- assertVisible: Maestro group
