appId: dev.ipf.whitenoise.android.maestrolab
name: relay-add-upper-case-accept-cancel
---
- runFlow: ../fixtures/runtime-ready.yaml
- assertVisible: Maestro group
- runFlow: ../fixtures/open-settings.yaml
- assertVisible: Settings
- scrollUntilVisible:
    element:
      text: Relays
    direction: DOWN
- tapOn: Relays
- assertVisible:
    id: relays.group
- scrollUntilVisible:
    element:
      text: ^Add relay$
    direction: DOWN
- tapOn: Add relay
- assertVisible:
    id: relay.add.url
- assertVisible:
    id: relay.add.submit
    enabled: false
- tapOn:
    id: relay.add.url
- assertVisible:
    id: relay.add.url
    focused: true
- eraseText: 100
- assertNotVisible:
    id: relay.add.url
    text: .+
- inputText: WSS://RELAY.EXAMPLE.INVALID/path
- assertVisible:
    id: relay.add.url
    text: ^WSS://RELAY\.EXAMPLE\.INVALID/path$
- hideKeyboard
- assertVisible:
    id: relay.add.submit
    enabled: true
- back
- assertNotVisible:
    id: relay.add.url
- assertVisible:
    id: relays.group
- back
- assertVisible: Settings
