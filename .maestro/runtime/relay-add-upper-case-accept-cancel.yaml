appId: dev.ipf.whitenoise.android.maestrolab
name: relay-add-upper-case-accept-cancel
---
- runFlow: ../fixtures/open-fixture-empty-relay-draft.yaml
- inputText: WSS://RELAY.EXAMPLE.INVALID/path
- assertVisible:
    id: relay.add.url
    text: ^WSS://RELAY\.EXAMPLE\.INVALID/path$
- hideKeyboard
- assertVisible:
    id: relay.add.submit
    enabled: true
- back
- assertNotVisible:
    id: relay.add.url
- assertVisible:
    id: relays.group
- back
- assertVisible: Settings
