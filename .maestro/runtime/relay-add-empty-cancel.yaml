appId: dev.ipf.whitenoise.android.maestrolab
name: relay-add-empty-cancel
---
- runFlow: ../fixtures/runtime-ready.yaml
- assertVisible: Maestro group
- runFlow: ../fixtures/open-settings.yaml
- assertVisible: Settings
- scrollUntilVisible:
    element:
      text: Relays
    direction: DOWN
- tapOn: Relays
- assertVisible:
    id: relays.group
- tapOn: Add relay
- assertVisible:
    id: relay.add.url
- assertVisible:
    id: relay.add.submit
    enabled: false
- back: null
- assertNotVisible:
    id: relay.add.url
- assertVisible:
    id: relays.group
- back: null
- assertVisible: Settings
