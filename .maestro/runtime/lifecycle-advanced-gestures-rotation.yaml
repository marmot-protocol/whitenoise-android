appId: dev.ipf.whitenoise.android.maestrolab
name: lifecycle-advanced-gestures-rotation
---
- runFlow:
    file: ../fixtures/open-fixture-settings-hub-destination.yaml
    env:
      SETTINGS_HUB: "Chats"
      SETTINGS_HUB_GROUP: "settings.chats.group"
      SETTINGS_DESTINATION: Swipe actions
- assertVisible:
    id: gestures.MessageLeft
- setOrientation: LANDSCAPE_LEFT
- assertVisible:
    id: gestures.MessageLeft
- setOrientation: PORTRAIT
- assertVisible:
    id: gestures.MessageLeft
- back
- assertVisible:
    id: "settings.chats.group"
- back
- assertVisible: Settings
