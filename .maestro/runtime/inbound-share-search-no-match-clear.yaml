appId: dev.ipf.whitenoise.android.maestrolab
name: inbound-share-search-no-match-clear
---
- runFlow: ../fixtures/runtime-share-text-ready.yaml
- assertVisible:
    id: performance.share_picker
- assertVisible:
    text: ^Maestro group$
- assertVisible:
    enabled: false
    text: ^Share$
- tapOn: Search chats
- assertVisible:
    focused: true
- inputText: ZZZMaestroNoDestination
- assertVisible:
    focused: true
    text: ^ZZZMaestroNoDestination$
- hideKeyboard
- assertVisible:
    text: ^No chats match your search.$
- assertVisible:
    enabled: false
    text: ^Share$
- tapOn: ZZZMaestroNoDestination
- assertVisible:
    focused: true
- eraseText: 100
- hideKeyboard
- assertVisible:
    id: performance.share_picker
- assertVisible:
    text: ^Maestro group$
- assertVisible:
    enabled: false
    text: ^Share$
- tapOn: Close
- assertNotVisible: Some files could not be imported
- assertNotVisible:
    id: performance.share_picker
- assertVisible:
    text: ^Maestro group$
