appId: dev.ipf.whitenoise.android.maestrolab
name: developer-quarantine
---
- runFlow: ../fixtures/runtime-ready.yaml
- assertVisible: "Maestro group"
- tapOn: "Open settings.*"
- assertVisible: "Settings"
- scrollUntilVisible:
    element:
      text: "Help"
    direction: DOWN
- tapOn: "Help"
- tapOn:
    id: "help.about"
- assertVisible:
    id: "about.app"
- repeat:
    times: 7
    commands:
      - tapOn:
          id: "about.version"
- scrollUntilVisible:
    element:
      id: "about.developer"
    direction: DOWN
- tapOn:
    id: "about.developer"
- assertVisible:
    id: "developer.warning"
- scrollUntilVisible:
    element:
      id: "developer.quarantined_groups"
    direction: DOWN
- tapOn:
    id: "developer.quarantined_groups"
- assertVisible:
    id: "quarantine.list"
- back
- assertVisible:
    id: "developer.warning"
