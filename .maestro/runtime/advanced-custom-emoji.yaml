appId: dev.ipf.whitenoise.android.maestrolab
name: advanced-custom-emoji
---
- runFlow: ../fixtures/runtime-ready.yaml
- assertVisible: "Maestro group"
- runFlow: ../fixtures/open-settings.yaml
- assertVisible: "Settings"
- scrollUntilVisible:
    element:
      text: "Chats"
    direction: DOWN
- tapOn: "Chats"
- assertVisible:
    id: "settings.chats.group"
- scrollUntilVisible:
    element:
      text: "Custom emoji"
    direction: DOWN
- tapOn: "Custom emoji"
- assertVisible:
    id: "custom-emoji-content"
- assertVisible:
    id: "custom_emoji.add"
- back
- assertVisible:
    id: "settings.chats.group"
- scrollUntilVisible:
    element:
      id: "appearance.custom_emoji.group"
    direction: DOWN
- assertVisible:
    id: "appearance.custom_emoji.group"
