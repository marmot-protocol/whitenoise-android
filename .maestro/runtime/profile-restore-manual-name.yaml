appId: dev.ipf.whitenoise.android.maestrolab
name: profile-restore-manual-name
---
- runFlow: ../fixtures/open-fixture-empty-profile-name.yaml
- inputText: Maestro unsaved name
- assertVisible:
    id: profile.name_field
    text: ^Maestro unsaved name$
- hideKeyboard
- scrollUntilVisible:
    element:
      id: profile.restore_name
    direction: DOWN
- assertVisible:
    id: profile.restore_name
- assertVisible:
    id: profile.restore_name
    enabled: true
- tapOn:
    id: profile.restore_name
- scrollUntilVisible:
    element:
      id: profile.name_field
    direction: UP
- assertVisible:
    id: profile.name_field
- assertVisible:
    id: profile.name_field
    text: ^Maestro Alice$
- assertVisible:
    id: profile.restore_name
    enabled: false
- back
- assertVisible:
    id: profile.edit
