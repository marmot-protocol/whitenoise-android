appId: dev.ipf.whitenoise.android.maestrolab
name: speech-custom-zero
---
- runFlow: ../fixtures/runtime-ready.yaml
- assertVisible: Maestro group
- runFlow: ../fixtures/open-settings.yaml
- assertVisible: Settings
- scrollUntilVisible:
    element:
      text: Read Aloud
    direction: DOWN
- tapOn: Read Aloud
- assertVisible:
    id: speech.engine.group
- tapOn: Speech rate
- tapOn: Custom
- assertVisible:
    id: speech.custom_rate
- tapOn:
    id: speech.custom_rate
- eraseText: 100
- inputText: '0'
- hideKeyboard
- tapOn: Apply
- assertVisible:
    id: speech.custom_rate
- assertVisible: Enter a rate from 0\.1× to 10\.0×\.
- tapOn: Cancel
- assertNotVisible:
    id: speech.custom_rate
- assertVisible:
    id: speech.engine.group
