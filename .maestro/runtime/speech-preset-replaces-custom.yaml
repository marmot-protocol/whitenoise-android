appId: dev.ipf.whitenoise.android.maestrolab
name: speech-preset-replaces-custom
---
- runFlow: ../fixtures/open-fixture-empty-custom-rate.yaml
- inputText: '2.75'
- assertVisible:
    id: speech.custom_rate
    text: ^2\.75$
- hideKeyboard
- tapOn: Apply
- assertNotVisible:
    id: speech.custom_rate
- assertVisible: 2\.8×
- tapOn: Speech rate
- scrollUntilVisible:
    element:
      text: 0\.5×
    direction: UP
- tapOn: 0\.5×
- assertVisible:
    id: speech.engine.group
- assertVisible: 0\.5×
- back
- assertVisible: Settings
- tapOn: Read Aloud
- assertVisible:
    id: speech.engine.group
- assertVisible: 0\.5×
