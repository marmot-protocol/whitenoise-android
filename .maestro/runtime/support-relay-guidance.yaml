appId: dev.ipf.whitenoise.android.maestrolab
name: support-relay-guidance
---
- runFlow: ../fixtures/runtime-ready.yaml
- assertVisible: "Maestro group"
- runFlow: ../fixtures/open-settings.yaml
- assertVisible: "Settings"
- scrollUntilVisible:
    element:
      text: "Chat with support"
    direction: DOWN
- tapOn: "Chat with support"
- assertVisible: "White Noise Support"
- assertVisible:
    id: "support.start"
- assertVisible:
    id: "support.relay_status"
- assertVisible:
    id: "support.start"
    enabled: false
- assertVisible:
    id: "support.relays"
