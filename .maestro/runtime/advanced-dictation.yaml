appId: dev.ipf.whitenoise.android.maestrolab
name: advanced-dictation
---
- assertVisible: "Maestro group"
- tapOn: "Open settings.*"
- assertVisible: "Settings"
- scrollUntilVisible:
    element:
      text: "Dictation"
    direction: DOWN
- tapOn: "Dictation"
- assertVisible:
    id: "dictation.ostt_recommendation.group"
- back
- assertVisible: "Settings"
