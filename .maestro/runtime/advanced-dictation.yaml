appId: dev.ipf.whitenoise.android.maestrolab
name: advanced-dictation
---
- runFlow: ../fixtures/runtime-ready.yaml
- assertVisible: "Maestro group"
- runFlow: ../fixtures/open-settings.yaml
- assertVisible: "Settings"
- scrollUntilVisible:
    element:
      text: "Voice & language"
    direction: DOWN
- tapOn: "Voice & language"
- assertVisible:
    id: "settings.voice_language.group"
- scrollUntilVisible:
    element:
      text: "Dictation"
    direction: DOWN
- tapOn: "Dictation"
- assertVisible:
    id: "dictation.ostt_recommendation.group"
- back
- assertVisible:
    id: "settings.voice_language.group"
- back
- assertVisible: "Settings"
