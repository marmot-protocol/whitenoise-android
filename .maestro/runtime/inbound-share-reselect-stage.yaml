appId: dev.ipf.whitenoise.android.maestrolab
name: inbound-share-reselect-stage
---
- runFlow: ../fixtures/runtime-share-text-ready.yaml
- &id001
  assertVisible:
    id: performance.share_picker
- &id002
  assertVisible:
    text: ^Maestro group$
- &id003
  assertVisible:
    enabled: false
    text: ^Share$
- tapOn: Maestro group
- &id004
  assertVisible:
    id: performance.share_picker
- &id005
  assertVisible:
    text: ^Maestro group$
- &id006
  assertVisible:
    enabled: true
    text: ^Share to 1 chat$
- tapOn: Maestro group
- *id001
- *id002
- *id003
- tapOn: Maestro group
- *id004
- *id005
- *id006
- tapOn:
    text: ^Share to 1 chat$
- assertNotVisible:
    id: performance.share_picker
- runFlow: ../fixtures/assert-fixture-conversation.yaml
- assertVisible:
    text: '^\ \ Maestro\ café\ 👋\

      second\ line\ \ $'
