appId: dev.ipf.whitenoise.android.maestrolab
name: inbound-share-reselect-stage
---
- runFlow: ../fixtures/select-fixture-share-recipient.yaml
- tapOn: Maestro group
- assertVisible:
    id: performance.share_picker
- assertVisible:
    text: ^Maestro group$
- assertVisible:
    enabled: false
    containsChild:
      text: ^Share$
- tapOn: Maestro group
- assertVisible:
    id: performance.share_picker
- assertVisible:
    text: ^Maestro group$
- assertVisible:
    enabled: true
    text: ^Share to 1 chat$
- tapOn:
    text: ^Share to 1 chat$
- assertNotVisible:
    id: performance.share_picker
- runFlow: ../fixtures/assert-fixture-conversation.yaml
- assertVisible:
    text: '^\ \ Maestro\ café\ 👋\

      second\ line\ \ $'
