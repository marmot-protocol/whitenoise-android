appId: dev.ipf.whitenoise.android.maestrolab
name: preferences-dark
---
- assertVisible: "Maestro group"
- tapOn: "Open settings.*"
- assertVisible: "Settings"
- scrollUntilVisible:
    element:
      text: "Appearance"
    direction: DOWN
- tapOn: "Appearance"
- tapOn: "Dark"
- back
- tapOn: "Appearance"
- assertVisible:
    id: "appearance.theme.group"
