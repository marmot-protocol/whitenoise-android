appId: dev.ipf.whitenoise.android.maestrolab
name: settings-read-aloud
---
- runFlow: ../fixtures/runtime-ready.yaml
# The instrumentation host owns launch, reset and disposal.
- assertVisible: "Maestro group"
- tapOn: "Open settings.*"
- assertVisible: "Settings"
- scrollUntilVisible:
    element:
      text: "Read Aloud"
    direction: DOWN
- tapOn: "Read Aloud"
- assertVisible:
    id: "speech.engine.group"
- tapOn: "Back"
- assertVisible: "Settings"
- tapOn: "Back"
- assertVisible: "Maestro group"
