appId: dev.ipf.whitenoise.android.maestrolab
name: nested-bug-report
---
- runFlow: ../fixtures/runtime-ready.yaml
- assertVisible: "Maestro group"
- runFlow: ../fixtures/open-settings.yaml
- assertVisible: "Settings"
- scrollUntilVisible:
    element:
      text: "Help"
    direction: DOWN
- tapOn: "Help"
- tapOn:
    id: "help.report_bug"
- assertVisible:
    id: "help.bug.destination"
- assertVisible:
    id: "help.bug.open"
- back
- assertVisible:
    id: "help.destinations"
