appId: dev.ipf.whitenoise.android.maestrolab
name: inbound-share-deselect-cancel
---
- runFlow: ../fixtures/runtime-share-text-ready.yaml
- &id001
  assertVisible:
    id: performance.share_picker
- &id002
  assertVisible:
    text: ^Maestro group$
- &id003
  assertVisible:
    enabled: false
    text: ^Share$
- tapOn: Maestro group
- assertVisible:
    id: performance.share_picker
- assertVisible:
    text: ^Maestro group$
- assertVisible:
    enabled: true
    text: ^Share to 1 chat$
- tapOn: Maestro group
- *id001
- *id002
- *id003
- tapOn: Close
- assertNotVisible: Some files could not be imported
- assertNotVisible:
    id: performance.share_picker
- assertVisible:
    text: ^Maestro group$
