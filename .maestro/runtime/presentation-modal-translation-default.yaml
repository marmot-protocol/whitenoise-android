appId: dev.ipf.whitenoise.android.maestrolab
name: presentation-modal-translation-default
---
- runFlow: ../fixtures/emulator-interruption.yaml
- assertVisible:
    id: translation.menu
- tapOn:
    id: translation.menu
- assertVisible: "Offline Translator can write message text.*"
- tapOn: Accept
- assertVisible:
    text: Translate
    checked: true
- assertVisible:
    id: presentation.complete
