appId: dev.ipf.whitenoise.android.maestrolab
name: chatstate-pin-round-trip
---
- runFlow: ../fixtures/runtime-ready.yaml
- assertVisible: "Maestro group"
- longPressOn:
    text: "Maestro group"
- assertVisible: "Pin"
- tapOn: "Select"
- assertVisible:
    id: "chats.selectionControls"
- tapOn: "Pin"
- assertVisible:
    text: "Unpin"
    enabled: true
- back
- longPressOn:
    text: "Maestro group"
- tapOn: "Select"
- assertVisible:
    id: "chats.selectionControls"
- tapOn: "Unpin"
- assertVisible:
    text: "Pin"
    enabled: true
- back
- longPressOn:
    text: "Maestro group"
- assertVisible: "Pin"
- back
