appId: dev.ipf.whitenoise.android.maestrolab
name: profiles-admin-confirm-back
---
- runFlow: ../fixtures/runtime-ready.yaml
- assertVisible: "Maestro group"
- tapOn: "Maestro group"
- assertVisible: "Generated fixture message"
- tapOn: "Maestro group"
- assertVisible:
    id: "chat_info.list"
- scrollUntilVisible:
    element:
      text: "Maestro Bob"
    direction: DOWN
- tapOn: "Maestro Bob"
- assertVisible: "User Profile"
- scrollUntilVisible:
    element:
      text: "Make Admin"
    direction: DOWN
- tapOn: "Make Admin"
- assertVisible: "Make Maestro Bob an admin[?]"
- back
- assertNotVisible: "Make Maestro Bob an admin[?]"
- assertVisible: "User Profile"
- assertVisible: "Make Admin"
