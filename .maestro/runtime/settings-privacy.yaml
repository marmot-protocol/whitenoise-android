appId: dev.ipf.whitenoise.android.maestrolab
name: settings-privacy
---
# The instrumentation host owns launch, reset and disposal.
- assertVisible: "Maestro group"
- tapOn: "Open settings.*"
- assertVisible: "Settings"
- scrollUntilVisible:
    element:
      text: "Privacy & Security"
    direction: DOWN
- tapOn: "Privacy & Security"
- assertVisible:
    id: "privacy.device_protection.group"
- tapOn: "Back"
- assertVisible: "Settings"
- tapOn: "Back"
- assertVisible: "Maestro group"
