appId: dev.ipf.whitenoise.android.maestrolab
name: preferences-font-cancel
---
- runFlow: ../fixtures/runtime-ready.yaml
- assertVisible: "Maestro group"
- runFlow: ../fixtures/open-settings.yaml
- assertVisible: "Settings"
- scrollUntilVisible:
    element:
      text: "Appearance"
    direction: DOWN
- tapOn: "Appearance"
- scrollUntilVisible:
    element:
      text: "Font size"
    direction: DOWN
- tapOn: "Font size"
- assertVisible: "Extra large"
- back
- assertVisible: "Default"
- assertNotVisible: "Extra large"
