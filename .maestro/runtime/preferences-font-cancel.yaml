appId: dev.ipf.whitenoise.android.maestrolab
name: preferences-font-cancel
---
- runFlow: ../fixtures/runtime-ready.yaml
- assertVisible: "Maestro group"
- runFlow: ../fixtures/open-settings.yaml
- assertVisible: "Settings"
- scrollUntilVisible:
    element:
      text: "Appearance"
    direction: DOWN
- tapOn: "Appearance"
- scrollUntilVisible:
    element:
      text: "Font size"
    direction: DOWN
- tapOn: "Font size"
- assertVisible:
    id: "font_size.preview"
- assertVisible: "Extra large"
- back
- assertVisible: "Default"
- assertNotVisible: "Extra large"
- scrollUntilVisible:
    element:
      text: "App font"
    direction: UP
- tapOn: "App font"
- assertVisible:
    id: "font_family.preview.viewport"
- assertVisible:
    id: "font_family.system"
- assertVisible:
    id: "font_family.done"
- tapOn:
    id: "font_family.done"
- assertNotVisible:
    id: "font_family.dialog"
- scrollUntilVisible:
    element:
      text: "Date and time"
    direction: DOWN
- tapOn: "Date and time"
- assertVisible:
    id: "date_time_format.dialog"
- assertVisible:
    id: "date_time_format.time.automatic"
- assertVisible:
    id: "date_time_format.date.automatic"
- tapOn: "Done"
- assertNotVisible:
    id: "date_time_format.dialog"
