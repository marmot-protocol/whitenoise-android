appId: dev.ipf.whitenoise.android.maestrolab
name: inbound-share-documents-multiple-remove
---
- runFlow: ../fixtures/runtime-share-text-ready.yaml
- assertVisible:
    id: performance.share_picker
- assertVisible:
    text: ^Maestro group$
- assertVisible:
    enabled: false
    text: ^Share$
- tapOn: Maestro group
- assertVisible:
    enabled: true
    text: ^Share to 1 chat$
- tapOn:
    text: ^Share to 1 chat$
- assertNotVisible:
    id: performance.share_picker
- runFlow: ../fixtures/assert-fixture-conversation.yaml
- assertVisible:
    id: conversation.composer.attachment.0
- assertVisible:
    id: conversation.composer.attachment.1
- assertNotVisible:
    id: conversation.composer.attachment.2
- tapOn: 'Remove attachment: maestro-document.md'
- assertNotVisible: 'Remove attachment: maestro-document.md'
- tapOn: 'Remove attachment: maestro-table.csv'
- assertNotVisible: 'Remove attachment: maestro-table.csv'
- assertNotVisible:
    id: conversation.composer.attachment.0
- assertVisible:
    enabled: false
    text: ^Send$
