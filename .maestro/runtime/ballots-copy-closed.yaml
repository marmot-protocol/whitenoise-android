appId: dev.ipf.whitenoise.android.maestrolab
name: ballots-copy-closed
---
- runFlow: ../fixtures/runtime-ready.yaml
- assertVisible: "Maestro group"
- tapOn: "Maestro group"
- assertVisible: "Maestro fixture poll"
- extendedWaitUntil:
    visible: "Poll closed"
    timeout: 30000
- assertVisible: "Poll closed"
- longPressOn:
    text: "Maestro fixture poll"
- assertVisible: "Copy"
- tapOn: "Copy"
- assertNotVisible: "Copy"
- assertVisible: "Maestro fixture poll"
