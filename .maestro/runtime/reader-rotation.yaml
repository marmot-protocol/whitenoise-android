appId: dev.ipf.whitenoise.android.maestrolab
name: reader-rotation
---
- assertVisible: "Maestro group"
- tapOn: "Maestro group"
- scrollUntilVisible:
    element:
      text: "Read More"
    direction: UP
- tapOn: "Read More"
- assertVisible:
    id: "message-full-screen"
- assertVisible: "Maestro reader heading"
- setOrientation: LANDSCAPE_LEFT
- assertVisible:
    id: "message-full-screen"
- setOrientation: PORTRAIT
- assertVisible:
    id: "message-full-screen"
- back
- assertNotVisible:
    id: "message-full-screen"
- assertVisible: "Read More"
