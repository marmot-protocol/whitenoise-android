appId: dev.ipf.whitenoise.android.maestrolab
name: reader-rotation
---
- runFlow: ../fixtures/runtime-ready.yaml
- assertVisible: "Maestro group"
- tapOn: "Maestro group"
- scrollUntilVisible:
    element:
      text: "Read More"
    direction: UP
- tapOn: "Read More"
- assertVisible:
    id: "composer-pill-surface"
- setOrientation: LANDSCAPE_LEFT
- assertVisible:
    id: "composer-pill-surface"
- setOrientation: PORTRAIT
- scrollUntilVisible:
    element:
      text: "Maestro reader heading"
    direction: UP
- assertVisible: "Maestro reader heading"
- longPressOn:
    text: "Maestro reader heading"
- assertVisible: "Show less"
- back
