appId: dev.ipf.whitenoise.android.maestrolab
name: inbound-share-picker-rotation
---
- runFlow: ../fixtures/runtime-share-text-ready.yaml
- assertVisible:
    id: performance.share_picker
- assertVisible:
    text: ^Maestro group$
- assertVisible:
    enabled: false
    containsChild:
      text: ^Share$
- setOrientation: LANDSCAPE_LEFT
- assertVisible:
    id: performance.share_picker
- runFlow: ../fixtures/share-recipient-visible.yaml
- assertVisible:
    enabled: false
    containsChild:
      text: ^Share$
- setOrientation: PORTRAIT
- assertVisible:
    id: performance.share_picker
- assertVisible:
    text: ^Maestro group$
- assertVisible:
    enabled: false
    containsChild:
      text: ^Share$
- tapOn: Close
- assertNotVisible: Some files could not be imported
- assertNotVisible:
    id: performance.share_picker
- runFlow: ../fixtures/runtime-ready.yaml
