appId: dev.ipf.whitenoise.android.maestrolab
name: speech-rate-back
---
- runFlow: ../fixtures/runtime-ready.yaml
- assertVisible: Maestro group
- runFlow: ../fixtures/open-settings.yaml
- assertVisible: Settings
- scrollUntilVisible:
    element:
      text: Read Aloud
    direction: DOWN
- tapOn: Read Aloud
- assertVisible:
    id: speech.engine.group
- tapOn: Speech rate
- assertVisible: System \(follow device setting\)
- assertVisible: Custom
- back
- assertVisible:
    id: speech.engine.group
