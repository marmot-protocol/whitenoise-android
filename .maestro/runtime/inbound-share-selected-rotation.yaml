appId: dev.ipf.whitenoise.android.maestrolab
name: inbound-share-selected-rotation
---
- runFlow: ../fixtures/select-fixture-share-recipient.yaml
- setOrientation: LANDSCAPE_LEFT
- assertVisible:
    id: performance.share_picker
- runFlow: ../fixtures/share-recipient-visible.yaml
- assertVisible:
    enabled: true
    text: ^Share to 1 chat$
- setOrientation: PORTRAIT
- assertVisible:
    id: performance.share_picker
- assertVisible:
    text: ^Maestro group$
- assertVisible:
    enabled: true
    text: ^Share to 1 chat$
- tapOn:
    text: ^Share to 1 chat$
- assertNotVisible:
    id: performance.share_picker
- runFlow: ../fixtures/assert-fixture-conversation.yaml
- assertVisible:
    text: '^\ \ Maestro\ café\ 👋\

      second\ line\ \ $'
