appId: dev.ipf.whitenoise.android.maestrolab
name: presentation-startup-retryable
---
- runFlow: ../fixtures/emulator-interruption.yaml
- assertVisible:
    id: startup-failure
- assertVisible: Disposable startup failure
- assertNotVisible:
    id: startup-share-diagnostics
- assertVisible:
    id: startup-retry
    enabled: true
- tapOn:
    id: startup-retry
- assertVisible:
    id: presentation.complete
