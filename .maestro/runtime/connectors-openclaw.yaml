appId: dev.ipf.whitenoise.android.maestrolab
name: connectors-openclaw
---
- runFlow: ../fixtures/runtime-ready.yaml
- assertVisible: "Maestro group"
- runFlow: ../fixtures/open-settings.yaml
- assertVisible: "Settings"
- scrollUntilVisible:
    element:
      text: "AI Agents"
    direction: DOWN
- tapOn: "AI Agents"
- tapOn:
    id: "ai_agents.connector.openclaw"
- assertVisible:
    id: "ai_agents.prompt.openclaw"
- assertVisible:
    id: "ai_agents.copy.openclaw"
- back
- assertNotVisible:
    id: "ai_agents.setup_content"
- assertVisible:
    id: "ai_agents.connectors"
