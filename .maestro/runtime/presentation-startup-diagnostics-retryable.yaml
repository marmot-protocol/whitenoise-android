appId: dev.ipf.whitenoise.android.maestrolab
name: presentation-startup-diagnostics-retryable
---
- runFlow: ../fixtures/emulator-interruption.yaml
- assertVisible:
    id: startup-failure
- assertVisible: Disposable startup failure
- assertVisible: '^Includes startup stages, timings and build information[.] No messages or account details[.]$'
- assertVisible:
    id: startup-copy-report
    enabled: true
- assertVisible:
    id: startup-retry
    enabled: true
- assertNotVisible:
    id: presentation.complete
- assertVisible:
    id: startup-share-diagnostics
    enabled: true
- tapOn:
    id: startup-share-diagnostics
- assertVisible:
    id: presentation.complete
