appId: dev.ipf.whitenoise.android.maestrolab
name: keys-cancel-clears
---
- runFlow: ../fixtures/runtime-ready.yaml
- assertVisible: "Maestro group"
- runFlow: ../fixtures/open-settings.yaml
- assertVisible: "Settings"
- tapOn: "Profile Keys"
- assertVisible: "Private key hidden"
- tapOn: "Export Encrypted Private Key"
- assertVisible: "Encrypted Private Key"
- tapOn: "Password"
- inputText: "Maestro-test1!"
- tapOn: "Confirm password"
- inputText: "Maestro-test1!"
- hideKeyboard
- assertVisible:
    text: "View backup"
    enabled: true
- assertVisible:
    text: "Export"
    enabled: true
- tapOn: "Cancel"
- assertVisible: "Private key hidden"
- assertNotVisible: "Encrypted Private Key"
- tapOn: "Export Encrypted Private Key"
- assertVisible: "Encrypted Private Key"
- hideKeyboard
- assertVisible:
    text: "View backup"
    enabled: false
- assertVisible:
    text: "Export"
    enabled: false
- tapOn: "Cancel"
- assertVisible: "Private key hidden"
- assertNotVisible: "Encrypted Private Key"
