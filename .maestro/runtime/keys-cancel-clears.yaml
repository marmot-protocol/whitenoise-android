appId: dev.ipf.whitenoise.android.maestrolab
name: keys-cancel-clears
---
- runFlow: ../fixtures/runtime-ready.yaml
- assertVisible: "Maestro group"
- runFlow: ../fixtures/open-settings.yaml
- assertVisible: "Settings"
- tapOn: "Profile Keys"
- assertVisible: "Private key hidden"
- runFlow: ../fixtures/open-encrypted-key-editor.yaml
- assertVisible: "Encrypted Private Key"
- tapOn: "Password"
- inputText: "Maestro-test1!"
- tapOn: "Confirm password"
- inputText: "Maestro-test1!"
- hideKeyboard
- assertVisible:
    id: "profile_keys.view_backup"
    enabled: true
- assertVisible:
    id: "profile_keys.export_file"
    enabled: true
- tapOn: "Cancel"
- assertVisible: "Private key hidden"
- assertNotVisible: "Encrypted Private Key"
- runFlow: ../fixtures/open-encrypted-key-editor.yaml
- assertVisible: "Encrypted Private Key"
- assertVisible:
    id: "profile_keys.export_password"
- assertNotVisible:
    id: "profile_keys.export_password"
    text: ".+"
- assertVisible:
    id: "profile_keys.export_confirmation"
- assertNotVisible:
    id: "profile_keys.export_confirmation"
    text: ".+"
- assertVisible:
    id: "profile_keys.view_backup"
    enabled: false
- assertVisible:
    id: "profile_keys.export_file"
    enabled: false
- tapOn: "Cancel"
- assertVisible: "Private key hidden"
- assertNotVisible: "Encrypted Private Key"
