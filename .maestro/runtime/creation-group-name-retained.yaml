appId: dev.ipf.whitenoise.android.maestrolab
name: creation-group-name-retained
---
- assertVisible: "Maestro group"
- tapOn: "New Message"
- assertVisible:
    id: "new_message.screen"
- tapOn: "New Group"
- assertVisible:
    id: "new_group.screen"
- tapOn:
    id: "new_group.continue"
- assertVisible:
    id: "group_setup.screen"
- tapOn:
    id: "group_setup.name"
- inputText: "Maestro retained name"
- hideKeyboard
- back
- tapOn:
    id: "new_group.continue"
- assertVisible: "Maestro retained name"
