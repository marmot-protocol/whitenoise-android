appId: dev.ipf.whitenoise.android.maestrolab
name: lifecycle-advanced-gestures-warm-resume
---
- runFlow:
    file: ../fixtures/open-fixture-settings-hub-destination.yaml
    env:
      SETTINGS_HUB: "Chats"
      SETTINGS_HUB_GROUP: "settings.chats.group"
      SETTINGS_DESTINATION: Swipe actions
- assertVisible:
    id: gestures.MessageLeft
- runFlow: ../fixtures/runtime-warm-resume.yaml
- assertVisible:
    id: gestures.MessageLeft
- back
- assertVisible:
    id: "settings.chats.group"
- back
- assertVisible: Settings
