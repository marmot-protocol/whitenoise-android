appId: dev.ipf.whitenoise.android.maestrolab
name: lifecycle-advanced-gestures-warm-resume
---
- runFlow: ../fixtures/runtime-ready.yaml
- assertVisible: Maestro group
- runFlow: ../fixtures/open-settings.yaml
- assertVisible: Settings
- scrollUntilVisible:
    element:
      text: Swipe actions
    direction: DOWN
- tapOn: Swipe actions
- &id001
  assertVisible:
    id: gestures.MessageLeft
- runFlow: ../fixtures/runtime-warm-resume.yaml
- *id001
- back
- assertVisible: Settings
