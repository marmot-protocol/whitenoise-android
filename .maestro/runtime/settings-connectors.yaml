appId: dev.ipf.whitenoise.android.maestrolab
name: settings-connectors
---
- runFlow: ../fixtures/runtime-ready.yaml
# The instrumentation host owns launch, reset and disposal.
- assertVisible: "Maestro group"
- runFlow: ../fixtures/open-settings.yaml
- assertVisible: "Settings"
- scrollUntilVisible:
    element:
      text: "AI Agents"
    direction: DOWN
- tapOn: "AI Agents"
- assertVisible:
    id: "ai_agents.connectors"
- scrollUntilVisible:
    element:
      id: "ai_agents.review_key"
    direction: DOWN
- tapOn:
    id: "ai_agents.review_key"
- assertVisible:
    id: "ai_agents.key_input"
- assertVisible:
    id: "ai_agents.key_action"
    enabled: false
- tapOn: "Back"
- assertVisible: "AI Agents"
- tapOn: "Back"
- assertVisible: "Settings"
- tapOn: "Back"
- assertVisible: "Maestro group"
