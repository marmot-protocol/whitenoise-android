appId: dev.ipf.whitenoise.android.maestrolab
name: qr-permission-permanent-close
---
- runFlow: ../fixtures/runtime-qr-denied-ready.yaml
- tapOn:
    text: ^(Allow Camera|Open settings)$
- assertVisible:
    id: com.android.permissioncontroller:id/permission_deny_button
- tapOn:
    id: com.android.permissioncontroller:id/permission_deny_button
- assertVisible:
    text: ^Scan QR Code$
- assertVisible:
    text: ^Camera Access Needed$
- assertVisible:
    enabled: true
    containsChild:
      text: ^(Allow Camera|Open settings)$
- assertVisible:
    text: ^Open settings$
- tapOn:
    text: ^Close$
- assertNotVisible:
    text: ^Scan QR Code$
- assertVisible:
    id: share_connect.screen
- assertVisible: Maestro Alice
- back
- assertVisible: Settings
- assertVisible: Maestro Alice
- back
- assertVisible: Maestro group
