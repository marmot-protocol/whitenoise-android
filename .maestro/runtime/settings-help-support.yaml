appId: dev.ipf.whitenoise.android.maestrolab
name: settings-help-support
---
- runFlow: ../fixtures/runtime-ready.yaml
# The instrumentation host owns launch, reset and disposal.
- assertVisible: "Maestro group"
- runFlow: ../fixtures/open-settings.yaml
- assertVisible: "Settings"
- scrollUntilVisible:
    element:
      text: "Help & support"
    direction: DOWN
- tapOn: "Help & support"
- assertVisible:
    id: "settings.help_support.group"
- tapOn: "Learn White Noise"
- assertVisible: "Find someone"
- tapOn: "Next"
- assertVisible: "Share your profile"
- tapOn: "Next"
- tapOn: "Show message actions"
- assertVisible: "Choose Reply to quote the message in your response, or choose an emoji to react."
- tapOn: "Close"
- assertVisible:
    id: "settings.help_support.group"
- tapOn: "Back"
- assertVisible: "Settings"
- tapOn: "Back"
- assertVisible: "Maestro group"
