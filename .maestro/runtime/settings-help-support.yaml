appId: dev.ipf.whitenoise.android.maestrolab
name: settings-help-support
---
- runFlow: ../fixtures/runtime-ready.yaml
# The instrumentation host owns launch, reset and disposal.
- assertVisible: "Maestro group"
- runFlow: ../fixtures/open-settings.yaml
- assertVisible: "Settings"
- scrollUntilVisible:
    element:
      text: "Help & support"
    direction: DOWN
- tapOn: "Help & support"
- assertVisible:
    id: "settings.help_support.group"
- tapOn: "Learn White Noise"
- assertVisible: "Share your profile"
- tapOn: "Next"
- assertVisible: "Find someone"
- tapOn: "Next"
- assertVisible: "Make a private group"
- tapOn: "Next"
- assertVisible: "Reply or react"
- scrollUntilVisible:
    element:
      text: "See you tomorrow!"
    direction: DOWN
- longPressOn: "See you tomorrow!"
- assertVisible: "Practice message · nothing is sent"
- tapOn: "Reply"
- assertVisible: "Demo contact"
- scrollUntilVisible:
    element:
      text: "Next"
    direction: DOWN
- tapOn: "Next"
- assertVisible: "Chat across apps"
- assertVisible: "Explore Marmot apps"
- tapOn: "Done"
- assertVisible:
    id: "settings.help_support.group"
- tapOn: "Back"
- assertVisible: "Settings"
- tapOn: "Back"
- assertVisible: "Maestro group"
