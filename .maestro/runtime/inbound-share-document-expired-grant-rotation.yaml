appId: dev.ipf.whitenoise.android.maestrolab
name: inbound-share-document-expired-grant-rotation
---
- runFlow: ../fixtures/stage-fixture-shared-document.yaml
- assertNotVisible:
    id: conversation.composer.attachment.1
- setOrientation: LANDSCAPE_LEFT
- runFlow: ../fixtures/assert-fixture-conversation.yaml
- assertVisible:
    id: conversation.composer.attachment.0
- assertNotVisible:
    id: conversation.composer.attachment.1
- setOrientation: PORTRAIT
- runFlow: ../fixtures/assert-fixture-conversation.yaml
- assertVisible:
    id: conversation.composer.attachment.0
- assertNotVisible:
    id: conversation.composer.attachment.1
- extendedWaitUntil:
    notVisible:
      id: conversation.attachments.preparing
    timeout: 15000
- tapOn:
    id: conversation.composer.attachment.0
- assertVisible:
    id: text-attachment-reader
- assertNotVisible: Share
- assertNotVisible: Read aloud
- back
- assertVisible:
    id: conversation.composer.attachment.0
