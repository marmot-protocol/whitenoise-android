appId: dev.ipf.whitenoise.android.maestrolab
name: reactions-configure-rotation
---
- runFlow: ../fixtures/runtime-ready.yaml
- assertVisible: Maestro group
- tapOn: Maestro group
- runFlow: ../fixtures/assert-fixture-conversation.yaml
- longPressOn:
    text: Generated fixture message
- tapOn: Open emoji picker
- assertVisible: "Search emoji"
- assertVisible: "Smileys & People"
- tapOn: Configure Reactions
- assertVisible: Tap an emoji to replace it\.
- setOrientation: LANDSCAPE_LEFT
- assertVisible: Tap an emoji to replace it\.
- setOrientation: PORTRAIT
- assertVisible: Tap an emoji to replace it\.
# Material may expose an intermediate partial anchor after rotation.
- back
- waitForAnimationToEnd:
    timeout: 2000
- runFlow:
    when:
      visible: Tap an emoji to replace it\.
    commands:
      - back
- assertNotVisible: Tap an emoji to replace it\.
- assertNotVisible: Search emoji
- assertNotVisible: Configure Reactions
- runFlow: ../fixtures/assert-fixture-conversation.yaml
