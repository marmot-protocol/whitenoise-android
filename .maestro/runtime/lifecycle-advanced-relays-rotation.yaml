appId: dev.ipf.whitenoise.android.maestrolab
name: lifecycle-advanced-relays-rotation
---
- runFlow:
    file: ../fixtures/open-fixture-settings-hub-destination.yaml
    env:
      SETTINGS_HUB: "Account"
      SETTINGS_HUB_GROUP: "settings.account.group"
      SETTINGS_DESTINATION: Relays
- runFlow: ../fixtures/assert-relays-list.yaml
- setOrientation: LANDSCAPE_LEFT
- runFlow: ../fixtures/assert-relays-list.yaml
- setOrientation: PORTRAIT
- runFlow: ../fixtures/assert-relays-list.yaml
- back
- assertVisible:
    id: "settings.account.group"
- back
- assertVisible: Settings
