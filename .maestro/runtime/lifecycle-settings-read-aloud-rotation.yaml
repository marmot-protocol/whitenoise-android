appId: dev.ipf.whitenoise.android.maestrolab
name: lifecycle-settings-read-aloud-rotation
---
- runFlow:
    file: ../fixtures/open-fixture-settings-hub-destination.yaml
    env:
      SETTINGS_HUB: "Voice & language"
      SETTINGS_HUB_GROUP: "settings.voice_language.group"
      SETTINGS_DESTINATION: Read Aloud
- assertVisible:
    id: speech.engine.group
- setOrientation: LANDSCAPE_LEFT
- assertVisible:
    id: speech.engine.group
- setOrientation: PORTRAIT
- assertVisible:
    id: speech.engine.group
- tapOn: Back
- assertVisible:
    id: "settings.voice_language.group"
- tapOn: "Back"
- assertVisible: Settings
- tapOn: Back
- assertVisible: Maestro group
