appId: dev.ipf.whitenoise.android.maestrolab
name: lifecycle-settings-privacy-warm-resume
---
- runFlow: ../fixtures/runtime-ready.yaml
- assertVisible: Maestro group
- runFlow: ../fixtures/open-settings.yaml
- assertVisible: Settings
- scrollUntilVisible:
    element:
      text: Privacy & Security
    direction: DOWN
- tapOn: Privacy & Security
- assertVisible:
    id: privacy.device_protection.group
- runFlow: ../fixtures/runtime-warm-resume.yaml
- assertVisible:
    id: privacy.device_protection.group
- tapOn: Back
- assertVisible: Settings
- tapOn: Back
- assertVisible: Maestro group
