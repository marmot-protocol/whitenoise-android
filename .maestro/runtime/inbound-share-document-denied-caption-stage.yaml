appId: dev.ipf.whitenoise.android.maestrolab
name: inbound-share-document-denied-caption-stage
---
- runFlow: ../fixtures/runtime-share-error-ready.yaml
- assertVisible:
    text: ^A file is unreadable or its access expired\.$
- assertVisible:
    text: '^Files not imported: 1$'
- tapOn: Share to
- assertVisible:
    id: performance.share_picker
- assertVisible:
    text: ^Maestro group$
- assertVisible:
    enabled: false
    containsChild:
      text: ^Share$
- tapOn: Maestro group
- assertVisible:
    enabled: true
    text: ^Share to 1 chat$
- tapOn:
    text: ^Share to 1 chat$
- assertNotVisible:
    id: performance.share_picker
- runFlow: ../fixtures/assert-fixture-conversation.yaml
- assertNotVisible:
    id: conversation.composer.attachment.0
- assertVisible:
    text: '^\ \ Maestro\ café\ 👋\

      second\ line\ \ $'
