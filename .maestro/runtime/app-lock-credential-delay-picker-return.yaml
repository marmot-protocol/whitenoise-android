appId: dev.ipf.whitenoise.android.maestrolab
name: app-lock-credential-delay-picker-return
---
- runFlow: ../fixtures/runtime-credential-privacy.yaml
- runFlow: ../fixtures/cancel-device-pin.yaml
- runFlow: ../fixtures/retry-device-pin.yaml
- runFlow: ../fixtures/open-credential-privacy.yaml
- scrollUntilVisible:
    element:
      text: '(?s).*Auto-lock.*'
    direction: DOWN
- tapOn: '(?s).*Auto-lock.*'
- tapOn: '^Immediately$'
- assertNotVisible: Cancel
- tapOn: '(?s).*Auto-lock.*'
- assertVisible:
    checked: true
    containsChild:
      text: '^Immediately$'
- tapOn: '^After 1 minute$'
- assertNotVisible: Cancel
- tapOn: '(?s).*Auto-lock.*'
- assertVisible:
    checked: true
    containsChild:
      text: '^After 1 minute$'
- tapOn: '^After 5 minutes$'
- assertNotVisible: Cancel
- tapOn: '(?s).*Auto-lock.*'
- assertVisible:
    checked: true
    containsChild:
      text: '^After 5 minutes$'
- scrollUntilVisible:
    element:
      text: '^After 15 minutes$'
    direction: DOWN
- tapOn: '^After 15 minutes$'
- assertNotVisible: Cancel
- tapOn: '(?s).*Auto-lock.*'
- runFlow: ../fixtures/assert-app-lock-delay-fifteen.yaml
- tapOn: Cancel
- tapOn: '(?s).*Auto-lock.*'
- runFlow: ../fixtures/assert-app-lock-delay-fifteen.yaml
- setOrientation: LANDSCAPE_LEFT
- runFlow: ../fixtures/assert-app-lock-delay-fifteen.yaml
- setOrientation: PORTRAIT
- runFlow: ../fixtures/assert-app-lock-delay-fifteen.yaml
- tapOn: Cancel
- assertNotVisible: Cancel
- tapOn: Back
- tapOn: Back
- assertVisible: Maestro group
