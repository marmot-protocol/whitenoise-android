appId: dev.ipf.whitenoise.android.maestrolab
name: support-entry-back
---
- runFlow: ../fixtures/runtime-ready.yaml
- assertVisible: "Maestro group"
- runFlow: ../fixtures/open-settings.yaml
- assertVisible: "Settings"
- scrollUntilVisible:
    element:
      text: "Help & support"
    direction: DOWN
- tapOn: "Help & support"
- assertVisible:
    id: "settings.help_support.group"
- scrollUntilVisible:
    element:
      text: "Chat with support"
    direction: DOWN
- tapOn: "Chat with support"
- assertVisible: "White Noise Support"
- assertVisible:
    id: "support.start"
- back
- assertVisible:
    id: "settings.help_support.group"
- back
- assertVisible: "Settings"
