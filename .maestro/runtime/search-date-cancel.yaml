appId: dev.ipf.whitenoise.android.maestrolab
name: search-date-cancel
---
- runFlow: ../fixtures/runtime-ready.yaml
- assertVisible: "Maestro group"
- tapOn: "Search chats"
- hideKeyboard
- tapOn:
    id: "chat-list-search-filters-action"
- tapOn:
    id: "chat-list-search-filter-menu-Date"
- assertVisible: "Date"
- tapOn: "Today"
- tapOn: "Cancel"
- assertNotVisible:
    id: "chat-list-search-filter-chip-date:.*"
- assertVisible:
    id: "chats.searchField"
- back
- assertVisible: "Maestro group"
