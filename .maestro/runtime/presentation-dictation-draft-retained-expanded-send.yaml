appId: dev.ipf.whitenoise.android.maestrolab
name: presentation-dictation-draft-retained-expanded-send
---
- runFlow: ../fixtures/emulator-interruption.yaml
- assertVisible: Draft
- tapOn: Produce failed dictation result
- assertVisible: Draft recognized
- assertNotVisible:
    id: dictation-recovery-panel
- assertNotVisible:
    id: dictation-partial-send-dialog
- assertNotVisible:
    id: dictation-discard-confirmation
- tapOn: Record compact composer geometry
- swipe:
    from:
      id: composer-resize-gesture
    direction: UP
    duration: 1000
- assertVisible: Draft recognized
- tapOn: Check expanded composer geometry
- tapOn: Send
- assertVisible: Message
- tapOn: Check cleared editor
- assertVisible:
    id: presentation.complete
