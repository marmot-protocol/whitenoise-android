appId: dev.ipf.whitenoise.android.maestrolab
name: lifecycle-settings-data-warm-resume
---
- runFlow: ../fixtures/runtime-ready.yaml
- assertVisible: Maestro group
- runFlow: ../fixtures/open-settings.yaml
- assertVisible: Settings
- scrollUntilVisible:
    element:
      text: Data Usage
    direction: DOWN
- tapOn: Data Usage
- &id001
  assertVisible:
    id: data_usage.downloads.group
- runFlow: ../fixtures/runtime-warm-resume.yaml
- *id001
- tapOn: Back
- assertVisible: Settings
- tapOn: Back
- assertVisible: Maestro group
