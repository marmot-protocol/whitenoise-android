appId: dev.ipf.whitenoise.android.maestrolab
name: advanced-folder-create-cancel
---
- runFlow: ../fixtures/runtime-ready.yaml
- assertVisible: "Maestro group"
- runFlow: ../fixtures/open-settings.yaml
- assertVisible: "Settings"
- scrollUntilVisible:
    element:
      text: "Folders"
    direction: DOWN
- tapOn: "Folders"
- tapOn: "New Folder"
- assertVisible:
    id: "folder.name"
- tapOn:
    id: "folder.name"
- inputText: "Maestro cancelled folder"
- hideKeyboard
- back
- assertVisible: "Discard changes[?]"
- tapOn: "Discard Changes"
- assertVisible:
    id: "chat-folders-content"
- assertNotVisible: "Maestro cancelled folder"
