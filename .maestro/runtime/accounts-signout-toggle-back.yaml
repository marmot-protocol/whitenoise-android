appId: dev.ipf.whitenoise.android.maestrolab
name: accounts-signout-toggle-back
---
- runFlow: ../fixtures/runtime-ready.yaml
- assertVisible: "Maestro group"
- runFlow: ../fixtures/open-signout-sheet.yaml
- assertVisible:
    containsDescendants:
      - text: "Remove invitation keys from relays"
    checked: true
- tapOn: "Remove invitation keys from relays"
- assertVisible:
    containsDescendants:
      - text: "Remove invitation keys from relays"
    checked: false
- back
- assertVisible: "Settings"
- runFlow: ../fixtures/show-signout-sheet.yaml
- assertVisible:
    containsDescendants:
      - text: "Remove invitation keys from relays"
    checked: true
- back
- assertNotVisible: "Stays on this device"
- assertVisible: "Settings"
- back
- assertVisible: "Maestro group"
- tapOn: "Maestro group"
- assertVisible: "Generated fixture message"
