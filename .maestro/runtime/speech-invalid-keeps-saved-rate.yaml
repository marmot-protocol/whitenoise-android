appId: dev.ipf.whitenoise.android.maestrolab
name: speech-invalid-keeps-saved-rate
---
- runFlow: ../fixtures/runtime-ready.yaml
- assertVisible: Maestro group
- runFlow: ../fixtures/open-settings.yaml
- assertVisible: Settings
- scrollUntilVisible:
    element:
      text: Read Aloud
    direction: DOWN
- tapOn: Read Aloud
- assertVisible:
    id: speech.engine.group
- tapOn: Speech rate
- runFlow: ../fixtures/scroll-speech-custom.yaml
- tapOn: Custom
- assertVisible:
    id: speech.custom_rate
- tapOn:
    id: speech.custom_rate
- longPressOn:
    id: speech.custom_rate
- runFlow:
    when:
      visible: (?i)select all
    commands:
    - tapOn: (?i)select all
- assertVisible:
    id: speech.custom_rate
    focused: true
- eraseText: 100
- assertNotVisible:
    id: speech.custom_rate
    text: .+
- inputText: '2.75'
- assertVisible:
    id: speech.custom_rate
    text: ^2\.75$
- hideKeyboard
- tapOn: Apply
- assertNotVisible:
    id: speech.custom_rate
- assertVisible: 2\.8×
- tapOn: Speech rate
- runFlow: ../fixtures/scroll-speech-custom.yaml
- tapOn: Custom
- assertVisible:
    id: speech.custom_rate
- tapOn:
    id: speech.custom_rate
- longPressOn:
    id: speech.custom_rate
- runFlow:
    when:
      visible: (?i)select all
    commands:
    - tapOn: (?i)select all
- assertVisible:
    id: speech.custom_rate
    focused: true
- eraseText: 100
- assertNotVisible:
    id: speech.custom_rate
    text: .+
- inputText: '10.01'
- assertVisible:
    id: speech.custom_rate
    text: ^10\.01$
- hideKeyboard
- tapOn: Apply
- assertVisible:
    id: speech.custom_rate
    text: ^10\.01$
- assertVisible: Enter a rate from 0\.1× to 10\.0×\.
- tapOn: Cancel
- assertNotVisible:
    id: speech.custom_rate
- assertVisible: 2\.8×
- back
- assertVisible: Settings
- tapOn: Read Aloud
- assertVisible:
    id: speech.engine.group
- assertVisible: 2\.8×
