appId: dev.ipf.whitenoise.android.maestrolab
name: settings-help
---
# The instrumentation host owns launch, reset and disposal.
- assertVisible: "Maestro group"
- tapOn: "Open settings.*"
- assertVisible: "Settings"
- scrollUntilVisible:
    element:
      text: "Help"
    direction: DOWN
- tapOn: "Help"
- assertVisible:
    id: "help.destinations"
- tapOn: "Back"
- assertVisible: "Settings"
- tapOn: "Back"
- assertVisible: "Maestro group"
