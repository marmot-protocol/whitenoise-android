- assertNotVisible:
    text: Step down as admin
- tapOn:
    text: Reopen group confirmation
- assertVisible:
    text: Step down as admin
- back
- assertNotVisible:
    text: Step down as admin
- tapOn:
    text: Reopen group confirmation
- assertVisible:
    text: Step down as admin
- tapOn:
