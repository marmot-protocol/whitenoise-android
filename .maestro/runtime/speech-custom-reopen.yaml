appId: dev.ipf.whitenoise.android.maestrolab
name: speech-custom-reopen
---
- runFlow: ../fixtures/runtime-ready.yaml
- assertVisible: Maestro group
- runFlow: ../fixtures/open-settings.yaml
- assertVisible: Settings
- scrollUntilVisible:
    element:
      text: Read Aloud
    direction: DOWN
- tapOn: Read Aloud
- assertVisible:
    id: speech.engine.group
- tapOn: Speech rate
- tapOn: Custom
- assertVisible:
    id: speech.custom_rate
- tapOn:
    id: speech.custom_rate
- eraseText: 100
- inputText: '2.75'
- hideKeyboard
- &id001
  tapOn: Cancel
- &id002
  assertNotVisible:
    id: speech.custom_rate
- &id003
  assertVisible:
    id: speech.engine.group
- tapOn: Speech rate
- tapOn: Custom
- assertNotVisible:
    id: speech.custom_rate
    text: '2.75'
- *id001
- *id002
- *id003
