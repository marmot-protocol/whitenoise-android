appId: dev.ipf.whitenoise.android.maestrolab
name: qr-permission-denied-rotation
---
- runFlow: ../fixtures/runtime-qr-denied-ready.yaml
- setOrientation: LANDSCAPE_LEFT
- assertVisible:
    id: qr_scanner_sheet_content
- assertVisible:
    text: ^Camera Access Needed$
- assertVisible:
    id: qr_scanner.recovery
    enabled: true
- assertNotVisible:
    id: qr_scanner.target
- assertNotVisible:
    id: qr_scanner.torch
- setOrientation: PORTRAIT
- assertVisible:
    id: qr_scanner_sheet_content
- assertVisible:
    text: ^Camera Access Needed$
- assertVisible:
    id: qr_scanner.recovery
    enabled: true
- assertNotVisible:
    id: qr_scanner.target
- assertNotVisible:
    id: qr_scanner.torch
- tapOn:
    id: qr_scanner.close
- assertNotVisible:
    id: qr_scanner_sheet_content
- assertVisible:
    id: share_connect.screen
- assertVisible: Maestro Alice
- back
- assertVisible: Settings
- assertVisible: Maestro Alice
- back
- assertVisible: Maestro group
