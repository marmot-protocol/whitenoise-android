appId: dev.ipf.whitenoise.android.maestrolab
name: qr-permission-denied-rotation
---
- runFlow: ../fixtures/runtime-qr-denied-ready.yaml
- setOrientation: LANDSCAPE_LEFT
- assertVisible:
    text: ^Scan QR Code$
- assertVisible:
    text: ^Camera access needed$
- assertVisible:
    id: qr_scanner.recovery
    enabled: true
    containsChild:
      text: ^(Allow camera|Open settings)$
- setOrientation: PORTRAIT
- assertVisible:
    text: ^Scan QR Code$
- assertVisible:
    text: ^Camera access needed$
- assertVisible:
    id: qr_scanner.recovery
    enabled: true
    containsChild:
      text: ^(Allow camera|Open settings)$
- tapOn:
    text: ^Close$
- runFlow: ../fixtures/qr-return.yaml
