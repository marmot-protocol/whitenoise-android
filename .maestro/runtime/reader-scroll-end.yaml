appId: dev.ipf.whitenoise.android.maestrolab
name: reader-scroll-end
---
- runFlow: ../fixtures/runtime-ready.yaml
- assertVisible: "Maestro group"
- tapOn: "Maestro group"
- scrollUntilVisible:
    element:
      text: "Read More"
    direction: UP
- tapOn: "Read More"
- assertVisible:
    id: "composer-pill-surface"
- scrollUntilVisible:
    element:
      text: "Maestro reader heading"
    direction: UP
- assertVisible: "Maestro reader heading"
- scrollUntilVisible:
    element:
      text: "Maestro reader ending"
    direction: DOWN
- assertVisible: "Maestro reader ending"
