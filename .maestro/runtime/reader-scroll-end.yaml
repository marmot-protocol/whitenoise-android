appId: dev.ipf.whitenoise.android.maestrolab
name: reader-scroll-end
---
- assertVisible: "Maestro group"
- tapOn: "Maestro group"
- scrollUntilVisible:
    element:
      text: "Read More"
    direction: UP
- tapOn: "Read More"
- assertVisible:
    id: "message-full-screen"
- assertVisible: "Maestro reader heading"
- scrollUntilVisible:
    element:
      text: "Maestro reader ending"
    direction: DOWN
- assertVisible: "Maestro reader ending"
- back
- assertNotVisible:
    id: "message-full-screen"
- assertVisible: "Read More"
