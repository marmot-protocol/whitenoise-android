appId: dev.ipf.whitenoise.android.maestrolab
name: preferences-font-large
---
- runFlow: ../fixtures/runtime-ready.yaml
- assertVisible: "Maestro group"
- runFlow: ../fixtures/open-settings.yaml
- assertVisible: "Settings"
- scrollUntilVisible:
    element:
      text: "Appearance"
    direction: DOWN
- tapOn: "Appearance"
- scrollUntilVisible:
    element:
      text: "Font size"
    direction: DOWN
- tapOn: "Font size"
- assertVisible:
    id: "font_size.preview"
- tapOn:
    id: "font_size.Large"
- assertVisible:
    id: "font_size.Large"
- tapOn: "Done"
- back
- tapOn: "Appearance"
- scrollUntilVisible:
    element:
      text: "Large"
    direction: DOWN
- assertVisible: "Large"
