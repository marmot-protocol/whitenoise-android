appId: dev.ipf.whitenoise.android.maestrolab
name: preferences-font-large
---
- assertVisible: "Maestro group"
- tapOn: "Open settings.*"
- assertVisible: "Settings"
- scrollUntilVisible:
    element:
      text: "Appearance"
    direction: DOWN
- tapOn: "Appearance"
- scrollUntilVisible:
    element:
      text: "Font size"
    direction: DOWN
- tapOn: "Font size"
- tapOn: "Large"
- assertVisible: "Large"
- back
- tapOn: "Appearance"
- scrollUntilVisible:
    element:
      text: "Large"
    direction: DOWN
- assertVisible: "Large"
