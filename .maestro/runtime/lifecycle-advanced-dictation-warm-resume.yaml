appId: dev.ipf.whitenoise.android.maestrolab
name: lifecycle-advanced-dictation-warm-resume
---
- runFlow:
    file: ../fixtures/open-fixture-settings-hub-destination.yaml
    env:
      SETTINGS_HUB: "Voice & language"
      SETTINGS_HUB_GROUP: "settings.voice_language.group"
      SETTINGS_DESTINATION: Dictation
- assertVisible:
    id: dictation.ostt_recommendation.group
- runFlow: ../fixtures/runtime-warm-resume.yaml
- assertVisible:
    id: dictation.ostt_recommendation.group
- back
- assertVisible:
    id: "settings.voice_language.group"
- back
- assertVisible: Settings
