appId: dev.ipf.whitenoise.android.maestrolab
name: inbound-share-picker-warm-resume
---
- runFlow: ../fixtures/runtime-share-picker-ready.yaml
- runFlow: ../fixtures/runtime-warm-resume.yaml
- assertVisible:
    id: performance.share_picker
- assertVisible:
    text: ^Maestro group$
- assertVisible:
    enabled: false
    containsChild:
      text: ^Share$
- tapOn: Close
- runFlow: ../fixtures/share-closed.yaml
