appId: dev.ipf.whitenoise.android.maestrolab
name: inbound-share-picker-warm-resume
---
- runFlow: ../fixtures/runtime-share-text-ready.yaml
- &id001
  assertVisible:
    id: performance.share_picker
- &id002
  assertVisible:
    text: ^Maestro group$
- &id003
  assertVisible:
    enabled: false
    text: ^Share$
- runFlow: ../fixtures/runtime-warm-resume.yaml
- *id001
- *id002
- *id003
- tapOn: Close
- assertNotVisible: Some files could not be imported
- assertNotVisible:
    id: performance.share_picker
- assertVisible:
    text: ^Maestro group$
