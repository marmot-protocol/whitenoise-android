appId: dev.ipf.whitenoise.android.maestrolab
name: reports-explanation-cancel
---
- runFlow: ../fixtures/runtime-ready.yaml
- assertVisible: Maestro group
- tapOn: Maestro group
- assertVisible: Generated incoming fixture message
- tapOn:
    text: Generated incoming fixture message
    longPress: true
- tapOn: Report
- assertVisible: Report this message
- assertVisible:
    text: Send report
    enabled: true
- scrollUntilVisible:
    element:
      id: message.report.explanation
    direction: DOWN
- tapOn:
    id: message.report.explanation
- inputText: Maestro disposable explanation
- assertVisible: Maestro disposable explanation
- hideKeyboard
- back
- assertNotVisible: Report this message
- assertVisible: Generated incoming fixture message
