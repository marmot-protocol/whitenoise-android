appId: dev.ipf.whitenoise.android.maestrolab
name: profile-lightning-invalid-clear
---
- runFlow: ../fixtures/open-fixture-profile-editor.yaml
- scrollUntilVisible:
    element:
      id: profile.lightning_field
    direction: DOWN
- assertVisible:
    id: profile.lightning_field
- runFlow: ../fixtures/clear-profile-lightning.yaml
- inputText: maestro@example.invalid/path
- assertVisible:
    id: profile.lightning_field
    text: ^maestro@example\.invalid/path$
- hideKeyboard
- assertVisible: Enter a Lightning address like name@example.com.
- assertVisible:
    id: profile.save
    enabled: false
- scrollUntilVisible:
    element:
      id: profile.lightning_field
    direction: DOWN
- assertVisible:
    id: profile.lightning_field
- runFlow: ../fixtures/clear-profile-lightning.yaml
- hideKeyboard
- assertNotVisible: Enter a Lightning address like name@example.com.
- assertVisible:
    id: profile.save
    enabled: false
- back
- assertVisible:
    id: profile.edit
- scrollUntilVisible:
    element:
      id: profile.lightning_field
    direction: DOWN
- assertVisible:
    id: profile.lightning_field
- assertNotVisible:
    id: profile.lightning_field
    text: .+
