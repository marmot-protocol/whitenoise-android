appId: dev.ipf.whitenoise.android.maestrolab
name: profile-edit-warm-resume-discard
---
- runFlow: ../fixtures/runtime-ready.yaml
- assertVisible: Maestro group
- runFlow: ../fixtures/open-settings.yaml
- assertVisible: Settings
- tapOn: Profile
- assertVisible:
    id: profile.edit
- tapOn:
    id: profile.edit
- scrollUntilVisible:
    element:
      id: profile.name_field
    direction: DOWN
- assertVisible:
    id: profile.name_field
- tapOn:
    id: profile.name_field
- longPressOn:
    id: profile.name_field
- runFlow:
    when:
      visible: (?i)select all
    commands:
    - tapOn: (?i)select all
- assertVisible:
    id: profile.name_field
    focused: true
- eraseText: 100
- assertNotVisible:
    id: profile.name_field
    text: .+
- inputText: Maestro unsaved name
- assertVisible:
    id: profile.name_field
    text: ^Maestro unsaved name$
- hideKeyboard
- runFlow: ../fixtures/runtime-warm-resume.yaml
- scrollUntilVisible:
    element:
      id: profile.name_field
    direction: DOWN
- assertVisible:
    id: profile.name_field
- assertVisible:
    id: profile.name_field
    text: ^Maestro unsaved name$
# Use the actual editor action; foreground restoration may reopen its focused IME.
- tapOn: Back
- assertVisible:
    id: profile.edit
- scrollUntilVisible:
    element:
      id: profile.name_field
    direction: DOWN
- assertVisible:
    id: profile.name_field
- assertVisible:
    id: profile.name_field
    text: ^Maestro Alice$
- assertNotVisible: Maestro unsaved name
