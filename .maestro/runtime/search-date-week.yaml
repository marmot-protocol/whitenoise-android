appId: dev.ipf.whitenoise.android.maestrolab
name: search-date-week
---
- assertVisible: "Maestro group"
- tapOn: "Search chats"
- hideKeyboard
- tapOn:
    id: "chat-list-search-filters-action"
- tapOn:
    id: "chat-list-search-filter-menu-Date"
- assertVisible: "Date"
- tapOn: "Last 7 Days"
- tapOn: "OK"
- assertVisible:
    id: "chat-list-search-filter-chip-date:last7"
- tapOn:
    id: "chat-list-search-clear-all-filters"
- assertNotVisible:
    id: "chat-list-search-filter-chip-date:last7"
- assertVisible:
    id: "chats.searchField"
- back
- assertVisible: "Maestro group"
