    id: "new_message.screen"
- back
- assertNotVisible:
    id: "new_message.screen"
- assertVisible: "Maestro group"
- tapOn: "New Message"
- assertVisible:
    id: "new_message.screen"
- back
- assertNotVisible:
    id: "new_message.screen"
- assertVisible: "Maestro group"
