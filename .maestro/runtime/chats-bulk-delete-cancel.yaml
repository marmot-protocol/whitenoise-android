appId: dev.ipf.whitenoise.android.maestrolab
name: chats-bulk-delete-cancel
---
- runFlow: ../fixtures/runtime-ready.yaml
- assertVisible: "Maestro group"
- longPressOn:
    text: "Maestro group"
- assertVisible: "Pin"
- tapOn: "Select"
- assertVisible:
    id: "chats.selectionControls"
- tapOn: "Delete"
- assertVisible: "Delete from this device"
- tapOn: "Cancel"
- assertVisible: "Maestro group"
- back
- assertNotVisible:
    id: "chats.selectionControls"
