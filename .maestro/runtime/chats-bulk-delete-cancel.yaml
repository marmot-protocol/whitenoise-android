appId: dev.ipf.whitenoise.android.maestrolab
name: chats-bulk-delete-cancel
---
- runFlow: ../fixtures/runtime-ready.yaml
- assertVisible: "Maestro group"
- longPressOn:
    text: "Maestro group"
- assertVisible: "Pin"
- tapOn: "Select"
- assertVisible:
    id: "chats.selectionControls"
- tapOn: "Leave and delete"
- assertVisible: "Leave and delete"
- assertVisible: "Review 1 selected chats.*"
- assertVisible: "Cancel"
- tapOn: "Cancel"
- assertNotVisible: "Review 1 selected chats.*"
- assertVisible: "Maestro group"
- back
- assertNotVisible:
    id: "chats.selectionControls"
