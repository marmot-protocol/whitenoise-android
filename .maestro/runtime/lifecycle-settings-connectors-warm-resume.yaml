appId: dev.ipf.whitenoise.android.maestrolab
name: lifecycle-settings-connectors-warm-resume
---
- runFlow: ../fixtures/runtime-ready.yaml
- assertVisible: Maestro group
- runFlow: ../fixtures/open-settings.yaml
- assertVisible: Settings
- scrollUntilVisible:
    element:
      text: AI Agents
    direction: DOWN
- tapOn: AI Agents
- assertVisible:
    id: ai_agents.connectors
- runFlow: ../fixtures/runtime-warm-resume.yaml
- assertVisible:
    id: ai_agents.connectors
- tapOn: Back
- assertVisible: Settings
- tapOn: Back
- assertVisible: Maestro group
