appId: dev.ipf.whitenoise.android.maestrolab
name: lifecycle-settings-account-warm-resume
---
- runFlow: ../fixtures/runtime-ready.yaml
# The instrumentation host owns launch, reset and disposal.
- assertVisible: "Maestro group"
- runFlow: ../fixtures/open-settings.yaml
- assertVisible: "Settings"
- scrollUntilVisible:
    element:
      text: "Account"
    direction: DOWN
- tapOn: "Account"
- assertVisible:
    id: "settings.account.group"
- runFlow: ../fixtures/runtime-warm-resume.yaml
- assertVisible:
    id: "settings.account.group"
- tapOn: "Back"
- assertVisible: "Settings"
- tapOn: "Back"
- assertVisible: "Maestro group"
