appId: dev.ipf.whitenoise.android.maestrolab
name: nested-donate
---
- runFlow: ../fixtures/runtime-ready.yaml
- assertVisible: "Maestro group"
- tapOn: "Open settings.*"
- assertVisible: "Settings"
- scrollUntilVisible:
    element:
      text: "Donate"
    direction: DOWN
- tapOn: "Donate"
- assertVisible:
    id: "donate.open"
- back
- assertVisible: "Settings"
