appId: dev.ipf.whitenoise.android.maestrolab
name: actions-batch-delete-cancel
---
- runFlow: ../fixtures/runtime-ready.yaml
- assertVisible: "Maestro group"
- tapOn: "Maestro group"
- runFlow: ../fixtures/assert-fixture-conversation.yaml
- longPressOn:
    text: "Generated fixture message"
- tapOn: "Select"
- assertVisible: "Select messages"
- tapOn: "Delete selected messages"
- assertVisible: "Delete 1 message\\?"
- tapOn: "Cancel"
- assertNotVisible: "Delete 1 message\\?"
- assertVisible: "Select messages"
- back
- runFlow: ../fixtures/assert-fixture-conversation.yaml
