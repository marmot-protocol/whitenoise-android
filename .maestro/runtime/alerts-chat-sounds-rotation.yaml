appId: dev.ipf.whitenoise.android.maestrolab
name: alerts-chat-sounds-rotation
---
- runFlow: ../fixtures/runtime-ready.yaml
- assertVisible: Maestro group
- tapOn: Maestro group
- runFlow: ../fixtures/assert-fixture-conversation.yaml
- tapOn: Maestro group
- assertVisible:
    id: chat_info.list
- scrollUntilVisible:
    element:
      text: Sounds & notifications
    direction: DOWN
- tapOn: Sounds & notifications
- assertVisible:
    id: conversation-alert-messages_group
- setOrientation: LANDSCAPE_LEFT
- assertVisible:
    id: conversation-alert-messages_group
- setOrientation: PORTRAIT
- back
- assertVisible:
    id: chat_info.list
