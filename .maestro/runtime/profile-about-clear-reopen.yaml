appId: dev.ipf.whitenoise.android.maestrolab
name: profile-about-clear-reopen
---
- runFlow: ../fixtures/open-fixture-profile-editor.yaml
- scrollUntilVisible:
    element:
      id: profile.about_field
    direction: DOWN
- assertVisible:
    id: profile.about_field
- tapOn:
    id: profile.about_field
- longPressOn:
    id: profile.about_field
- runFlow:
    when:
      visible: (?i)select all
    commands:
    - tapOn: (?i)select all
- assertVisible:
    id: profile.about_field
    focused: true
- eraseText: 100
- assertNotVisible:
    id: profile.about_field
    text: .+
- hideKeyboard
- assertVisible:
    id: profile.save
    enabled: true
- tapOn:
    id: profile.save
- assertVisible:
    id: profile.edit
- assertNotVisible:
    id: profile.save
- tapOn:
    id: profile.edit
- scrollUntilVisible:
    element:
      id: profile.about_field
    direction: DOWN
- assertVisible:
    id: profile.about_field
- assertNotVisible:
    id: profile.about_field
    text: .+
- back
- assertVisible:
    id: profile.edit
