- tapOn:
    text: Reopen dictation disclosure
- assertVisible:
    text: Offline speech recognition
- back
- assertNotVisible:
    text: Offline speech recognition
- tapOn:
    text: Reopen dictation disclosure
- assertVisible:
    text: Offline speech recognition
- tapOn:
    id: confirmation.confirm
- assertVisible:
    id: presentation.complete
