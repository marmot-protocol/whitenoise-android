appId: dev.ipf.whitenoise.android.maestrolab
name: settings-translation
---
- runFlow: ../fixtures/runtime-ready.yaml
# The instrumentation host owns launch, reset and disposal.
- assertVisible: "Maestro group"
- runFlow: ../fixtures/open-settings.yaml
- assertVisible: "Settings"
- scrollUntilVisible:
    element:
      text: "Voice & language"
    direction: DOWN
- tapOn: "Voice & language"
- assertVisible:
    id: "settings.voice_language.group"
- scrollUntilVisible:
    element:
      text: "Translate"
    direction: DOWN
- tapOn: "Translate"
- assertVisible: "Automatically translate messages"
- tapOn: "Target language: English"
- assertVisible: "Search languages"
- tapOn: "Search languages"
- inputText: "ger"
- assertVisible: German
- assertNotVisible: Arabic
# Close the IME first so Back dismisses the picker rather than the keyboard.
- runFlow:
    when:
      visible:
        id: com\.google\.android\.inputmethod\.latin:id/.*
    commands:
      - hideKeyboard
- back
- assertNotVisible: "Search languages"
- tapOn: "Back"
- assertVisible:
    id: "settings.voice_language.group"
- tapOn: "Back"
- assertVisible: "Settings"
- tapOn: "Back"
- assertVisible: "Maestro group"
