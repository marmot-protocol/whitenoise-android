appId: dev.ipf.whitenoise.android.maestrolab
name: navigation-profile-edit-cancel
---
- runFlow: ../fixtures/runtime-ready.yaml
- assertVisible: "Maestro group"
- tapOn: "Open settings.*"
- assertVisible: "Settings"
- tapOn: "Profile"
- tapOn:
    id: "profile.edit"
- tapOn:
    id: "profile.name_field"
- eraseText
- inputText: "Maestro cancelled edit"
- hideKeyboard
- back
- assertNotVisible: "Maestro cancelled edit"
- assertVisible: "Maestro Alice"
