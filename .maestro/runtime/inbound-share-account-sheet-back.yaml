appId: dev.ipf.whitenoise.android.maestrolab
name: inbound-share-account-sheet-back
---
- runFlow: ../fixtures/runtime-share-text-ready.yaml
- assertVisible:
    id: performance.share_picker
- assertVisible:
    text: ^Maestro group$
- assertVisible:
    enabled: false
    text: ^Share$
- tapOn: Maestro group
- &id001
  assertVisible:
    id: performance.share_picker
- &id002
  assertVisible:
    text: ^Maestro group$
- &id003
  assertVisible:
    enabled: true
    text: ^Share to 1 chat$
- tapOn: Choose sending account
- assertVisible:
    text: ^Choose which signed-in account will own these shared drafts\.$
- assertVisible:
    text: ^Maestro Bob$
- assertVisible:
    text: ^Maestro Carol$
- back
- assertNotVisible: ^Choose which signed-in account will own these shared drafts\.$
- *id001
- *id002
- *id003
- tapOn: Close
- assertNotVisible: Some files could not be imported
- assertNotVisible:
    id: performance.share_picker
- assertVisible:
    text: ^Maestro group$
