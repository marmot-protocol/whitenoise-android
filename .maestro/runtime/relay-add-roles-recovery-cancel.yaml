appId: dev.ipf.whitenoise.android.maestrolab
name: relay-add-roles-recovery-cancel
---
- runFlow: ../fixtures/runtime-ready.yaml
- assertVisible: Maestro group
- runFlow: ../fixtures/open-settings.yaml
- assertVisible: Settings
- scrollUntilVisible:
    element:
      text: Relays
    direction: DOWN
- tapOn: Relays
- assertVisible:
    id: relays.group
- tapOn: Add relay
- assertVisible:
    id: relay.add.url
- assertVisible:
    id: relay.add.submit
    enabled: false
- tapOn:
    id: relay.add.url
- assertVisible:
    id: relay.add.url
    focused: true
- eraseText: 100
- assertNotVisible:
    id: relay.add.url
    text: .+
- inputText: wss://relay.example.invalid
- assertVisible:
    id: relay.add.url
    text: ^wss://relay\.example\.invalid$
- hideKeyboard
- assertVisible:
    id: relay.add.submit
    enabled: true
- tapOn: Profile
- tapOn: Inbox
- assertVisible: Choose at least one role.
- assertVisible:
    id: relay.add.submit
    enabled: false
- tapOn: Profile
- assertNotVisible: Choose at least one role.
- assertVisible:
    id: relay.add.submit
    enabled: true
- back
- assertNotVisible:
    id: relay.add.url
- assertVisible:
    id: relays.group
- back
- assertVisible: Settings
