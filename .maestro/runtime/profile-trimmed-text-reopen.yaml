appId: dev.ipf.whitenoise.android.maestrolab
name: profile-trimmed-text-reopen
---
- runFlow: ../fixtures/open-fixture-empty-profile-name.yaml
- inputText: '  Maestro trimmed Alice  '
- assertVisible:
    id: profile.name_field
    text: ^  Maestro trimmed Alice  $
- hideKeyboard
- scrollUntilVisible:
    element:
      id: profile.about_field
    direction: DOWN
- assertVisible:
    id: profile.about_field
- tapOn:
    id: profile.about_field
- longPressOn:
    id: profile.about_field
- runFlow:
    when:
      visible: (?i)select all
    commands:
    - tapOn: (?i)select all
- assertVisible:
    id: profile.about_field
    focused: true
- eraseText: 100
- assertNotVisible:
    id: profile.about_field
    text: .+
- inputText: '  Maestro trimmed biography  '
- assertVisible:
    id: profile.about_field
    text: ^  Maestro trimmed biography  $
- hideKeyboard
- assertVisible:
    id: profile.save
    enabled: true
- tapOn:
    id: profile.save
- assertVisible:
    id: profile.edit
- assertNotVisible:
    id: profile.save
- tapOn:
    id: profile.edit
- scrollUntilVisible:
    element:
      id: profile.name_field
    direction: UP
- assertVisible:
    id: profile.name_field
- assertVisible:
    id: profile.name_field
    text: ^Maestro trimmed Alice$
- scrollUntilVisible:
    element:
      id: profile.about_field
    direction: DOWN
- assertVisible:
    id: profile.about_field
- assertVisible:
    id: profile.about_field
    text: ^Maestro trimmed biography$
- back
- assertVisible:
    id: profile.edit
