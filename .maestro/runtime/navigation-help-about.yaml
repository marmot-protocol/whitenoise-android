appId: dev.ipf.whitenoise.android.maestrolab
name: navigation-help-about
---
- runFlow: ../fixtures/runtime-ready.yaml
# The instrumentation host owns launch, reset and disposal.
- assertVisible: "Maestro group"
- tapOn: "Open settings.*"
- assertVisible: "Settings"
- scrollUntilVisible:
    element:
      text: "Help"
    direction: DOWN
- tapOn: "Help"
- tapOn:
    id: "help.about"
- assertVisible:
    id: "about.app"
- assertVisible:
    id: "about.version"
- back
- assertVisible:
    id: "help.destinations"
