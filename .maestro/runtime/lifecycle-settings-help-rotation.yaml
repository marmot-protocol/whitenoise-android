appId: dev.ipf.whitenoise.android.maestrolab
name: lifecycle-settings-help-rotation
---
- runFlow:
    file: ../fixtures/open-fixture-settings-hub-destination.yaml
    env:
      SETTINGS_HUB: "Help & support"
      SETTINGS_HUB_GROUP: "settings.help_support.group"
      SETTINGS_DESTINATION: Help
- assertVisible:
    id: help.destinations
- setOrientation: LANDSCAPE_LEFT
- assertVisible:
    id: help.destinations
- setOrientation: PORTRAIT
- assertVisible:
    id: help.destinations
- tapOn: Back
- assertVisible:
    id: "settings.help_support.group"
- tapOn: "Back"
- assertVisible: Settings
- tapOn: Back
- assertVisible: Maestro group
