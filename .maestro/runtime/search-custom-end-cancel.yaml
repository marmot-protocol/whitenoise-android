appId: dev.ipf.whitenoise.android.maestrolab
name: search-custom-end-cancel
---
- assertVisible: "Maestro group"
- tapOn: "Search chats"
- hideKeyboard
- tapOn:
    id: "chat-list-search-filters-action"
- tapOn:
    id: "chat-list-search-filter-menu-Date"
- assertVisible: "Date"
- tapOn: "Custom Range"
- assertVisible: "Start date"
- tapOn: "Next"
- assertVisible: "End date"
- tapOn: "Cancel"
- assertVisible: "Date"
- tapOn: "Cancel"
- assertNotVisible:
    id: "chat-list-search-filter-chip-date:.*"
- assertVisible:
    id: "chats.searchField"
- back
- assertVisible: "Maestro group"
