appId: dev.ipf.whitenoise.android.maestrolab
name: conversation-emoji-cancel
---
- runFlow: ../fixtures/runtime-ready.yaml
- assertVisible: "Maestro group"
- tapOn: "Maestro group"
- runFlow: ../fixtures/assert-fixture-conversation.yaml
- tapOn: "Open emoji picker"
- assertVisible:
    id: "emoji.picker.grid"
- back
- assertNotVisible:
    id: "emoji.picker.grid"
- runFlow: ../fixtures/assert-fixture-conversation.yaml
# The emoji rail opens emoji sets over the conversation; Back returns to it (#3882).
- tapOn: "Open emoji picker"
- tapOn:
    id: "emoji.picker.browse_sets"
- assertVisible:
    id: "emoji_sets.query"
- back
- assertNotVisible:
    id: "emoji_sets.query"
- runFlow: ../fixtures/assert-fixture-conversation.yaml
