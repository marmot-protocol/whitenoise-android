appId: dev.ipf.whitenoise.android.maestrolab
name: qr-permission-permanent-reopen
---
- runFlow: ../fixtures/runtime-qr-denied-ready.yaml
- tapOn:
    text: ^(Allow Camera|Open settings)$
- assertVisible:
    id: com.android.permissioncontroller:id/permission_deny_button
- tapOn:
    id: com.android.permissioncontroller:id/permission_deny_button
- assertVisible:
    text: ^Scan QR Code$
- assertVisible:
    text: ^Camera Access Needed$
- assertVisible:
    id: qr_scanner.recovery
    enabled: true
    containsChild:
      text: ^(Allow Camera|Open settings)$
- assertVisible:
    text: ^Open settings$
- tapOn:
    text: ^Close$
- assertNotVisible:
    id: qr_scanner.recovery
- assertNotVisible:
    id: qr_scanner.close
- assertVisible:
    id: share_connect.screen
- assertVisible: Maestro Alice
- tapOn:
    id: share_connect.open_scanner
- assertVisible:
    text: ^Scan QR Code$
- assertVisible:
    text: ^Camera Access Needed$
- assertVisible:
    id: qr_scanner.recovery
    enabled: true
    containsChild:
      text: ^(Allow Camera|Open settings)$
- assertVisible:
    text: ^Open settings$
- assertNotVisible:
    id: com.android.permissioncontroller:id/permission_deny_button
- tapOn:
    text: ^Close$
- runFlow: ../fixtures/qr-return.yaml
