appId: dev.ipf.whitenoise.android.dev
name: signup-suggest-name
---
# Stop the previous foreground process before Android clears its data.
- stopApp
- setOrientation: PORTRAIT
- launchApp:
    clearState: true
    permissions:
      all: deny
- runFlow:
    when:
      visible: "Help Improve White Noise"
    commands:
      - back
- assertVisible: "Sign Up"
- assertVisible: "Sign In"
- tapOn: "Sign Up"
- scrollUntilVisible:
    element:
      id: "onboarding.sign_up.name"
    direction: DOWN
- tapOn:
    id: "onboarding.sign_up.name"
- inputText: "Maestro custom name"
- hideKeyboard
- tapOn:
    id: "onboarding.sign_up.suggest_name"
- assertNotVisible: "Maestro custom name"
- copyTextFrom:
    id: "onboarding.sign_up.name"
- evalScript: ${output.firstName = maestro.copiedText}
- assertTrue: ${output.firstName.length > 0}
- tapOn:
    id: "onboarding.sign_up.suggest_name"
- copyTextFrom:
    id: "onboarding.sign_up.name"
- assertTrue: ${maestro.copiedText.length > 0 && maestro.copiedText != output.firstName}
- tapOn: "Back"
- assertVisible: "Sign In"
- takeScreenshot: signup-suggest-name
