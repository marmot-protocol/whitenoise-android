appId: dev.ipf.whitenoise.android.dev
name: signin-public
---
# Stop the previous foreground process before Android clears its data.
- stopApp
- setOrientation: PORTRAIT
- launchApp:
    clearState: true
    permissions:
      all: deny
- runFlow:
    when:
      visible: "Help Improve White Noise"
    commands:
      - back
- assertVisible: "Sign Up"
- assertVisible: "Sign In"
- tapOn: "Sign In"
- assertVisible: "Private key"
- tapOn: "Private key"
- inputText: "npub1qqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqzqujme"
- hideKeyboard
- tapOn:
    id: "onboarding.sign_in.action"
- assertVisible: "That's a public key. Enter your secret key (nsec) to sign in."
- back
- assertVisible: "Sign Up"
- assertVisible: "Sign In"
- assertNotVisible: "Private key"
- takeScreenshot: signin-public
