appId: dev.ipf.whitenoise.android.dev
name: Welcome, sign in, and return
---
# The offline runner verifies a fresh data reset before starting this driver.
- stopApp
- setOrientation: PORTRAIT
- launchApp:
    clearState: false
    permissions:
      all: deny
# Back closes this known optional sheet and records declined sharing choices.
- runFlow:
    when:
      visible: "Help Improve White Noise"
    commands:
      - back
- assertVisible: "Sign Up"
- assertVisible: "Sign In"
- tapOn: "Sign In"
- assertVisible: "Private key"
- assertNotVisible: "Sign Up"
- back
- assertVisible: "Sign Up"
- assertVisible: "Sign In"
- assertNotVisible: "Private key"
- takeScreenshot: welcome-returned
