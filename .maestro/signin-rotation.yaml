appId: dev.ipf.whitenoise.android.dev
name: signin-rotation
---
# Stop the previous foreground process before Android clears its data.
- stopApp
- setOrientation: PORTRAIT
- launchApp:
    clearState: true
    permissions:
      all: deny
- runFlow:
    when:
      visible: "Help Improve White Noise"
    commands:
      - back
- assertVisible: "Sign Up"
- assertVisible: "Sign In"
- tapOn: "Sign In"
- tapOn: "Private key"
- inputText: "not-a-key"
- setOrientation: LANDSCAPE_LEFT
- assertVisible:
    id: "onboarding.sign_in.action"
    enabled: true
- setOrientation: PORTRAIT
- hideKeyboard
- tapOn:
    id: "onboarding.sign_in.action"
- assertVisible: "That doesn't look like a valid nsec or npub key."
- tapOn: "Clear"
- assertVisible:
    id: "onboarding.sign_in.action"
    enabled: false
- tapOn: "Back"
- assertVisible: "Sign In"
- takeScreenshot: signin-rotation
