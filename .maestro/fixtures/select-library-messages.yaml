appId: dev.ipf.whitenoise.android.maestrolab
---
# Chips occupy a horizontal fragment; swipe its actual tagged row, never the full screen.
- assertVisible:
    id: global.library.modes
- repeat:
    times: 6
    commands:
      - runFlow:
          when:
            notVisible:
              id: global.library.mode.Messages
          commands:
            - swipe:
                from:
                  id: global.library.modes
                direction: RIGHT
- tapOn:
    id: global.library.mode.Messages
- assertVisible:
    id: global.library.mode.Messages
    checked: true
