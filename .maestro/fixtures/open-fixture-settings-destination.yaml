- assertVisible: Maestro group
- runFlow: ../fixtures/open-settings.yaml
- assertVisible: Settings
- scrollUntilVisible:
    element:
      text: ${SETTINGS_DESTINATION}
    direction: DOWN
- tapOn: ${SETTINGS_DESTINATION}
