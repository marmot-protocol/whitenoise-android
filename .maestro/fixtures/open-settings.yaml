appId: dev.ipf.whitenoise.android.maestrolab
---
# The avatar opens Settings directly when quick switching is on.
- tapOn:
    id: "chats.switchProfile"
- extendedWaitUntil:
    visible:
      text: "^(Switch Profile|Settings)$"
    timeout: 5000
- runFlow:
    when:
      visible: "Switch Profile"
    commands:
      - tapOn: "Settings"
- assertVisible: "Settings"
- assertVisible:
    id: "settings-home-content"
