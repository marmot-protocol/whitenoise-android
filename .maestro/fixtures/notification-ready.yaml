appId: dev.ipf.whitenoise.android.maestrolab
---
# Leave the system choice untouched for the dedicated permission assertion.
- retry:
    maxRetries: 3
    commands:
    - runFlow:
        when:
          visible: Help Improve White Noise
        commands:
        - tapOn: Close
    - assertVisible: Know when someone replies
- assertVisible: Turn on notifications to see new messages and chat invitations without opening White Noise.
- tapOn: Turn on notifications
- assertVisible: Allow Maestro Test Lab to send you notifications\?
