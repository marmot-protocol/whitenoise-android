appId: dev.ipf.whitenoise.android.maestrolab
---
# A failed rotation in the preceding generated case must not change this case's baseline.
- setOrientation: PORTRAIT
- runFlow: emulator-interruption.yaml
# Bound only initial consent/permission readiness; never retry the journey itself.
- retry:
    maxRetries: 3
    commands:
    - runFlow:
        when:
          visible: Help Improve White Noise
        commands:
        - tapOn: Close
    - runFlow:
        when:
          visible: Allow Maestro Test Lab to send you notifications\?
        commands:
        - tapOn:
            id: com.android.permissioncontroller:id/permission_deny_button
    - assertVisible: Maestro group
