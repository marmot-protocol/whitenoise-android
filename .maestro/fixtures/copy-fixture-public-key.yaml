appId: dev.ipf.whitenoise.android.maestrolab
---
- scrollUntilVisible:
    element:
      text: Copy public key
    direction: UP
# Assert the two-second acknowledgement before it expires.
- tapOn:
    text: Copy public key
    waitToSettleTimeoutMs: 100
- assertVisible: Public key copied
- scrollUntilVisible:
    element:
      text: Private key hidden
    direction: DOWN
- assertVisible: Private key hidden
