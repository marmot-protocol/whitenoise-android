appId: dev.ipf.whitenoise.android.dev
name: signin-invalid
---
- launchApp:
    clearState: true
    permissions:
      all: deny
- runFlow:
    when:
      visible: "Help Improve White Noise"
    commands:
      - back
- assertVisible: "Sign Up"
- assertVisible: "Sign In"
- tapOn: "Sign In"
- assertVisible: "Private key"
- assertVisible:
    id: "onboarding.sign_in.action"
    enabled: false
- tapOn: "Private key"
- inputText: "not-a-key"
- hideKeyboard
- tapOn:
    id: "onboarding.sign_in.action"
- assertVisible: "That doesn't look like a valid nsec or npub key."
- tapOn: "Clear"
- tapOn: "Private key"
# Invalid shape AND checksum; does not test native checksum validation.
- inputText: "nsec1invalid-checksum!"
- hideKeyboard
- tapOn:
    id: "onboarding.sign_in.action"
- assertVisible: "That doesn't look like a valid nsec or npub key."
- tapOn: "Back"
- assertVisible: "Sign Up"
- assertVisible: "Sign In"
- assertNotVisible: "Private key"
- tapOn: "Sign In"
- assertVisible: "Private key"
- takeScreenshot: signin-invalid
