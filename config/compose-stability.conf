// Compose compiler stability configuration.
//
// MarmotKit's UniFFI bindings generate every record as a `data class` with
// `var` properties, so the Compose compiler infers them Unstable. That
// inference then propagates: `ChatListItem`, `TimelineMessage`, and every
// other Android wrapper that holds an MDK record inherits Runtime/Unstable
// stability. Under strong skipping an unstable parameter is compared by
// instance identity, so a value-identical projection rebuilt on the next
// engine update recomposes every row that received it.
//
// White Noise never mutates an MDK record in place: projections are rebuilt
// with `copy(...)` and the records are treated as immutable value objects.
// Declaring them stable therefore restores structural-equality skipping
// without weakening correctness — a real content change still produces an
// unequal record and still recomposes.
//
// Keep this list to types the app genuinely treats as immutable values.
dev.ipf.marmotkit.*

// Kotlin standard library value types the compiler cannot see through when
// they appear as generic arguments in MDK-derived projections.
java.time.*
