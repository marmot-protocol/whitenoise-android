name: Bug report
description: Report reproducible incorrect behavior in White Noise Android
labels: []
body:
  - type: markdown
    attributes:
      value: |
        <details>
        <summary>Agent filing guidance</summary>

        Before submitting an agent-researched issue, read [AGENTS.md](https://github.com/marmot-protocol/whitenoise-android/blob/master/AGENTS.md) and [the issue-triage guide](https://github.com/marmot-protocol/whitenoise-android/blob/master/.agents/issue-triage.md). Put a concise investigation in **Evidence** below; this guidance is not included in the submitted issue body.

        - [ ] Check current default-branch source. Separate reported observations, reproduced behavior, source findings and hypotheses. State missing evidence; never invent reproduction, device tests or results.
        - [ ] Search open and closed issues and PRs, including merged fixes, by symptom and likely cause. Read plausible matches, link the canonical issue or regression history, and update existing scope when it covers the same cause.
        - [ ] Trace affected entry points, the state owner and visible result. Check sibling callers, account/chat switches, cancellation, failure/recovery and lifecycle behavior. Cite immutable source links and say what you inspected.
        - [ ] Establish Android versus MDK ownership. Android owns presentation and platform integration; MDK owns shared product rules, protocol state, persistence, queries and recovery. Link verified prerequisites; avoid a second Android store or cache for shared state.
        - [ ] Describe the smallest sufficient outcome, alternatives and observable acceptance criteria. Name existing tests and proposed regression coverage; bugs need an applicable invariant gate or justified exemption. Separate proposed checks from checks actually performed.
        - [ ] Follow current triage policy for native type, labels, Project fields and real parent/dependency relationships. Preserve active owners and evidence-based priority; apply `agent-ok` only with the required review and authorization. State metadata actions blocked by permissions.
        - [ ] Obtain required review, sanitize private data, and read back the published issue and metadata. Reconcile an uncertain submission before retrying.

        Ordinary reporters can submit their observations without completing this investigation. This checklist is guidance and cannot enforce agent compliance.

        </details>
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What happened, and what did you expect instead?
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Reproduction
      description: Give the smallest reliable sequence, including account/group state where relevant.
      placeholder: |
        1. Open …
        2. Tap …
        3. Observe …
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: App version or commit
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Android device and OS
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Product area
      options:
        - Conversations
        - Media
        - Notifications
        - Groups
        - Profiles & identity
        - Search
        - Accessibility
        - Performance & reliability
        - Security & privacy
        - Settings
        - Release & tooling
        - Unsure
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Evidence
      description: Attach sanitized screenshots or logs. Never include private keys or private message contents.
  - type: checkboxes
    id: checks
    attributes:
      label: Checks
      options:
        - label: I searched open and closed issues for this problem.
          required: true
        - label: I removed secrets and private conversation data from the report.
          required: true
