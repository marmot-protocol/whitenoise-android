name: Bug report
description: Report reproducible incorrect behavior in White Noise Android
title: ""
labels: []
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What happened, and what did you expect instead?
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Reproduction
      description: Give the smallest reliable sequence, including account/group state where relevant.
      placeholder: |
        1. Open …
        2. Tap …
        3. Observe …
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: App version or commit
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Android device and OS
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Product area
      options:
        - Conversations
        - Media
        - Notifications
        - Groups
        - Profiles & identity
        - Search
        - Accessibility
        - Performance & reliability
        - Security & privacy
        - Settings
        - Release & tooling
        - Unsure
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Evidence
      description: Attach sanitized screenshots or logs. Never include private keys or private message contents.
  - type: checkboxes
    id: checks
    attributes:
      label: Checks
      options:
        - label: I searched open and closed issues for this problem.
          required: true
        - label: I removed secrets and private conversation data from the report.
          required: true
