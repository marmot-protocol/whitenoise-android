name: Publish Android PR Preview

# Privilege boundary: workflow_run executes the version from the trusted base
# branch, never PR-controlled workflow code. It validates package/version
# identity before exposing the narrowly scoped preview signing key.
on:
  workflow_run:
    workflows: [Android PR APK]
    types: [completed]

permissions:
  actions: read
  contents: read
  pull-requests: write

jobs:
  prepare:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      (github.event.workflow_run.event == 'pull_request' || github.event.workflow_run.event == 'workflow_dispatch') &&
      github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-latest
    outputs:
      pr_number: ${{ steps.provenance.outputs.pr_number }}
      head_sha: ${{ steps.provenance.outputs.head_sha }}
    env:
      BUILD_RUN_ID: ${{ github.event.workflow_run.id }}
      BUILD_RUN_NUMBER: ${{ github.event.workflow_run.run_number }}

    steps:
      - name: Download candidate provenance from completed run
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p candidates/regular
          gh run download "$BUILD_RUN_ID" --repo "$GITHUB_REPOSITORY" --name pr-preview-regular --dir candidates/regular

      # Resolve the validated PR number before the publisher starts so job-level
      # concurrency cannot couple distinct PRs that happen to share a branch.
      - name: Resolve exact candidate provenance and current PR
        id: provenance
        env:
          GH_TOKEN: ${{ github.token }}
          WORKFLOW_EVENT: ${{ github.event.workflow_run.event }}
          WORKFLOW_HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
        shell: bash
        run: |
          set -euo pipefail
          provenance_value() {
            local file=$1 key=$2
            local value
            value=$(sed -nE "s/^${key}=//p" "$file")
            [[ $(grep -c "^${key}=" "$file") -eq 1 ]]
            printf '%s' "$value"
          }
          regular=candidates/regular/provenance.env
          regular_pr=$(provenance_value "$regular" pr_number)
          regular_sha=$(provenance_value "$regular" head_sha)
          regular_run=$(provenance_value "$regular" run_number)
          [[ "$regular_pr" =~ ^[1-9][0-9]*$ && "$regular_sha" =~ ^[0-9a-f]{40}$ && "$regular_run" =~ ^[1-9][0-9]*$ ]]
          [[ "$regular_run" == "$BUILD_RUN_NUMBER" ]]
          if [[ "$WORKFLOW_EVENT" == pull_request ]]; then
            [[ "$regular_sha" == "$WORKFLOW_HEAD_SHA" ]]
          fi
          current=$(gh api "repos/${GITHUB_REPOSITORY}/pulls/${regular_pr}" \
            --jq '[.state, .head.sha, .head.repo.full_name] | @tsv')
          expected=$(printf 'open\t%s\t%s' "$regular_sha" "$GITHUB_REPOSITORY")
          [[ "$current" == "$expected" ]]
          printf 'pr_number=%s\nhead_sha=%s\n' "$regular_pr" "$regular_sha" >> "$GITHUB_OUTPUT"

  publish:
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 20
    concurrency:
      group: android-pr-preview-publish-pr-${{ needs.prepare.outputs.pr_number }}
      # Let the active publisher finish its ownership reconciliation before a
      # newer head proceeds, so the newest serialized run is the final writer.
      cancel-in-progress: false
    env:
      BUILD_RUN_ID: ${{ github.event.workflow_run.id }}
      BUILD_RUN_NUMBER: ${{ github.event.workflow_run.run_number }}
      PR_NUMBER: ${{ needs.prepare.outputs.pr_number }}
      HEAD_SHA: ${{ needs.prepare.outputs.head_sha }}

    steps:
      - name: Checkout trusted publisher only
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false

      # These checks are authoritative only here, against trusted default-
      # branch code. The same tests in the PR job provide fast contributor
      # feedback but cannot police PR-controlled workflow changes.
      - name: Test trusted publisher contract
        run: |
          .github/scripts/test-pr-preview-contract.sh
          .github/scripts/test-pr-preview-validation.sh
          .github/scripts/test-upload-pr-apk-to-blossom.sh
          node --test .github/scripts/update-pr-preview-links.test.js

      - name: Download candidates from completed run
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p candidates/regular
          gh run download "$BUILD_RUN_ID" --repo "$GITHUB_REPOSITORY" --name pr-preview-regular --dir candidates/regular

      # Recheck the freshly downloaded untrusted artifacts against the values
      # that selected this PR's concurrency group before exposing any secret.
      - name: Verify candidate provenance and current PR
        env:
          GH_TOKEN: ${{ github.token }}
          WORKFLOW_EVENT: ${{ github.event.workflow_run.event }}
          WORKFLOW_HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
        shell: bash
        run: |
          set -euo pipefail
          provenance_value() {
            local file=$1 key=$2
            local value
            value=$(sed -nE "s/^${key}=//p" "$file")
            [[ $(grep -c "^${key}=" "$file") -eq 1 ]]
            printf '%s' "$value"
          }
          regular=candidates/regular/provenance.env
          regular_pr=$(provenance_value "$regular" pr_number)
          regular_sha=$(provenance_value "$regular" head_sha)
          regular_run=$(provenance_value "$regular" run_number)
          [[ "$regular_pr" =~ ^[1-9][0-9]*$ && "$regular_sha" =~ ^[0-9a-f]{40}$ && "$regular_run" =~ ^[1-9][0-9]*$ ]]
          [[ "$regular_run" == "$BUILD_RUN_NUMBER" ]]
          if [[ "$WORKFLOW_EVENT" == pull_request ]]; then
            [[ "$regular_sha" == "$WORKFLOW_HEAD_SHA" ]]
          fi
          current=$(gh api "repos/${GITHUB_REPOSITORY}/pulls/${regular_pr}" \
            --jq '[.state, .head.sha, .head.repo.full_name] | @tsv')
          expected=$(printf 'open\t%s\t%s' "$regular_sha" "$GITHUB_REPOSITORY")
          [[ "$current" == "$expected" ]]
          [[ "$regular_pr" == "$PR_NUMBER" && "$regular_sha" == "$HEAD_SHA" ]]

      - name: Verify current PR head
        env:
          GH_TOKEN: ${{ github.token }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        shell: bash
        run: |
          set -euo pipefail
          current=$(gh api "repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}" \
            --jq '[.state, .head.sha, .head.repo.full_name] | @tsv')
          expected=$(printf 'open\t%s\t%s' "$HEAD_SHA" "$GITHUB_REPOSITORY")
          [[ "$current" == "$expected" ]] || {
            printf 'Refusing stale or mismatched preview build.\n' >&2
            exit 1
          }

      - name: Set up JDK 17
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK tools
        uses: android-actions/setup-android@40fd30fb8d7440372e1316f5d1809ec01dcd3699 # v4

      - name: Resolve trusted regular app version contract
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t version_codes < <(sed -nE 's/^[[:space:]]*versionCode = ([1-9][0-9]*)$/\1/p' app/build.gradle.kts)
          (( ${#version_codes[@]} == 1 ))
          printf 'EXPECTED_VERSION_CODE=%s\n' "${version_codes[0]}" >> "$GITHUB_ENV"

      - name: Verify untrusted candidates
        shell: bash
        run: .github/scripts/verify-pr-preview-candidates.sh candidates

      - name: Decode regular staging signing key
        env:
          WHITENOISE_STAGING_KEYSTORE_BASE64: ${{ secrets.WHITENOISE_STAGING_KEYSTORE_BASE64 }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$WHITENOISE_STAGING_KEYSTORE_BASE64"
          printf '%s' "$WHITENOISE_STAGING_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/whitenoise-staging.p12"
          chmod 600 "$RUNNER_TEMP/whitenoise-staging.p12"

      - name: Sign and verify previews
        env:
          WHITENOISE_STAGING_KEYSTORE_PASSWORD: ${{ secrets.WHITENOISE_STAGING_KEYSTORE_PASSWORD }}
          WHITENOISE_STAGING_KEY_ALIAS: ${{ secrets.WHITENOISE_STAGING_KEY_ALIAS }}
          WHITENOISE_STAGING_KEY_PASSWORD: ${{ secrets.WHITENOISE_STAGING_KEY_PASSWORD }}
        shell: bash
        run: .github/scripts/sign-pr-preview-candidates.sh candidates signed "$RUNNER_TEMP/whitenoise-staging.p12"

      - name: Verify signed previews
        shell: bash
        run: |
          set -euo pipefail
          .github/scripts/stage-signed-pr-preview-candidates.sh signed candidates signed-check
          .github/scripts/verify-pr-preview-candidates.sh signed-check

      - name: Recheck PR head before upload
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          current=$(gh api "repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}" \
            --jq '[.state, .head.sha] | @tsv')
          expected=$(printf 'open\t%s' "$HEAD_SHA")
          [[ "$current" == "$expected" ]] || {
            printf 'PR changed before upload; refusing to publish stale APKs.\n' >&2
            exit 1
          }

      - name: Publish previews
        id: publish
        env:
          BLOSSOM_SERVER: https://nostr.download
          BLOSSOM_UPLOAD_NSEC: ${{ secrets.BLOSSOM_UPLOAD_NSEC }}
        shell: bash
        run: |
          set -euo pipefail
          go install github.com/fiatjaf/nak@62fa610a063b708743456e49f9befaef4a441a37
          for channel in regular; do
            apk=$(find "signed/$channel" -type f -name '*.apk' -print -quit)
            url=$(APK_PATH="$apk" .github/scripts/upload-pr-apk-to-blossom.sh)
            remote_sha=$(curl --fail --location --retry 3 --retry-all-errors --max-time 240 "$url" | sha256sum | awk '{print $1}')
            local_sha=$(sha256sum "$apk" | awk '{print $1}')
            [[ "$remote_sha" == "$local_sha" ]] || {
              printf 'Published %s APK digest does not match the signed file.\n' "$channel" >&2
              exit 1
            }
            printf '%s_url=%s\n' "$channel" "$url" >> "$GITHUB_OUTPUT"
          done

      # A push can land while validation/signing/upload runs. Do not let a
      # superseded run overwrite the description with stale APK links.
      - name: Recheck PR head before description update
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          current=$(gh api "repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}" \
            --jq '[.state, .head.sha] | @tsv')
          expected=$(printf 'open\t%s' "$HEAD_SHA")
          [[ "$current" == "$expected" ]] || {
            printf 'PR changed while publishing; refusing to post stale links.\n' >&2
            exit 1
          }

      - name: Update PR description with regular-app link
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v8
        env:
          PR_NUMBER: ${{ env.PR_NUMBER }}
          HEAD_SHA: ${{ env.HEAD_SHA }}
          REGULAR_URL: ${{ steps.publish.outputs.regular_url }}
        with:
          script: |
            const updater = require('./.github/scripts/update-pr-preview-links.js')
            await updater.run({ github, context, core })
