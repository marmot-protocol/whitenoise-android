        if: >-
          ${{ success() && matrix.flavor == 'Zapstore' &&
              github.event_name != 'merge_group' &&
              (github.event_name != 'pull_request' ||
               github.event.pull_request.head.repo.full_name == github.repository) &&
              steps.marmotkit-cache.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/marmotkit-cache
          key: marmotkit-${{ runner.os }}-${{ steps.marmotkit.outputs.sha }}

      - name: Upload full-suite golden comparison evidence
        if: ${{ !cancelled() && steps.unit_tests.outcome == 'success' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: android-ci-golden-results-${{ matrix.flavor }}
          path: app/build/test-results/roborazzi/dev${{ matrix.flavor }}Debug/results-summary.json
          if-no-files-found: error
          retention-days: 7

      - name: Upload Compose regression results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: compose-rectlist-regressions-${{ matrix.flavor }}
          path: |
            app/build/test-results/testDev${{ matrix.flavor }}DebugUnitTest/TEST-dev.ipf.whitenoise.android.ui.conversation.messages.ComposeRectListRegressionTest.xml
            app/build/test-results/testDev${{ matrix.flavor }}DebugUnitTest/TEST-dev.ipf.whitenoise.android.ui.conversation.messages.BubbleFooterRectListReuseTest.xml
          if-no-files-found: ignore
          retention-days: 14

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: kover-coverage-report-${{ matrix.flavor }}
          path: |
            app/build/reports/kover/
          if-no-files-found: ignore
          retention-days: 7

      # Keep task timings on successful runs too; wall-clock timeouts alone do
      # not show whether compilation, tests, or analysis is doing extra work.
      - name: Upload Gradle timing reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: android-ci-gradle-profiles-${{ matrix.flavor }}
          path: build/reports/profile/
          if-no-files-found: ignore
          retention-days: 7

      # Read existing resolutions only; retain proof without a second build.
      - name: Verify selected dependency security floors
        if: success()
        run: python3 scripts/verify_dependency_security.py build/reports/dependency-security

      - name: Export observed dependency inventory
        if: success()
        continue-on-error: true
        run: python3 scripts/verify_dependency_security.py build/reports/dependency-security --inventory build/reports/dependency-security/inventory/selected.json

      - name: Retain selected dependency security evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: dependency-security-${{ github.job }}-${{ strategy.job-index || 0 }}
          path: build/reports/dependency-security
          if-no-files-found: ignore
          retention-days: 14
  # PRs run the full suite for Zapstore only. Compile Play (main, unit-test and
  # androidTest sources) and run the unit tests that branch on its BuildConfig,
  # so Play-only code still fails the PR. master/nightly run Play's full suite.
  secondary-variant:
    needs: [changes, compile]
    if: needs.changes.outputs.docs_only != 'true' && github.event_name == 'pull_request' && needs.changes.outputs.precheck != 'true' && needs.changes.outputs.full_matrix != 'true' && !github.event.pull_request.draft
    name: Compile and flavor-check Play
    runs-on: *wn-build-server
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          clean: false
          persist-credentials: false
          ref: ${{ github.sha }}

      # Persistent runners keep Gradle's incremental state between jobs.
      - name: Prepare persistent workspace
        run: bash .github/scripts/prepare-persistent-workspace.sh

      - name: Configure MarmotKit cache directory
        shell: bash
        run: printf 'WHITENOISE_MARMOTKIT_CACHE_DIR=%s\n' "$RUNNER_TEMP/marmotkit-cache" >> "$GITHUB_ENV"

      # AGP 9.x / Gradle 9.4.1 require JDK 17.
      - name: Set up JDK 17
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
        with:
          cache-disabled: ${{ runner.environment == 'self-hosted' }}
          cache-read-only: ${{ github.event_name == 'merge_group' || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository) }}

      - name: Read MarmotKit artifact pin
        id: marmotkit
        shell: bash
        run: |
          sha="$(awk -F= '$1 == "artifact-sha256" { print $2 }' app/src/main/marmotkit/MARMOT_VERSION)"
          [[ "$sha" =~ ^[0-9a-f]{64}$ ]] || { echo "Invalid MarmotKit artifact SHA-256" >&2; exit 1; }
          printf 'sha=%s\n' "$sha" >> "$GITHUB_OUTPUT"

      - name: Restore MarmotKit artifact
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/marmotkit-cache
          key: marmotkit-${{ runner.os }}-${{ steps.marmotkit.outputs.sha }}

      - name: Compile Play and run its flavor-sensitive unit tests
        shell: bash
        run: |
          set -euo pipefail
          # Every other unit test exercises the same shared code under Zapstore.
          mapfile -t sources < <(grep -rlF 'BuildConfig.SELF_UPDATE_ENABLED' app/src/test/java | sort)
          if [[ ${#sources[@]} -eq 0 ]]; then
            echo 'No unit test reads BuildConfig.SELF_UPDATE_ENABLED; update this selector' >&2
            exit 1
          fi
          filters=()
          for source in "${sources[@]}"; do
            class="${source#app/src/test/java/}"
            class="${class%.*}"
            filters+=(--tests "${class//\//.}")
          done
          ./gradlew :app:compileDevPlayDebugAndroidTestKotlin :app:testDevPlayDebugUnitTest "${filters[@]}" \
            -Proborazzi.test.verify=true --build-cache --profile --daemon --stacktrace

      - name: Upload reports
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: android-ci-reports-secondary-variant
          path: |
            app/build/reports/
            app/build/test-results/
          if-no-files-found: ignore
          retention-days: 7

      - name: Upload Gradle timing reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: android-ci-gradle-profiles-secondary-variant
          path: build/reports/profile/
          if-no-files-found: ignore
          retention-days: 7

      # Read existing resolutions only; retain proof without a second build.
      - name: Verify selected dependency security floors
        if: success()
        run: python3 scripts/verify_dependency_security.py build/reports/dependency-security

      - name: Export observed dependency inventory
        if: success()
        continue-on-error: true
        run: python3 scripts/verify_dependency_security.py build/reports/dependency-security --inventory build/reports/dependency-security/inventory/selected.json

      - name: Retain selected dependency security evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: dependency-security-${{ github.job }}-${{ strategy.job-index || 0 }}
          path: build/reports/dependency-security
          if-no-files-found: ignore
          retention-days: 14
  # Preserve the existing check name for branch protection and consumers.
  # A successful docs-only classifier permits only the named Android skips.
  # Deliberate PR skips are derived here from the event, never from job output:
  # secondary-variant runs only on ready PRs, compose-compiler is skipped for
  # deferred campaigns and drafts. Missing outputs, unexpected skips, failures
  # and cancellations remain red.
  # Drafts report under a different name. A green draft result must never be
  # the latest required check on a head that is then marked ready, because the
  # ready run creates this job only after its heavy lanes finish.
  validate:
    name: Compile, test, ktlint, detekt, Android lint${{ github.event.pull_request.draft && ' (draft fast lane)' || '' }}
    needs: [changes, tooling-contracts, offline-zsp, compile, build-contracts, compose-compiler, compile-tests, static-analysis, tests, secondary-variant]
    if: always()
    runs-on: *wn-build-server
    timeout-minutes: 5
    steps:
      - name: Require every validation job to succeed
        env:
          JOB_RESULTS: ${{ toJSON(needs) }}
          CI_EVENT: ${{ github.event_name }}
          PR_DRAFT: ${{ github.event.pull_request.draft == true }}
          ANDROID_CI_MODE: ${{ vars.ANDROID_CI_MODE }}
        shell: bash
        run: |
          set -euo pipefail
          printf '%s\n' "$JOB_RESULTS" | jq -r 'to_entries[] | "\(.key): \(.value.result)"'
          printf '%s\n' "$JOB_RESULTS" | jq -e --arg event "$CI_EVENT" --arg draft "$PR_DRAFT" --arg mode "$ANDROID_CI_MODE" '
            (.changes.outputs.full_matrix == "true") as $full |
            ($event == "pull_request" and $draft == "true" and ($full | not)) as $is_draft |
            (.changes.outputs.precheck == "true") as $precheck |
            ($event == "pull_request" and $draft == "false" and ($precheck | not) and ($full | not)) as $is_ready |
            (["pull_request", "merge_group", "push", "schedule", "workflow_dispatch"] | index($event) != null) and
            ($draft == "true" or $draft == "false") and ($event == "pull_request" or $draft == "false") and
            (keys == ["build-contracts", "changes", "compile", "compile-tests", "compose-compiler", "offline-zsp", "secondary-variant", "static-analysis", "tests", "tooling-contracts"]) and
            (.changes.outputs.full_matrix == "true" or .changes.outputs.full_matrix == "false") and
            (.changes.outputs.ci_mode == (if $precheck then "precheck" elif $full then "full" else "legacy-pr" end)) and
            (($event == "pull_request") or $full) and
            (($full | not) or ((.changes.outputs.docs_only == "false") and ($precheck | not))) and
            (.changes.outputs.precheck == "true" or .changes.outputs.precheck == "false") and
            (($precheck | not) or ($event == "pull_request" and $mode == "merge-queue" and .changes.outputs.supplemental_campaigns == "false")) and
            (.changes.result == "success") and
            (."tooling-contracts".result == "success") and
            (.changes.outputs.docs_only == "true" or .changes.outputs.docs_only == "false") and
            (.changes.outputs.supplemental_campaigns == "true" or .changes.outputs.supplemental_campaigns == "false") and
            (.changes.outputs.supplemental_campaigns as $campaigns | if .changes.outputs.docs_only == "true" then
              ($event == "pull_request") and .changes.outputs.supplemental_campaigns == "false" and all(to_entries[];
                if .key == "changes" or .key == "tooling-contracts" then .value.result == "success"
                else .value.result == "skipped" end)
            else all(to_entries[];
              if $precheck and (.key == "tests" or .key == "static-analysis" or .key == "secondary-variant") then .value.result == "skipped"
              elif .key == "compile-tests" then .value.result == (if $precheck then "success" else "skipped" end)
              elif .key == "compose-compiler" and ($campaigns == "false" or $is_draft) then .value.result == "skipped"
              elif .key == "secondary-variant" then .value.result == (if $is_ready then "success" else "skipped" end)
              else .value.result == "success" end) end)
          ' > /dev/null
