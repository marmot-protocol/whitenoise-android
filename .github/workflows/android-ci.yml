      - name: Upload Compose regression results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: compose-rectlist-regressions-${{ matrix.flavor }}-${{ matrix.shard }}
          path: |
            app/build/test-results/testDev${{ matrix.flavor }}DebugUnitTest/TEST-dev.ipf.whitenoise.android.ui.conversation.messages.ComposeRectListRegressionTest.xml
            app/build/test-results/testDev${{ matrix.flavor }}DebugUnitTest/TEST-dev.ipf.whitenoise.android.ui.conversation.messages.BubbleFooterRectListReuseTest.xml
          if-no-files-found: ignore
          retention-days: 14

      # Keep task timings on successful runs too; wall-clock timeouts alone do
      # not show whether compilation, tests, or analysis is doing extra work.
      - name: Upload Gradle timing reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: android-ci-gradle-profiles-${{ matrix.flavor }}-${{ matrix.shard }}
          path: build/reports/profile/
          if-no-files-found: ignore
          retention-days: 7

      # Read existing resolutions only; retain proof without a second build.
      - name: Verify selected dependency security floors
        if: success()
        run: python3 scripts/verify_dependency_security.py build/reports/dependency-security

      - name: Export observed dependency inventory
        if: success()
        continue-on-error: true
        run: python3 scripts/verify_dependency_security.py build/reports/dependency-security --inventory build/reports/dependency-security/inventory/selected.json

      - name: Retain selected dependency security evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: dependency-security-${{ github.job }}-${{ strategy.job-index || 0 }}
          path: build/reports/dependency-security
          if-no-files-found: ignore
          retention-days: 14
  # Merge the unit-test shards: every committed golden must be compared by some shard,
  # and Zapstore coverage gates read all shards' binary reports. Kover runs against the
  # class directories shard 0 compiled, so this job neither recompiles nor reruns tests.
  coverage:
    needs: [changes, tests]
    if: needs.changes.outputs.docs_only != 'true' && needs.changes.outputs.precheck != 'true'
    name: Screenshot ownership and coverage
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          ref: ${{ github.sha }}

      - name: Download shard golden comparison evidence
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          pattern: android-ci-golden-results-*
          path: build/golden-results

      - name: Require every committed screenshot golden to be compared
        env:
          CI_FLAVORS: ${{ github.event_name == 'pull_request' && needs.changes.outputs.full_matrix != 'true' && 'Zapstore' || 'Zapstore Play' }}
        run: |
          for flavor in $CI_FLAVORS; do
            summaries=(build/golden-results/android-ci-golden-results-"$flavor"-*/results-summary.json)
            [[ -f "${summaries[0]}" ]] || { echo "No $flavor shard produced a screenshot summary" >&2; exit 1; }
            echo "$flavor: ${#summaries[@]} shard summaries"
            python3 scripts/check_screenshot_baseline_owners.py --results "${summaries[@]}"
          done

      - name: Configure MarmotKit cache directory
        if: ${{ !github.event.pull_request.draft || needs.changes.outputs.full_matrix == 'true' }}
        shell: bash
        run: printf 'WHITENOISE_MARMOTKIT_CACHE_DIR=%s\n' "$RUNNER_TEMP/marmotkit-cache" >> "$GITHUB_ENV"

      # AGP 9.x / Gradle 9.4.1 require JDK 17.
      - name: Set up JDK 17
        if: ${{ !github.event.pull_request.draft || needs.changes.outputs.full_matrix == 'true' }}
        uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: '17'

      # Report tasks only; the shards own the cache entries.
      - name: Set up Gradle
        if: ${{ !github.event.pull_request.draft || needs.changes.outputs.full_matrix == 'true' }}
        uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
        with:
          cache-read-only: true

      - name: Read MarmotKit artifact pin
        id: marmotkit
        if: ${{ !github.event.pull_request.draft || needs.changes.outputs.full_matrix == 'true' }}
        shell: bash
        run: |
          sha="$(awk -F= '$1 == "artifact-sha256" { print $2 }' app/src/main/marmotkit/MARMOT_VERSION)"
          [[ "$sha" =~ ^[0-9a-f]{64}$ ]] || { echo "Invalid MarmotKit artifact SHA-256" >&2; exit 1; }
          printf 'sha=%s\n' "$sha" >> "$GITHUB_OUTPUT"

      - name: Restore MarmotKit artifact
        if: ${{ !github.event.pull_request.draft || needs.changes.outputs.full_matrix == 'true' }}
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/marmotkit-cache
          key: marmotkit-${{ runner.os }}-${{ steps.marmotkit.outputs.sha }}

      - name: Download shard coverage data
        if: ${{ !github.event.pull_request.draft || needs.changes.outputs.full_matrix == 'true' }}
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          pattern: kover-binary-Zapstore-*
          path: build/kover-shards

      - name: Download Kover class directories
        if: ${{ !github.event.pull_request.draft || needs.changes.outputs.full_matrix == 'true' }}
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: kover-classes-Zapstore
          path: build/kover-classes

      # Name each shard's report uniquely in one directory and require all four.
      - name: Restore shard coverage inputs
        if: ${{ !github.event.pull_request.draft || needs.changes.outputs.full_matrix == 'true' }}
        run: |
          mkdir -p build/kover-shard-reports
          for shard in 0 1 2 3; do
            cp "build/kover-shards/kover-binary-Zapstore-$shard/testDevZapstoreDebugUnitTest.ic" \
              "build/kover-shard-reports/shard-$shard.ic"
          done
          python3 scripts/kover_class_outputs.py unpack build/kover-classes/kover-classes.tar

      # Coverage gate: fail CI when overall line coverage drops below the ratchet floor in
      # app/build.gradle.kts, then publish the HTML/XML report. DevZapstoreDebug only; the
      # aggregate kover tasks pull in release variants, whose packaging trips the
      # unsigned-release guard (no signing in CI). Compilation and tests are excluded:
      # the restored classes and shard reports are the inputs.
      - name: Coverage gate and report (Kover)
        if: ${{ !github.event.pull_request.draft || needs.changes.outputs.full_matrix == 'true' }}
        run: >-
          ./gradlew :app:koverVerifyDevZapstoreDebug :app:koverXmlReportDevZapstoreDebug
          :app:koverHtmlReportDevZapstoreDebug
          -x :app:testDevZapstoreDebugUnitTest -x :app:compileDevZapstoreDebugKotlin
          -x :app:compileDevZapstoreDebugJavaWithJavac
          -Pwhitenoise.koverShardReportsDir="$PWD/build/kover-shard-reports"
          -Proborazzi.test.verify=true --profile --no-daemon --stacktrace

      # Reuse the merged report; no extra Gradle invocation or tests.
      # Runtime listener: 16/17 lines (94.1176%), zero eligible branches.
      # Viewport family: 82/82 lines, 52/56 branches; preserve 100%/90% floors.
      - name: Runtime listener and viewport restoration coverage floors
        if: ${{ !github.event.pull_request.draft || needs.changes.outputs.full_matrix == 'true' }}
        run: |
          python3 scripts/check_runtime_listener_coverage.py app/build/reports/kover/reportDevZapstoreDebug.xml
          python3 scripts/check_viewport_restoration_coverage.py app/build/reports/kover/reportDevZapstoreDebug.xml

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: kover-coverage-report-Zapstore
          path: |
            app/build/reports/kover/
          if-no-files-found: ignore
          retention-days: 7

      - name: Upload Gradle timing reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: android-ci-gradle-profiles-coverage
          path: build/reports/profile/
          if-no-files-found: ignore
          retention-days: 7
  # PRs run the full suite for Zapstore only. Compile Play (main, unit-test and
  # androidTest sources) and run the unit tests that branch on its BuildConfig,
  # so Play-only code still fails the PR. master/nightly run Play's full suite.
  secondary-variant:
    needs: changes
    if: needs.changes.outputs.docs_only != 'true' && github.event_name == 'pull_request' && needs.changes.outputs.precheck != 'true' && needs.changes.outputs.full_matrix != 'true' && !github.event.pull_request.draft
    name: Compile and flavor-check Play
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          ref: ${{ github.sha }}

      - name: Configure MarmotKit cache directory
        shell: bash
        run: printf 'WHITENOISE_MARMOTKIT_CACHE_DIR=%s\n' "$RUNNER_TEMP/marmotkit-cache" >> "$GITHUB_ENV"

      # AGP 9.x / Gradle 9.4.1 require JDK 17.
      - name: Set up JDK 17
        uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/master' }}

      - name: Read MarmotKit artifact pin
        id: marmotkit
        shell: bash
        run: |
          sha="$(awk -F= '$1 == "artifact-sha256" { print $2 }' app/src/main/marmotkit/MARMOT_VERSION)"
          [[ "$sha" =~ ^[0-9a-f]{64}$ ]] || { echo "Invalid MarmotKit artifact SHA-256" >&2; exit 1; }
          printf 'sha=%s\n' "$sha" >> "$GITHUB_OUTPUT"

      - name: Restore MarmotKit artifact
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/marmotkit-cache
          key: marmotkit-${{ runner.os }}-${{ steps.marmotkit.outputs.sha }}

      # Robolectric downloads these inside the test JVMs without retrying; fetch them first.
      # It took 8 s on a hosted runner; the cap keeps a slow mirror from eating the test budget.
      - name: Prefetch Robolectric Android jars
        timeout-minutes: 5
        shell: bash
        run: ./scripts/prefetch-robolectric-android-all.sh

      - name: Compile Play and run its flavor-sensitive unit tests
        shell: bash
        run: |
          set -euo pipefail
          # Every other unit test exercises the same shared code under Zapstore.
          mapfile -t sources < <(grep -rlF 'BuildConfig.SELF_UPDATE_ENABLED' app/src/test/java | sort)
          if [[ ${#sources[@]} -eq 0 ]]; then
            echo 'No unit test reads BuildConfig.SELF_UPDATE_ENABLED; update this selector' >&2
            exit 1
          fi
          filters=()
          for source in "${sources[@]}"; do
            class="${source#app/src/test/java/}"
            class="${class%.*}"
            filters+=(--tests "${class//\//.}")
          done
          ./gradlew :app:compileDevPlayDebugAndroidTestKotlin :app:testDevPlayDebugUnitTest "${filters[@]}" \
            -Proborazzi.test.verify=true --build-cache --profile --daemon --stacktrace

      - name: Upload reports
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: android-ci-reports-secondary-variant
          path: |
            app/build/reports/
            app/build/test-results/
          if-no-files-found: ignore
          retention-days: 7

      - name: Upload Gradle timing reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: android-ci-gradle-profiles-secondary-variant
          path: build/reports/profile/
          if-no-files-found: ignore
          retention-days: 7

      # Read existing resolutions only; retain proof without a second build.
      - name: Verify selected dependency security floors
        if: success()
        run: python3 scripts/verify_dependency_security.py build/reports/dependency-security

      - name: Export observed dependency inventory
        if: success()
        continue-on-error: true
        run: python3 scripts/verify_dependency_security.py build/reports/dependency-security --inventory build/reports/dependency-security/inventory/selected.json

      - name: Retain selected dependency security evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: dependency-security-${{ github.job }}-${{ strategy.job-index || 0 }}
          path: build/reports/dependency-security
          if-no-files-found: ignore
          retention-days: 14
  # Preserve the existing check name for branch protection and consumers.
  # A successful docs-only classifier permits only the named Android skips.
  # Deliberate PR skips are derived here from the event, never from job output:
  # secondary-variant runs only on ready PRs, compose-compiler is skipped for
  # deferred campaigns and drafts. Missing outputs, unexpected skips, failures
  # and cancellations remain red.
  # Drafts report under a different name. A green draft result must never be
  # the latest required check on a head that is then marked ready, because the
  # ready run creates this job only after its heavy lanes finish.
  validate:
    name: Compile, test, ktlint, detekt, Android lint${{ github.event.pull_request.draft && ' (draft fast lane)' || '' }}
    needs: [changes, tooling-contracts, offline-zsp, build-contracts, compose-compiler, compile-tests, static-analysis, tests, coverage, secondary-variant]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require every validation job to succeed
        env:
          JOB_RESULTS: ${{ toJSON(needs) }}
          CI_EVENT: ${{ github.event_name }}
          PR_DRAFT: ${{ github.event.pull_request.draft == true }}
          ANDROID_CI_MODE: ${{ vars.ANDROID_CI_MODE }}
        shell: bash
        run: |
          set -euo pipefail
          printf '%s\n' "$JOB_RESULTS" | jq -r 'to_entries[] | "\(.key): \(.value.result)"'
          printf '%s\n' "$JOB_RESULTS" | jq -e --arg event "$CI_EVENT" --arg draft "$PR_DRAFT" --arg mode "$ANDROID_CI_MODE" '
            (.changes.outputs.full_matrix == "true") as $full |
            ($event == "pull_request" and $draft == "true" and ($full | not)) as $is_draft |
            (.changes.outputs.precheck == "true") as $precheck |
            ($event == "pull_request" and $draft == "false" and ($precheck | not) and ($full | not)) as $is_ready |
            (["pull_request", "merge_group", "push", "schedule", "workflow_dispatch"] | index($event) != null) and
            ($draft == "true" or $draft == "false") and ($event == "pull_request" or $draft == "false") and
            (keys == ["build-contracts", "changes", "compile-tests", "compose-compiler", "coverage", "offline-zsp", "secondary-variant", "static-analysis", "tests", "tooling-contracts"]) and
            (.changes.outputs.full_matrix == "true" or .changes.outputs.full_matrix == "false") and
            (.changes.outputs.ci_mode == (if $precheck then "precheck" elif $full then "full" else "legacy-pr" end)) and
            (($event == "pull_request") or $full) and
            (($full | not) or ((.changes.outputs.docs_only == "false") and ($precheck | not))) and
            (.changes.outputs.precheck == "true" or .changes.outputs.precheck == "false") and
            (($precheck | not) or ($event == "pull_request" and $mode == "merge-queue" and .changes.outputs.supplemental_campaigns == "false")) and
            (.changes.result == "success") and
            (."tooling-contracts".result == "success") and
            (.changes.outputs.docs_only == "true" or .changes.outputs.docs_only == "false") and
            (.changes.outputs.supplemental_campaigns == "true" or .changes.outputs.supplemental_campaigns == "false") and
            (.changes.outputs.supplemental_campaigns as $campaigns | if .changes.outputs.docs_only == "true" then
              ($event == "pull_request") and .changes.outputs.supplemental_campaigns == "false" and all(to_entries[];
                if .key == "changes" or .key == "tooling-contracts" then .value.result == "success"
                else .value.result == "skipped" end)
            else all(to_entries[];
              if $precheck and (.key == "tests" or .key == "coverage" or .key == "static-analysis" or .key == "secondary-variant") then .value.result == "skipped"
              elif .key == "compile-tests" then .value.result == (if $precheck then "success" else "skipped" end)
              elif .key == "compose-compiler" and ($campaigns == "false" or $is_draft or $event == "pull_request" or $event == "merge_group") then .value.result == "skipped"
              elif .key == "secondary-variant" then .value.result == (if $is_ready then "success" else "skipped" end)
              else .value.result == "success" end) end)
          ' > /dev/null
