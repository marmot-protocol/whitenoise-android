        id: unit_tests
        env:
          CI_FULL_MATRIX: ${{ needs.changes.outputs.full_matrix }}
        run: |
          extra_tasks=()
          if [[ "$ORG_GRADLE_PROJECT_ciTestShard" == 0 && "$CI_FULL_MATRIX" == true ]]; then
            extra_tasks+=(:app:compileDev${{ matrix.flavor }}DebugAndroidTestKotlin)
          fi
          if [[ "$ORG_GRADLE_PROJECT_ciTestShard" == 0 && "${{ matrix.flavor }}" == Zapstore ]]; then
            extra_tasks+=(:app:koverGenerateArtifactDevZapstoreDebug)
          fi
