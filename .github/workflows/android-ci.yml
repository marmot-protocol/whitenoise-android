name: Android CI

# Required validation CI for the Android client. Runs the same checks a
# contributor must require on GitHub (see README "Continuous
# Integration" and docs/ci-request-policy.md). Dev debug variant only: no signing secrets, no
# google-services.json, so this never depends on release/Play/Zapstore
# credentials.
#
# Scope: compile + unit tests + ktlint + detekt + Android lint. APK build artifacts are a
# separate workflow (see issue #247).
#
# Activated queue mode uses compile/style/security PR prechecks and full
# integration suites. Unset/unknown modes preserve prior PR validation.
# ci:full opts into the complete two-distribution core matrix. Every merge group,
# master, nightly and dispatch run stays full (docs/ci-request-policy.md).

on:
  pull_request:
    branches: [master]
    types: [opened, synchronize, reopened, ready_for_review]
  merge_group:
    types: [checks_requested]
  push:
    branches: [master]
  schedule:
    - cron: '43 2 * * *'
  workflow_dispatch:
    inputs:
      capture_dependency_inputs:
        description: Capture unapproved dependency input candidates for independent review
        required: false
        default: false
        type: boolean
      capture_benchmark_dependency_inputs:
        description: Also capture benchmark-release Android test dependency candidates
        required: false
        default: false
        type: boolean

# Superseded PR runs retain normal cancellation. Queue integrations use their
# run identity so two attempts for the same integration remain independent.
# Other events retain same-ref cancellation of superseded work.
concurrency:
  group: android-ci-${{ github.workflow }}-${{ github.event_name }}-${{ github.event_name == 'merge_group' && github.run_id || github.ref }}
  cancel-in-progress: ${{ github.event_name != 'merge_group' }}

permissions:
  contents: read

jobs:
  changes:
    permissions:
      contents: read
      issues: read
    name: Classify complete PR changes
    runs-on: &wn-build-server ${{ github.event.pull_request.head.repo.fork && 'ubuntu-latest' || fromJSON('["self-hosted", "wn-build-server"]') }}
    timeout-minutes: 10
    outputs:
      docs_only: ${{ steps.classify.outputs.docs_only }}
      supplemental_campaigns: ${{ steps.classify.outputs.supplemental_campaigns }}
      precheck: ${{ steps.classify.outputs.precheck }}
      full_matrix: ${{ steps.classify.outputs.full_matrix }}
      ci_mode: ${{ steps.classify.outputs.ci_mode }}
      tooling_regressions: ${{ steps.classify.outputs.tooling_regressions }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          clean: false
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ github.sha }}

      # Persistent runners keep Gradle's incremental state between jobs.
      - name: Prepare persistent workspace
        run: bash .github/scripts/prepare-persistent-workspace.sh

      - name: Test conservative CI classification
        run: python3 -m unittest scripts/test_check_ci_changes.py

      # The event may predate a maintainer's full-CI request. Read labels at run
      # time with read-only credentials; API errors fail closed to full CI.
      - name: Read current full-CI override
        id: labels
        if: github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        shell: bash
        run: |
          labels=null
          if observed=$(gh api "repos/$GH_REPO/issues/$PR_NUMBER/labels" --paginate --slurp); then
            labels=$(printf '%s' "$observed" | jq -ce '[.[][] | .name]') || labels=null
          fi
          printf 'labels=%s\n' "$labels" >> "$GITHUB_OUTPUT"

      - name: Classify complete PR diff
        id: classify
        env:
          ANDROID_CI_MODE: ${{ vars.ANDROID_CI_MODE }}
          CI_CURRENT_LABELS: ${{ steps.labels.outputs.labels }}
          CI_EVENT: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.merge_group.base_sha || github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event.merge_group.head_sha || github.event.pull_request.head.sha || github.sha }}
        run: python3 scripts/check_ci_changes.py --event "$CI_EVENT" --base "$BASE_SHA" --head "$HEAD_SHA"

  tooling-contracts:
    needs: changes
    name: Validate tooling and documentation contracts
    runs-on: *wn-build-server
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          clean: false
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ github.sha }}

      # Persistent runners keep Gradle's incremental state between jobs.
      - name: Prepare persistent workspace
        run: bash .github/scripts/prepare-persistent-workspace.sh

      - name: Validate committed dependency locks and supplier evidence
        run: python3 scripts/check_dependency_inputs.py

      - name: Test selected dependency evidence validator
        run: python3 -m unittest scripts/test_verify_dependency_security.py scripts/test_dependency_inventory.py scripts/test_compare_ci_dependency_inventory.py scripts/test_generate_local_notices.py scripts/test_verify_notice_resources.py scripts/test_check_dependency_inputs.py scripts/test_audit_dependency_metadata.py

      - name: Test manual release guide and viewport coverage validators
        run: python3 -m unittest scripts/test_check_manual_test_guide.py scripts/test_manual_test_fragments.py scripts/test_check_scroll_edge_fades.py scripts/test_check_viewport_restoration_coverage.py scripts/test_paging_trace_report.py

      # This must run outside the path-filtered fuzz workflow: missing a parser
      # trigger would otherwise also skip the check intended to catch it.
      - name: Validate fuzz PR production triggers
        run: |
          python3 scripts/check_fuzz_pr_triggers.py
          python3 -m unittest scripts/test_check_fuzz_pr_triggers.py scripts/test_check_queue_fuzz_scope.py scripts/test_whitenoise_android_serial_queue.py

      - name: Validate Actions merge authorization boundary
        run: |
          python3 -m venv "$RUNNER_TEMP/ci-permissions"
          "$RUNNER_TEMP/ci-permissions/bin/pip" install --disable-pip-version-check PyYAML==6.0.3
          "$RUNNER_TEMP/ci-permissions/bin/python" scripts/check_merge_authorization_boundary.py
          "$RUNNER_TEMP/ci-permissions/bin/python" -m unittest scripts/test_merge_authorization_boundary.py

      - name: Test attachment fixture HTTP ledger and cancellation contracts
        if: needs.changes.outputs.tooling_regressions != 'false'
        run: python3 -m unittest discover -s tools/attachment-fixture -p 'test_*.py'

      # These suites use scripts, workflows and committed fixtures, not changing
      # production UI source. Unknown inputs and all integrations run them.
      - name: Test Maestro artifact and manual-only execution contracts
        if: needs.changes.outputs.tooling_regressions != 'false'
        run: python3 -m unittest scripts/test_maestro_apk.py scripts/test_maestro_suite.py scripts/test_maestro_offline_batches.py scripts/test_maestro_environment.py scripts/test_maestro_host_pressure.py scripts/test_maestro_sdk_image.py

      - name: Test Maestro production-source and screen contracts
        run: python3 -m unittest scripts/test_maestro_runtime.py scripts/test_maestro_screen_coverage.py scripts/test_maestro_modal_discovery.py

      - name: Validate manual release guide
        env:
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          python3 scripts/check_manual_test_guide.py
          if [[ -n "$PR_BASE_SHA" ]]; then
            python3 scripts/check_manual_test_guide.py --base "$PR_BASE_SHA"
          fi

      - name: Assemble the source-bound manual testing guide
        env:
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          python3 scripts/check_manual_test_guide.py --output-dir build/manual-release-testing
          python3 scripts/maestro_coverage.py --require-screens --output build/manual-release-testing/campaign-inventory.json \
            --markdown-output build/manual-release-testing/campaign-inventory.md --source-sha "$(git rev-parse HEAD)"
          git rev-parse HEAD > build/manual-release-testing/source-revision.txt
          printf 'pr_head=%s\npr_base=%s\n' "$PR_HEAD_SHA" "$PR_BASE_SHA" >> build/manual-release-testing/source-revision.txt

      - name: Retain the assembled manual testing guide
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: manual-release-testing-${{ github.sha }}
          path: build/manual-release-testing/
          if-no-files-found: error
          retention-days: 30

      # The invariant-gate workflow runs base-revision tests, so a proposed checker change is tested only here.
      - name: Test PR GitHub scripts
        run: >-
          node --test .github/scripts/update-pr-screenshots.test.js .github/scripts/update-pr-preview-links.test.js
          .github/scripts/check-invariant-gate.test.js

      - name: Test GitHub triage reconciliation
        run: python3 -m unittest scripts/test_check_github_triage.py

      - name: Test stale-result recurrence classifier
        run: python3 -m unittest scripts/test_stale_result_recurrence.py

      - name: Test package-replacement startup reporter
        run: bash .github/scripts/test-package-replacement-startup-report.sh

      - name: Test background delivery measurement acceptance
        run: python3 -m unittest scripts.test_background_delivery_report scripts.test_background_fixture_artifacts scripts.test_background_fixture_state scripts.test_background_perfetto

      - name: Test preview security and update contracts
        run: |
          bash .github/scripts/test-pr-preview-contract.sh
          bash .github/scripts/test-pr-preview-validation.sh

      - name: Test PR preview publisher
        run: bash .github/scripts/test-publish-pr-apk-to-github-release.sh

      - name: Test release and staging transport tooling
        run: |
          ./scripts/release_test.sh
          .github/scripts/test-staging-apk-transport.sh

      - name: Test production release safety gates
        run: python3 -m unittest scripts/test_release_pipeline.py

      - name: Verify Android release metadata and store assets
        run: ./scripts/check-release-metadata.py

      - name: Test MarmotKit artifact preparation
        run: ./scripts/test-prepare-marmotkit-artifact.sh

      - name: Verify generated performance profiles
        run: |
          bash .github/scripts/test-verify-generated-profiles.sh
          bash scripts/verify-generated-profiles.sh

      - name: Test Android CI aggregate gate
        run: python3 -m unittest scripts/test_android_ci_gate.py scripts/test_unit_test_diagnostics.py scripts/test_verify_compose_release_apk.py

      - name: Check committed screenshot golden owners
        run: |
          python3 -m unittest scripts/test_check_screenshot_baseline_owners.py
          python3 scripts/check_screenshot_baseline_owners.py

      - name: Test instrumented dispatch and required cases
        run: |
          python3 -m unittest scripts/test_run_android_instrumented_dispatch.py scripts/test_hosted_startup_trace.py scripts/test_instrumented_artifact_retention.py
          python3 -m unittest scripts/test_outbound_share_visibility.py
          python3 -m unittest scripts/test_select_android_cmdline_tools.py
          python3 -m unittest scripts/test_check_instrumented_required_cases.py
          python3 -m unittest scripts/test_select_instrumented_lanes.py

  offline-zsp:
    needs: changes
    if: needs.changes.outputs.docs_only != 'true'
    name: Verify real ZSP offline signer contract
    runs-on: *wn-build-server
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          clean: false
          persist-credentials: false
          ref: ${{ github.sha }}

      # Persistent runners keep Gradle's incremental state between jobs.
      - name: Prepare persistent workspace
        run: bash .github/scripts/prepare-persistent-workspace.sh

      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.24.11'
          cache: false
      - name: Install fixture APK tooling
        run: '"$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36" "build-tools;36.0.0"'
      - name: Rehearse with disposable keys and a loopback signer
        run: bash scripts/test-zsp-offline.sh
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: zsp-offline-contract
          path: build/reports/zsp-offline.json
          if-no-files-found: error
          retention-days: 14

  # Compile the debug variants every Gradle job below needs, once, into the
  # build cache. Unit tests, lint, build contracts and the Play lane each used
  # to compile them in parallel; on a shared runner pool that repeated the same
  # Kotlin compilation up to four times per push. They now load it from cache.
  compile:
    needs: changes
    if: needs.changes.outputs.docs_only != 'true'
    name: Compile shared debug variants
    runs-on: *wn-build-server
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          clean: false
          persist-credentials: false
          ref: ${{ github.sha }}

      # Persistent runners keep Gradle's incremental state between jobs.
      - name: Prepare persistent workspace
        run: bash .github/scripts/prepare-persistent-workspace.sh

      - name: Configure MarmotKit cache directory
        shell: bash
        run: printf 'WHITENOISE_MARMOTKIT_CACHE_DIR=%s\n' "$RUNNER_TEMP/marmotkit-cache" >> "$GITHUB_ENV"

      # AGP 9.x / Gradle 9.4.1 require JDK 17.
      - name: Set up JDK 17
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
        with:
          cache-disabled: ${{ runner.environment == 'self-hosted' }}
          cache-read-only: ${{ github.event_name == 'merge_group' || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository) }}

      - name: Read MarmotKit artifact pin
        id: marmotkit
        shell: bash
        run: |
          sha="$(awk -F= '$1 == "artifact-sha256" { print $2 }' app/src/main/marmotkit/MARMOT_VERSION)"
          [[ "$sha" =~ ^[0-9a-f]{64}$ ]] || { echo "Invalid MarmotKit artifact SHA-256" >&2; exit 1; }
          printf 'sha=%s\n' "$sha" >> "$GITHUB_OUTPUT"

      - name: Restore MarmotKit artifact
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/marmotkit-cache
          key: marmotkit-${{ runner.os }}-${{ steps.marmotkit.outputs.sha }}

      # Play is compiled only when a Play lane runs: ready and full PR runs,
      # merge groups, master and dispatches. Drafts and prechecks skip it.
      - name: Compile shared debug variants
        env:
          CI_PLAY: ${{ needs.changes.outputs.precheck != 'true' && (!github.event.pull_request.draft || needs.changes.outputs.full_matrix == 'true') }}
        run: |
          flavors=(Zapstore)
          if [[ "$CI_PLAY" == true ]]; then
            flavors+=(Play)
          fi
          tasks=()
          for flavor in "${flavors[@]}"; do
            for source in '' UnitTest AndroidTest; do
              tasks+=(":app:compileDev${flavor}Debug${source}Kotlin")
            done
          done
          ./gradlew "${tasks[@]}" --build-cache --profile --no-daemon --stacktrace

      - name: Upload reports
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: android-ci-reports-compile
          path: app/build/reports/
          if-no-files-found: ignore
          retention-days: 7

      - name: Upload Gradle timing reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: android-ci-gradle-profiles-compile
          path: build/reports/profile/
          if-no-files-found: ignore
          retention-days: 7

  build-contracts:
    permissions:
      contents: read
      actions: read
    needs: [changes, compile]
    if: needs.changes.outputs.docs_only != 'true'
    name: Build contracts (${{ matrix.phase }})
    runs-on: *wn-build-server
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        # Drafts keep compile/ktlint/detekt and defer release packaging.
        phase: ${{ fromJSON(((github.event.pull_request.draft && needs.changes.outputs.full_matrix != 'true') || needs.changes.outputs.precheck == 'true') && '["tooling"]' || '["tooling", "baseline"]') }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          clean: false
          persist-credentials: false
          ref: ${{ github.sha }}
          fetch-depth: 0

      # Persistent runners keep Gradle's incremental state between jobs.
      - name: Prepare persistent workspace
        run: bash .github/scripts/prepare-persistent-workspace.sh

      - name: Configure MarmotKit cache directory
        shell: bash
        run: printf 'WHITENOISE_MARMOTKIT_CACHE_DIR=%s\n' "$RUNNER_TEMP/marmotkit-cache" >> "$GITHUB_ENV"

      # AGP 9.x / Gradle 9.4.1 require JDK 17.
      - name: Set up JDK 17
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '17'

      # Retain this job's task outputs instead of relying on the Play test cache.
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
        with:
          cache-disabled: ${{ runner.environment == 'self-hosted' }}
          cache-read-only: ${{ github.event_name == 'merge_group' || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository) }}

      - name: Read MarmotKit artifact pin
        id: marmotkit
        shell: bash
        run: |
          sha="$(awk -F= '$1 == "artifact-sha256" { print $2 }' app/src/main/marmotkit/MARMOT_VERSION)"
          [[ "$sha" =~ ^[0-9a-f]{64}$ ]] || { echo "Invalid MarmotKit artifact SHA-256" >&2; exit 1; }
          printf 'sha=%s\n' "$sha" >> "$GITHUB_OUTPUT"

      - name: Restore MarmotKit artifact
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/marmotkit-cache
          key: marmotkit-${{ runner.os }}-${{ steps.marmotkit.outputs.sha }}

      - name: Prepare MarmotKit API signature
        if: matrix.phase == 'tooling'
        run: ./gradlew :app:stageMarmotKitApiSignature --build-cache --profile --daemon --stacktrace

      - name: Upload MarmotKit API signature
        if: matrix.phase == 'tooling'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: marmotkit-api-signature
          path: app/build/reports/marmotkit/
          if-no-files-found: error
          retention-days: 14

      - name: Verify packaged system labels for every app variant
        if: matrix.phase == 'tooling'
        run: |
          ./scripts/test-system-labels.sh
          # This runner owns the lightweight daemon; free its heap before isolated builds.
          ./gradlew --stop

      - name: Verify production signing and bundle task isolation
        if: matrix.phase == 'tooling'
        run: python3 scripts/test-release-gradle.py

      # When the baseline phase runs, it assembles the benchmark APK with the
      # app's, so R8 minifies the release build once per run instead of twice.
      - name: Compile (Kotlin)
        env:
          CI_PRECHECK: ${{ needs.changes.outputs.precheck }}
          CI_FULL_MATRIX: ${{ needs.changes.outputs.full_matrix }}
          CI_BASELINE_PHASE: ${{ needs.changes.outputs.precheck != 'true' && (!github.event.pull_request.draft || needs.changes.outputs.full_matrix == 'true') }}
        if: matrix.phase == 'tooling'
        run: |
          if [[ "$CI_PRECHECK" == true ]]; then
            ./gradlew :benchmark:compileDevZapstoreBenchmarkReleaseKotlin --build-cache --profile --no-daemon --stacktrace
          else
            if [[ "$CI_FULL_MATRIX" != true ]]; then
              ./gradlew :app:compileDevZapstoreDebugAndroidTestKotlin --build-cache --profile --no-daemon --stacktrace
            fi
            if [[ "$CI_BASELINE_PHASE" != true ]]; then
              ./gradlew :benchmark:assembleDevZapstoreBenchmarkRelease --build-cache --profile --no-daemon --stacktrace
            fi
          fi

      - name: ktlint and detekt
        if: matrix.phase == 'tooling'
        run: ./gradlew :app:ktlintCheck :benchmark:ktlintCheck :app:detekt --build-cache --profile --no-daemon --stacktrace

      # Package on a separate runner so release compilation overlaps tooling checks.
      - name: Assemble app for Baseline Profile verification
        if: matrix.phase == 'baseline'
        run: ./gradlew :app:assembleDevZapstoreBenchmarkRelease :benchmark:assembleDevZapstoreBenchmarkRelease --build-cache --profile --no-daemon --stacktrace

      - name: Verify packaged Baseline Profile assets
        id: baseline_apk
        if: matrix.phase == 'baseline'
        shell: bash
        run: |
          set -euo pipefail
          metadata=app/build/outputs/apk/devZapstore/benchmarkRelease/output-metadata.json
          output_file=$(jq -er '
            select(
              .applicationId == "dev.ipf.whitenoise.android.dev" and
              .variantName == "devZapstoreBenchmarkRelease"
            )
            | [.elements[] | select((.filters // []) | length == 0)]
            | if length == 1 then .[0].outputFile else empty end
          ' "$metadata")
          app_apk="$(dirname "$metadata")/$output_file"
          bash scripts/verify-baseline-profile.sh "$app_apk"
          printf 'apk=%s\n' "$app_apk" >> "$GITHUB_OUTPUT"

      - name: Stage the existing APK for optional Maestro testing
        id: maestro_stage
        if: matrix.phase == 'baseline' && (github.event_name == 'push' || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository))
        continue-on-error: true
        env:
          APK_SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          APP_APK: ${{ steps.baseline_apk.outputs.apk }}
        run: python3 scripts/maestro_apk.py stage --apk "$APP_APK" --destination build/maestro-apk

      - name: Retain the existing APK for optional Maestro testing
        if: steps.maestro_stage.outcome == 'success'
        continue-on-error: true
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: maestro-dev-apk-${{ github.event.pull_request.head.sha || github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: build/maestro-apk/
          compression-level: 0
          if-no-files-found: error
          retention-days: 7

      # Preserve failure diagnostics with a unique artifact name per job.
      - name: Upload reports
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: android-ci-reports-build-contracts-${{ matrix.phase }}
          path: |
            app/build/reports/
            app/build/test-results/
            app/build/outputs/roborazzi/
          if-no-files-found: ignore
          retention-days: 7

      # Keep task timings on successful runs too; wall-clock timeouts alone do
      # not show whether compilation, tests, or analysis is doing extra work.
      - name: Upload Gradle timing reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: android-ci-gradle-profiles-build-contracts-${{ matrix.phase }}
          path: build/reports/profile/
          if-no-files-found: ignore
          retention-days: 7

      - name: Verify dependency security resolution fixture
        if: matrix.phase == 'tooling'
        run: |
          python3 scripts/test_dependency_security_fixture.py
          python3 scripts/test_dependency_inputs_fixture.py

      # Explicit operator mode only: captured downloads remain unapproved candidates.
      # A capture does not bypass any normal build or aggregate outcome.
      - name: Capture dependency-control bootstrap candidates
        if: always() && matrix.phase == 'tooling' && github.event_name == 'workflow_dispatch' && (inputs.capture_dependency_inputs || inputs.capture_benchmark_dependency_inputs)
        run: |
          ./gradlew -I gradle/dependency-inputs-bootstrap.init.gradle \
            captureDependencyInputs -Pwhitenoise.previewE2eTestBuild=true \
