name: Android CI

# Required validation CI for the Android client. Runs the same checks a
# contributor should run locally before pushing (see README "Continuous
# Integration"). Dev debug variant only: no signing secrets, no
# google-services.json, so this never depends on release/Play/Zapstore
# credentials.
#
# Scope: compile + unit tests + ktlint + detekt + Android lint. APK build artifacts are a
# separate workflow (see issue #247).

on:
  pull_request:
    branches: [master]
  push:
    branches: [master]

# Cancel superseded runs on the same ref so a force-push or rapid re-push does
# not pile up redundant CI.
concurrency:
  group: android-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  offline-zsp:
    name: Verify real ZSP offline signer contract
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.24.11'
          cache: false
      - name: Install fixture APK tooling
        run: '"$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36" "build-tools;36.0.0"'
      - name: Rehearse with disposable keys and a loopback signer
        run: bash scripts/test-zsp-offline.sh
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: zsp-offline-contract
          path: build/reports/zsp-offline.json
          if-no-files-found: error
          retention-days: 14

  build-contracts:
    name: Build contracts (${{ matrix.phase }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        phase: [tooling, baseline]
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Test manual release guide validator
        if: matrix.phase == 'tooling'
        run: python3 -m unittest scripts/test_check_manual_test_guide.py

      - name: Validate manual release guide
        if: matrix.phase == 'tooling'
        env:
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          python3 scripts/check_manual_test_guide.py
          if [[ -n "$PR_BASE_SHA" ]]; then
            python3 scripts/check_manual_test_guide.py --base "$PR_BASE_SHA"
          fi

      - name: Test PR screenshot renderer
        if: matrix.phase == 'tooling'
        run: node --test .github/scripts/update-pr-screenshots.test.js .github/scripts/update-pr-preview-links.test.js

      - name: Test GitHub triage reconciliation
        if: matrix.phase == 'tooling'
        run: python3 -m unittest scripts/test_check_github_triage.py

      - name: Test stale-result recurrence classifier
        if: matrix.phase == 'tooling'
        run: python3 -m unittest scripts/test_stale_result_recurrence.py

      - name: Test package-replacement startup reporter
        if: matrix.phase == 'tooling'
        run: bash .github/scripts/test-package-replacement-startup-report.sh

      - name: Test PR preview publisher
        if: matrix.phase == 'tooling'
        run: bash .github/scripts/test-upload-pr-apk-to-blossom.sh

      - name: Test release and staging transport tooling
        if: matrix.phase == 'tooling'
        run: |
          ./scripts/release_test.sh
          .github/scripts/test-staging-apk-transport.sh

      - name: Test production release safety gates
        if: matrix.phase == 'tooling'
        run: python3 -m unittest scripts/test_release_pipeline.py

      - name: Verify Android release metadata and store assets
        if: matrix.phase == 'tooling'
        run: ./scripts/check-release-metadata.py

      - name: Test MarmotKit artifact preparation
        if: matrix.phase == 'tooling'
        run: ./scripts/test-prepare-marmotkit-artifact.sh

      - name: Verify generated performance profiles
        if: matrix.phase == 'tooling'
        run: |
          bash .github/scripts/test-verify-generated-profiles.sh
          bash scripts/verify-generated-profiles.sh

      - name: Test Android CI aggregate gate
        if: matrix.phase == 'tooling'
        run: python3 -m unittest scripts/test_android_ci_gate.py

      - name: Configure MarmotKit cache directory
        shell: bash
        run: printf 'WHITENOISE_MARMOTKIT_CACHE_DIR=%s\n' "$RUNNER_TEMP/marmotkit-cache" >> "$GITHUB_ENV"

      # AGP 9.x / Gradle 9.4.1 require JDK 17.
      - name: Set up JDK 17
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: '17'

      # Retain this job's task outputs instead of relying on the Play test cache.
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0
        with:
          cache-read-only: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository }}

      - name: Read MarmotKit artifact pin
        id: marmotkit
        shell: bash
        run: |
          sha="$(awk -F= '$1 == "artifact-sha256" { print $2 }' app/src/main/marmotkit/MARMOT_VERSION)"
          [[ "$sha" =~ ^[0-9a-f]{64}$ ]] || { echo "Invalid MarmotKit artifact SHA-256" >&2; exit 1; }
          printf 'sha=%s\n' "$sha" >> "$GITHUB_OUTPUT"

      - name: Restore MarmotKit artifact
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/marmotkit-cache
          key: marmotkit-${{ runner.os }}-${{ steps.marmotkit.outputs.sha }}

      - name: Prepare MarmotKit API signature
        if: matrix.phase == 'tooling'
        run: ./gradlew :app:stageMarmotKitApiSignature --build-cache --profile --no-daemon --stacktrace

      - name: Upload MarmotKit API signature
        if: matrix.phase == 'tooling'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: marmotkit-api-signature
          path: app/build/reports/marmotkit/marmotkit-api-signature.txt
          if-no-files-found: error
          retention-days: 14

      - name: Verify packaged system labels for every app variant
        if: matrix.phase == 'tooling'
        run: ./scripts/test-system-labels.sh

      - name: Verify production signing and bundle task isolation
        if: matrix.phase == 'tooling'
        run: python3 scripts/test-release-gradle.py

      - name: Compile (Kotlin)
        if: matrix.phase == 'tooling'
        run: ./gradlew :app:compileDevZapstoreDebugAndroidTestKotlin :benchmark:assembleDevZapstoreBenchmarkRelease --build-cache --profile --no-daemon --stacktrace

      # Package on a separate runner so release compilation overlaps tooling checks.
      - name: Assemble app for Baseline Profile verification
        if: matrix.phase == 'baseline'
        run: ./gradlew :app:assembleDevZapstoreBenchmarkRelease --build-cache --profile --no-daemon --stacktrace

      - name: Verify packaged Baseline Profile assets
        if: matrix.phase == 'baseline'
        shell: bash
        run: |
          set -euo pipefail
          metadata=app/build/outputs/apk/devZapstore/benchmarkRelease/output-metadata.json
          output_file=$(jq -er '
            select(
              .applicationId == "dev.ipf.whitenoise.android.dev" and
              .variantName == "devZapstoreBenchmarkRelease"
            )
            | [.elements[] | select((.filters // []) | length == 0)]
            | if length == 1 then .[0].outputFile else empty end
          ' "$metadata")
          app_apk="$(dirname "$metadata")/$output_file"
          bash scripts/verify-baseline-profile.sh "$app_apk"

      # Preserve failure diagnostics with a unique artifact name per job.
      - name: Upload reports
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: android-ci-reports-build-contracts-${{ matrix.phase }}
          path: |
            app/build/reports/
            app/build/test-results/
            app/build/outputs/roborazzi/
          if-no-files-found: ignore
          retention-days: 7

      # Keep task timings on successful runs too; wall-clock timeouts alone do
      # not show whether compilation, tests, or analysis is doing extra work.
      - name: Upload Gradle timing reports
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: android-ci-gradle-profiles-build-contracts-${{ matrix.phase }}
          path: build/reports/profile/
          if-no-files-found: ignore
          retention-days: 7

  compose-compiler:
    name: Compose compiler metrics and stability reports
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Configure MarmotKit cache directory
        shell: bash
        run: printf 'WHITENOISE_MARMOTKIT_CACHE_DIR=%s\n' "$RUNNER_TEMP/marmotkit-cache" >> "$GITHUB_ENV"

      - name: Set up JDK 17
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0
        with:
          cache-read-only: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository }}

      - name: Read MarmotKit artifact pin
        id: marmotkit
        shell: bash
        run: |
          sha="$(awk -F= '$1 == "artifact-sha256" { print $2 }' app/src/main/marmotkit/MARMOT_VERSION)"
          [[ "$sha" =~ ^[0-9a-f]{64}$ ]] || { echo "Invalid MarmotKit artifact SHA-256" >&2; exit 1; }
          printf 'sha=%s\n' "$sha" >> "$GITHUB_OUTPUT"

      - name: Restore MarmotKit artifact
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/marmotkit-cache
          key: marmotkit-${{ runner.os }}-${{ steps.marmotkit.outputs.sha }}

      # Release-mode Compose compiler output identifies unstable classes and
      # restartable/skippable composables using the same optimizations users
      # receive. Keep it opt-in locally; publish it on every CI build.
      # Compiler reports are not cached task outputs, so this compile must execute.
      - name: Compile Compose metrics and stability reports
        run: ./gradlew :app:compileStagingZapstoreReleaseKotlin -Pwhitenoise.enableComposeCompilerReports=true --no-build-cache --profile --no-daemon --stacktrace

      - name: Upload Compose compiler reports
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: compose-compiler-reports
          path: |
            app/build/compose-metrics/
            app/build/compose-reports/
          if-no-files-found: error
          retention-days: 14

      - name: Upload reports
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: android-ci-reports-compose-compiler
          path: app/build/reports/
          if-no-files-found: ignore
          retention-days: 7

      - name: Upload Gradle timing reports
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: android-ci-gradle-profiles-compose-compiler
          path: build/reports/profile/
          if-no-files-found: ignore
          retention-days: 7

  static-analysis:
    name: ktlint, detekt, and Android lint (${{ matrix.flavor }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      # Lint each distribution on its own runner. Play also owns the
      # flavor-independent Kotlin style and static-analysis checks.
      fail-fast: false
      matrix:
        flavor: [Zapstore, Play]
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Configure MarmotKit cache directory
        shell: bash
        run: printf 'WHITENOISE_MARMOTKIT_CACHE_DIR=%s\n' "$RUNNER_TEMP/marmotkit-cache" >> "$GITHUB_ENV"

      # AGP 9.x / Gradle 9.4.1 require JDK 17.
      - name: Set up JDK 17
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: '17'

      # Retain this job's task outputs instead of relying on the Play test cache.
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0
        with:
          cache-read-only: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository }}

      - name: Read MarmotKit artifact pin
        id: marmotkit
        shell: bash
        run: |
          sha="$(awk -F= '$1 == "artifact-sha256" { print $2 }' app/src/main/marmotkit/MARMOT_VERSION)"
          [[ "$sha" =~ ^[0-9a-f]{64}$ ]] || { echo "Invalid MarmotKit artifact SHA-256" >&2; exit 1; }
          printf 'sha=%s\n' "$sha" >> "$GITHUB_OUTPUT"

      - name: Restore MarmotKit artifact
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/marmotkit-cache
          key: marmotkit-${{ runner.os }}-${{ steps.marmotkit.outputs.sha }}

      - name: ktlint
        if: matrix.flavor == 'Play'
        run: ./gradlew :app:ktlintCheck :benchmark:ktlintCheck --build-cache --profile --daemon --stacktrace

      - name: detekt
        if: matrix.flavor == 'Play'
        run: ./gradlew :app:detekt --build-cache --profile --daemon --stacktrace

      - name: Android lint
        run: ./gradlew :app:lintDev${{ matrix.flavor }}Debug --build-cache --profile --daemon --stacktrace

      # Preserve failure diagnostics with a unique artifact name per job.
      - name: Upload reports
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: android-ci-reports-static-analysis-${{ matrix.flavor }}
          path: |
            app/build/reports/
            app/build/test-results/
            app/build/outputs/roborazzi/
          if-no-files-found: ignore
          retention-days: 7

      # Keep task timings on successful runs too; wall-clock timeouts alone do
      # not show whether compilation, tests, or analysis is doing extra work.
      - name: Upload Gradle timing reports
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: android-ci-gradle-profiles-static-analysis-${{ matrix.flavor }}
          path: build/reports/profile/
          if-no-files-found: ignore
          retention-days: 7

  screenshots:
    name: Curated screenshot verification (${{ matrix.flavor }})
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        flavor: [Zapstore, Play]
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Configure MarmotKit cache directory
        shell: bash
        run: printf 'WHITENOISE_MARMOTKIT_CACHE_DIR=%s\n' "$RUNNER_TEMP/marmotkit-cache" >> "$GITHUB_ENV"

      - name: Set up JDK 17
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0
        with:
          cache-read-only: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository }}

      - name: Read MarmotKit artifact pin
        id: marmotkit
        shell: bash
        run: |
          sha="$(awk -F= '$1 == "artifact-sha256" { print $2 }' app/src/main/marmotkit/MARMOT_VERSION)"
          [[ "$sha" =~ ^[0-9a-f]{64}$ ]] || { echo "Invalid MarmotKit artifact SHA-256" >&2; exit 1; }
          printf 'sha=%s\n' "$sha" >> "$GITHUB_OUTPUT"

      - name: Restore MarmotKit artifact
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/marmotkit-cache
          key: marmotkit-${{ runner.os }}-${{ steps.marmotkit.outputs.sha }}

      # Preserve the established baseline-owner allowlist. Other unit tests may
      # capture diagnostic images without owning a committed golden file.
      - name: Screenshot tests (Roborazzi)
        run: |
          ./gradlew \
            :app:verifyRoborazziDev${{ matrix.flavor }}Debug \
            --tests '*ScreenshotTest' \
            --tests '*ConversationImeCollapseFocusTest' \
            --tests '*NewGroupNameEmojiPickerTest' \
            --tests '*ChatActionSheetTest' \
            --tests '*ChatListPinnedBoundaryTest' \
            --tests '*ChatListTtsTransportLayoutTest' \
            --tests '*ChatListTopBarColdStartSelfProfileFirstFrameTest' \
            --tests '*ConversationTtsFollowComposeTest' \
            --tests '*BubbleCollapsibleFooterLayoutTest' \
            --tests '*MessageBubbleEditedMarkdownTest' \
            --tests '*GroupEditNameEmojiPickerTest' \
            --tests '*MainShellTtsReturnTransitionTest' \
            --tests '*ProfileAddToGroupsFlowTest' \
            --tests '*AutoDownloadBacklogControlTest' \
            --build-cache --profile --no-daemon \
            --stacktrace

      - name: Upload reports
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: android-ci-reports-screenshots-${{ matrix.flavor }}
          path: |
            app/build/reports/
            app/build/test-results/
            app/build/outputs/roborazzi/
          if-no-files-found: ignore
          retention-days: 7

      - name: Upload Gradle timing reports
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: android-ci-gradle-profiles-screenshots-${{ matrix.flavor }}
          path: build/reports/profile/
          if-no-files-found: ignore
          retention-days: 7

  tests:
    name: Unit tests and coverage (${{ matrix.flavor }})
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      ORG_GRADLE_PROJECT_ciTestForks: '2'
    strategy:
      # Keep both variants' diagnostics; two isolated 1 GiB workers per runner.
      fail-fast: false
      matrix:
        flavor: [Zapstore, Play]
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Configure MarmotKit cache directory
        shell: bash
        run: printf 'WHITENOISE_MARMOTKIT_CACHE_DIR=%s\n' "$RUNNER_TEMP/marmotkit-cache" >> "$GITHUB_ENV"

      # AGP 9.x / Gradle 9.4.1 require JDK 17.
      - name: Set up JDK 17
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: '17'

      # Retain both flavors' compilation outputs; fork PRs remain read-only.
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0
        with:
          cache-read-only: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository }}

      - name: Read MarmotKit artifact pin
        id: marmotkit
        shell: bash
        run: |
          sha="$(awk -F= '$1 == "artifact-sha256" { print $2 }' app/src/main/marmotkit/MARMOT_VERSION)"
          [[ "$sha" =~ ^[0-9a-f]{64}$ ]] || { echo "Invalid MarmotKit artifact SHA-256" >&2; exit 1; }
          printf 'sha=%s\n' "$sha" >> "$GITHUB_OUTPUT"

      - name: Restore MarmotKit artifact
        id: marmotkit-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/marmotkit-cache
          key: marmotkit-${{ runner.os }}-${{ steps.marmotkit.outputs.sha }}

      - name: Unit tests
        id: unit_tests
        run: ./gradlew :app:testDev${{ matrix.flavor }}DebugUnitTest --build-cache --profile --daemon --stacktrace

      # Coverage gate (phase 2): fail CI when overall line coverage drops below the
      # ratchet floor in app/build.gradle.kts. DevZapstoreDebug only — the aggregate
      # kover tasks pull in release variants, whose packaging trips the unsigned-release
      # guard (no signing in CI).
      - name: Coverage gate (Kover)
        if: matrix.flavor == 'Zapstore'
        run: ./gradlew :app:koverVerifyDevZapstoreDebug --build-cache --profile --daemon --stacktrace

      # Coverage visibility (phase 1): generate HTML/XML reports and publish them as
      # an artifact. Non-blocking so report upload still runs when the gate above fails.
      # Flavor-specific DevDebug variants only (see gate step).
      - name: Coverage report (Kover)
        if: ${{ !cancelled() && steps.unit_tests.outcome == 'success' }}
        continue-on-error: true
        run: ./gradlew :app:koverXmlReportDev${{ matrix.flavor }}Debug :app:koverHtmlReportDev${{ matrix.flavor }}Debug --build-cache --profile --daemon --stacktrace

      - name: Save MarmotKit artifact
        if: >-
          ${{ success() && matrix.flavor == 'Play' &&
              (github.event_name != 'pull_request' ||
               github.event.pull_request.head.repo.full_name == github.repository) &&
              steps.marmotkit-cache.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/marmotkit-cache
          key: marmotkit-${{ runner.os }}-${{ steps.marmotkit.outputs.sha }}

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: kover-coverage-report-${{ matrix.flavor }}
          path: |
            app/build/reports/kover/
          if-no-files-found: ignore
          retention-days: 7

      # Preserve failure diagnostics with a unique artifact name per job.
      - name: Upload reports
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: android-ci-reports-${{ matrix.flavor }}
          path: |
            app/build/reports/
            app/build/test-results/
            app/build/outputs/roborazzi/
          if-no-files-found: ignore
          retention-days: 7

      # Keep task timings on successful runs too; wall-clock timeouts alone do
      # not show whether compilation, tests, or analysis is doing extra work.
      - name: Upload Gradle timing reports
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: android-ci-gradle-profiles-${{ matrix.flavor }}
          path: build/reports/profile/
          if-no-files-found: ignore
          retention-days: 7

  # Preserve the existing check name for branch protection and consumers.
  # always() is essential: a failed/skipped dependency must produce a red gate,
  # rather than a skipped check that GitHub can treat as passing.
  validate:
    name: Compile, test, ktlint, detekt, Android lint
    needs: [offline-zsp, build-contracts, compose-compiler, static-analysis, screenshots, tests]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require every validation job to succeed
        env:
          JOB_RESULTS: ${{ toJSON(needs) }}
        shell: bash
        run: |
          set -euo pipefail
          printf '%s\n' "$JOB_RESULTS" | jq -r 'to_entries[] | "\(.key): \(.value.result)"'
          printf '%s\n' "$JOB_RESULTS" | jq -e '
            length > 0 and all(.[]; .result == "success")
          ' > /dev/null
