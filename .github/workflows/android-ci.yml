  # The unit suite runs in four shards per flavor. Each shard runs the test classes whose
  # top-level name hashes to its index (see ciTestShard in build.gradle.kts), so a shard
  # compiles once and runs about a quarter of the suite. The coverage job below merges
  # every shard's screenshot summary and Kover binary report.
  tests:
    needs: changes
    if: needs.changes.outputs.docs_only != 'true' && needs.changes.outputs.precheck != 'true'
    name: Unit tests and screenshots (${{ matrix.flavor }}, shard ${{ matrix.shard }})
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      # Two test forks leave room for Gradle on 16 GiB hosted runners.
      ORG_GRADLE_PROJECT_ciTestForks: '2'
      ORG_GRADLE_PROJECT_ciTestShard: ${{ matrix.shard }}
      ORG_GRADLE_PROJECT_ciTestShardCount: '4'
    strategy:
      # Keep every shard's diagnostics.
      # PRs test Zapstore only; secondary-variant runs Play's flavor-sensitive tests.
      fail-fast: false
      matrix:
        flavor: ${{ fromJSON(github.event_name == 'pull_request' && needs.changes.outputs.full_matrix != 'true' && '["Zapstore"]' || '["Zapstore", "Play"]') }}
        shard: [0, 1, 2, 3]
    steps:
      # Include checkout/setup time; never reset this budget when tests start.
      - name: Reserve unit-test diagnostics and upload time
        shell: bash
        run: |
          python3 -c 'import time; print("UNIT_TEST_DEADLINE_MONOTONIC=" + str(time.monotonic() + 32 * 60))' >> "$GITHUB_ENV"

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          ref: ${{ github.sha }}

