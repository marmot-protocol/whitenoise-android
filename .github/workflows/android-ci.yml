      - name: Pack Kover class directories
        if: ${{ !cancelled() && matrix.flavor == 'Zapstore' && matrix.shard == 0 && steps.unit_tests.outcome == 'success' }}
        run: python3 scripts/kover_class_outputs.py pack app/build/kover/devZapstoreDebug.artifact build/kover-classes.tar

      - name: Upload Kover class directories
        if: ${{ !cancelled() && matrix.flavor == 'Zapstore' && matrix.shard == 0 && steps.unit_tests.outcome == 'success' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: kover-classes-Zapstore
          path: build/kover-classes.tar
