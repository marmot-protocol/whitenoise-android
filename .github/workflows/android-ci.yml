name: Android CI

# Required validation CI for the Android client. Runs the same checks a
# contributor should run locally before pushing (see README "Continuous
# Integration"). Dev debug variant only: no signing secrets, no
# google-services.json, so this never depends on release/Play/Zapstore
# credentials.
#
# Scope: compile + unit tests + ktlint + detekt + Android lint. APK build artifacts are a
# separate workflow (see issue #247).

on:
  pull_request:
    branches: [master]
  push:
    branches: [master]

# Cancel superseded runs on the same ref so a force-push or rapid re-push does
# not pile up redundant CI.
concurrency:
  group: android-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  validate:
    name: Compile, test, ktlint, detekt, Android lint
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Test PR screenshot renderer
        run: node --test .github/scripts/update-pr-screenshots.test.js

      - name: Verify generated performance profiles
        run: |
          bash .github/scripts/test-verify-generated-profiles.sh
          bash scripts/verify-generated-profiles.sh

      # AGP 9.x / Gradle 9.4.1 require JDK 17.
      - name: Set up JDK 17
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '17'

      # Configures the Gradle wrapper and caches dependencies + build state
      # across runs (read/write on master pushes, read-only on PRs).
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0

      - name: Compile (Kotlin)
        run: ./gradlew :app:compileDevZapstoreDebugKotlin :app:compileDevPlayDebugKotlin :app:compileDevZapstoreDebugAndroidTestKotlin :benchmark:assembleDevZapstoreBenchmarkRelease --no-daemon --stacktrace

      # Release-mode Compose compiler output identifies unstable classes and
      # restartable/skippable composables using the same optimizations users
      # receive. Keep it opt-in locally; publish it on every CI build.
      - name: Compose compiler metrics and stability reports
        run: ./gradlew :app:compileStagingZapstoreReleaseKotlin -Pwhitenoise.enableComposeCompilerReports=true --no-daemon --stacktrace

      - name: Upload Compose compiler reports
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: compose-compiler-reports
          path: |
            app/build/compose-metrics/
            app/build/compose-reports/
          if-no-files-found: error
          retention-days: 14

      - name: Unit tests
        run: ./gradlew :app:testDevZapstoreDebugUnitTest :app:testDevPlayDebugUnitTest --no-daemon --stacktrace

      # Roborazzi Compose screenshot pilot (issue #551). Verifies the committed
      # baselines under app/src/test/snapshots/ against freshly rendered output
      # so visual regressions (e.g. the AMOLED true-black class, #446/#495) fail
      # the build instead of shipping. Runs on the JVM via Robolectric — no
      # emulator, so it adds no device-test runtime. Re-baseline after an
      # intentional UI change with `./gradlew :app:recordRoborazziDevZapstoreDebug`
      # or `:app:recordRoborazziDevPlayDebug` (see README "Screenshot tests").
      - name: Screenshot tests (Roborazzi)
        run: ./gradlew :app:verifyRoborazziDevZapstoreDebug :app:verifyRoborazziDevPlayDebug --no-daemon --stacktrace

      - name: ktlint
        run: ./gradlew :app:ktlintCheck :benchmark:ktlintCheck --no-daemon --stacktrace

      - name: detekt
        run: ./gradlew :app:detekt --no-daemon --stacktrace

      - name: Android lint
        run: ./gradlew :app:lintDevZapstoreDebug :app:lintDevPlayDebug --no-daemon --stacktrace

      # Coverage gate (phase 2): fail CI when overall line coverage drops below the
      # ratchet floor in app/build.gradle.kts. DevZapstoreDebug only — the aggregate
      # kover tasks pull in release variants, whose packaging trips the unsigned-release
      # guard (no signing in CI).
      - name: Coverage gate (Kover)
        run: ./gradlew :app:koverVerifyDevZapstoreDebug --no-daemon --stacktrace

      # Coverage visibility (phase 1): generate HTML/XML reports and publish them as
      # an artifact. Non-blocking so report upload still runs when the gate above fails.
      # Flavor-specific DevDebug variants only (see gate step).
      - name: Coverage report (Kover)
        if: always()
        continue-on-error: true
        run: ./gradlew :app:koverXmlReportDevZapstoreDebug :app:koverHtmlReportDevZapstoreDebug :app:koverXmlReportDevPlayDebug :app:koverHtmlReportDevPlayDebug --no-daemon --stacktrace

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: kover-coverage-report
          path: |
            app/build/reports/kover/
          if-no-files-found: ignore
          retention-days: 7

      # Surface failure details (unit-test HTML/XML, lint reports, and Roborazzi
      # screenshot diff/compare/actual images) on red runs. The roborazzi output
      # dir holds *_compare.png / *_actual.png for any screenshot that diverged
      # from its committed baseline, so a UI regression is inspectable from the
      # workflow artifacts without re-running locally.
      - name: Upload reports
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: android-ci-reports
          path: |
            app/build/reports/
            app/build/test-results/
            app/build/outputs/roborazzi/
          if-no-files-found: ignore
          retention-days: 7
