name: Android CI

# Required validation CI for the Android client. Runs the same checks a
# contributor must require on GitHub (see README "Continuous
# Integration" and docs/ci-request-policy.md). Dev debug variant only: no signing secrets, no
# google-services.json, so this never depends on release/Play/Zapstore
# credentials.
#
# Scope: compile + unit tests + ktlint + detekt + Android lint. APK build artifacts are a
# separate workflow (see issue #247).

on:
  pull_request:
    branches: [master]
  merge_group:
    types: [checks_requested]
  push:
    branches: [master]
  schedule:
    - cron: '43 2 * * *'
  workflow_dispatch:

# Superseded PR runs retain normal cancellation. Queue integrations use their
# immutable SHA so a later queue revision cannot cancel a valid integration run.
concurrency:
  group: android-ci-${{ github.workflow }}-${{ github.event_name }}-${{ github.event_name == 'merge_group' && github.sha || github.ref }}
  cancel-in-progress: ${{ github.event_name != 'merge_group' }}

permissions:
  contents: read

jobs:
  changes:
    name: Classify complete PR changes
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      docs_only: ${{ steps.classify.outputs.docs_only }}
      supplemental_campaigns: ${{ steps.classify.outputs.supplemental_campaigns }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ github.sha }}

      - name: Test conservative CI classification
        run: python3 -m unittest scripts/test_check_ci_changes.py

      - name: Classify complete PR diff
        id: classify
        env:
          CI_EVENT: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.merge_group.base_sha || github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event.merge_group.head_sha || github.event.pull_request.head.sha || github.sha }}
        run: python3 scripts/check_ci_changes.py --event "$CI_EVENT" --base "$BASE_SHA" --head "$HEAD_SHA"

  tooling-contracts:
    name: Validate tooling and documentation contracts
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ github.sha }}

      - name: Test manual release guide and viewport coverage validators
        run: python3 -m unittest scripts/test_check_manual_test_guide.py scripts/test_manual_test_fragments.py scripts/test_check_viewport_restoration_coverage.py

      # This must run outside the path-filtered fuzz workflow: missing a parser
      # trigger would otherwise also skip the check intended to catch it.
      - name: Validate fuzz PR production triggers
        run: |
          python3 scripts/check_fuzz_pr_triggers.py
          python3 -m unittest scripts/test_check_fuzz_pr_triggers.py scripts/test_check_queue_fuzz_scope.py scripts/test_whitenoise_android_serial_queue.py

      - name: Validate Actions merge authorization boundary
        run: |
          python3 -m venv "$RUNNER_TEMP/ci-permissions"
          "$RUNNER_TEMP/ci-permissions/bin/pip" install --disable-pip-version-check PyYAML==6.0.3
          "$RUNNER_TEMP/ci-permissions/bin/python" scripts/check_merge_authorization_boundary.py
          "$RUNNER_TEMP/ci-permissions/bin/python" -m unittest scripts/test_merge_authorization_boundary.py

      - name: Test attachment fixture HTTP ledger and cancellation contracts
        run: python3 -m unittest discover -s tools/attachment-fixture -p 'test_*.py'

      - name: Test Maestro artifact and manual-only execution contracts
        run: python3 -m unittest scripts/test_maestro_apk.py

      - name: Validate manual release guide
        env:
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          python3 scripts/check_manual_test_guide.py
          if [[ -n "$PR_BASE_SHA" ]]; then
            python3 scripts/check_manual_test_guide.py --base "$PR_BASE_SHA"
          fi

      - name: Assemble the source-bound manual testing guide
        env:
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          python3 scripts/check_manual_test_guide.py --output-dir build/manual-release-testing
          git rev-parse HEAD > build/manual-release-testing/source-revision.txt
          printf 'pr_head=%s\npr_base=%s\n' "$PR_HEAD_SHA" "$PR_BASE_SHA" >> build/manual-release-testing/source-revision.txt

      - name: Retain the assembled manual testing guide
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: manual-release-testing-${{ github.sha }}
          path: build/manual-release-testing/
          if-no-files-found: error
          retention-days: 30

      - name: Test PR screenshot renderer
        run: node --test .github/scripts/update-pr-screenshots.test.js .github/scripts/update-pr-preview-links.test.js

      - name: Test GitHub triage reconciliation
        run: python3 -m unittest scripts/test_check_github_triage.py

      - name: Test stale-result recurrence classifier
        run: python3 -m unittest scripts/test_stale_result_recurrence.py

      - name: Test package-replacement startup reporter
        run: bash .github/scripts/test-package-replacement-startup-report.sh

      - name: Test background delivery measurement acceptance
        run: python3 -m unittest scripts.test_background_delivery_report scripts.test_background_fixture_artifacts scripts.test_background_fixture_state

      - name: Test preview security and update contracts
        run: |
          bash .github/scripts/test-pr-preview-contract.sh
          bash .github/scripts/test-pr-preview-validation.sh

      - name: Test PR preview publisher
        run: bash .github/scripts/test-publish-pr-apk-to-github-release.sh

      - name: Test release and staging transport tooling
        run: |
          ./scripts/release_test.sh
          .github/scripts/test-staging-apk-transport.sh

      - name: Test production release safety gates
        run: python3 -m unittest scripts/test_release_pipeline.py

      - name: Verify Android release metadata and store assets
        run: ./scripts/check-release-metadata.py

      - name: Test MarmotKit artifact preparation
        run: ./scripts/test-prepare-marmotkit-artifact.sh

      - name: Verify generated performance profiles
        run: |
          bash .github/scripts/test-verify-generated-profiles.sh
          bash scripts/verify-generated-profiles.sh

      - name: Test Android CI aggregate gate
        run: python3 -m unittest scripts/test_android_ci_gate.py scripts/test_verify_compose_backport_control.py

      - name: Check committed screenshot golden owners
        run: |
          python3 -m unittest scripts/test_check_screenshot_baseline_owners.py
          python3 scripts/check_screenshot_baseline_owners.py

      - name: Test instrumented dispatch and required cases
        run: |
          python3 -m unittest scripts/test_run_android_instrumented_dispatch.py
          python3 -m unittest scripts/test_check_instrumented_required_cases.py

  offline-zsp:
    needs: changes
    if: needs.changes.outputs.docs_only != 'true'
    name: Verify real ZSP offline signer contract
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          ref: ${{ github.sha }}
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.24.11'
          cache: false
      - name: Install fixture APK tooling
        run: '"$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36" "build-tools;36.0.0"'
      - name: Rehearse with disposable keys and a loopback signer
        run: bash scripts/test-zsp-offline.sh
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: zsp-offline-contract
          path: build/reports/zsp-offline.json
          if-no-files-found: error
          retention-days: 14

  build-contracts:
    needs: changes
    if: needs.changes.outputs.docs_only != 'true'
    name: Build contracts (${{ matrix.phase }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        phase: [tooling, baseline]
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Configure MarmotKit cache directory
        shell: bash
        run: printf 'WHITENOISE_MARMOTKIT_CACHE_DIR=%s\n' "$RUNNER_TEMP/marmotkit-cache" >> "$GITHUB_ENV"

      # AGP 9.x / Gradle 9.4.1 require JDK 17.
      - name: Set up JDK 17
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: '17'

      # Retain this job's task outputs instead of relying on the Play test cache.
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
        with:
          cache-read-only: ${{ github.event_name == 'merge_group' || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository) }}

      - name: Read MarmotKit artifact pin
        id: marmotkit
        shell: bash
        run: |
          sha="$(awk -F= '$1 == "artifact-sha256" { print $2 }' app/src/main/marmotkit/MARMOT_VERSION)"
          [[ "$sha" =~ ^[0-9a-f]{64}$ ]] || { echo "Invalid MarmotKit artifact SHA-256" >&2; exit 1; }
          printf 'sha=%s\n' "$sha" >> "$GITHUB_OUTPUT"

      - name: Restore MarmotKit artifact
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/marmotkit-cache
          key: marmotkit-${{ runner.os }}-${{ steps.marmotkit.outputs.sha }}

      - name: Prepare MarmotKit API signature
        if: matrix.phase == 'tooling'
        run: ./gradlew :app:stageMarmotKitApiSignature --build-cache --profile --daemon --stacktrace

      - name: Upload MarmotKit API signature
        if: matrix.phase == 'tooling'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: marmotkit-api-signature
          path: app/build/reports/marmotkit/marmotkit-api-signature.txt
          if-no-files-found: error
          retention-days: 14

      - name: Verify packaged system labels for every app variant
        if: matrix.phase == 'tooling'
        run: |
          ./scripts/test-system-labels.sh
          # This runner owns the lightweight daemon; free its heap before isolated builds.
          ./gradlew --stop

      - name: Verify production signing and bundle task isolation
        if: matrix.phase == 'tooling'
        run: python3 scripts/test-release-gradle.py

      - name: Compile (Kotlin)
        if: matrix.phase == 'tooling'
        run: |
          ./gradlew -p buildSrc test --build-cache --profile --no-daemon --stacktrace
          ./gradlew :app:compileDevZapstoreDebugAndroidTestKotlin :benchmark:assembleDevZapstoreBenchmarkRelease --build-cache --profile --no-daemon --stacktrace

      - name: ktlint and detekt
        if: matrix.phase == 'tooling'
        run: ./gradlew :app:ktlintCheck :benchmark:ktlintCheck :app:detekt --build-cache --profile --no-daemon --stacktrace

      # Package on a separate runner so release compilation overlaps tooling checks.
      - name: Assemble app for Baseline Profile verification
        if: matrix.phase == 'baseline'
        run: ./gradlew :app:assembleDevZapstoreBenchmarkRelease --build-cache --profile --no-daemon --stacktrace

      - name: Verify packaged Baseline Profile assets
        id: baseline_apk
        if: matrix.phase == 'baseline'
        shell: bash
        run: |
          set -euo pipefail
          metadata=app/build/outputs/apk/devZapstore/benchmarkRelease/output-metadata.json
          output_file=$(jq -er '
            select(
              .applicationId == "dev.ipf.whitenoise.android.dev" and
              .variantName == "devZapstoreBenchmarkRelease"
            )
            | [.elements[] | select((.filters // []) | length == 0)]
            | if length == 1 then .[0].outputFile else empty end
          ' "$metadata")
          app_apk="$(dirname "$metadata")/$output_file"
          bash scripts/verify-baseline-profile.sh "$app_apk"
          printf 'apk=%s\n' "$app_apk" >> "$GITHUB_OUTPUT"

      - name: Stage the existing APK for optional Maestro testing
        id: maestro_stage
        if: matrix.phase == 'baseline' && (github.event_name == 'push' || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository))
        continue-on-error: true
        env:
          APK_SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          APP_APK: ${{ steps.baseline_apk.outputs.apk }}
        run: python3 scripts/maestro_apk.py stage --apk "$APP_APK" --destination build/maestro-apk

      - name: Retain the existing APK for optional Maestro testing
        if: steps.maestro_stage.outcome == 'success'
        continue-on-error: true
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: maestro-dev-apk-${{ github.event.pull_request.head.sha || github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: build/maestro-apk/
          compression-level: 0
          if-no-files-found: error
          retention-days: 7

      - name: Verify unpatched Compose regression control
        if: matrix.phase == 'baseline' && (github.event_name == 'pull_request' || github.event_name == 'merge_group')
        env:
          BASE_SHA: ${{ github.event.merge_group.base_sha || github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.merge_group.head_sha || github.event.pull_request.head.sha }}
        run: python3 scripts/verify_compose_backport_control.py --base "$BASE_SHA" --head "$HEAD_SHA"

      - name: Upload Compose backport verification
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: compose-backport-verification-${{ matrix.phase }}
          path: |
            build/reports/compose-backport-control/
            buildSrc/build/test-results/
          if-no-files-found: ignore
          retention-days: 14

      # Preserve failure diagnostics with a unique artifact name per job.
      - name: Upload reports
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: android-ci-reports-build-contracts-${{ matrix.phase }}
          path: |
            app/build/reports/
            app/build/test-results/
            app/build/outputs/roborazzi/
          if-no-files-found: ignore
          retention-days: 7

      # Keep task timings on successful runs too; wall-clock timeouts alone do
      # not show whether compilation, tests, or analysis is doing extra work.
      - name: Upload Gradle timing reports
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: android-ci-gradle-profiles-build-contracts-${{ matrix.phase }}
          path: build/reports/profile/
          if-no-files-found: ignore
          retention-days: 7

  compose-compiler:
    needs: changes
    if: needs.changes.outputs.docs_only != 'true' && needs.changes.outputs.supplemental_campaigns != 'false'
    name: Compose compiler metrics and stability reports
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          ref: ${{ github.sha }}

      - name: Configure MarmotKit cache directory
        shell: bash
        run: printf 'WHITENOISE_MARMOTKIT_CACHE_DIR=%s\n' "$RUNNER_TEMP/marmotkit-cache" >> "$GITHUB_ENV"

      - name: Set up JDK 17
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
        with:
          cache-read-only: ${{ github.event_name == 'merge_group' || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository) }}

      - name: Read MarmotKit artifact pin
        id: marmotkit
        shell: bash
        run: |
          sha="$(awk -F= '$1 == "artifact-sha256" { print $2 }' app/src/main/marmotkit/MARMOT_VERSION)"
          [[ "$sha" =~ ^[0-9a-f]{64}$ ]] || { echo "Invalid MarmotKit artifact SHA-256" >&2; exit 1; }
          printf 'sha=%s\n' "$sha" >> "$GITHUB_OUTPUT"

      - name: Restore MarmotKit artifact
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/marmotkit-cache
          key: marmotkit-${{ runner.os }}-${{ steps.marmotkit.outputs.sha }}

      # Release-mode Compose compiler output identifies unstable classes and
      # restartable/skippable composables using the same optimizations users
      # receive. Keep it opt-in locally; publish it on full campaign runs.
      # Compiler reports are not cached task outputs, so this compile must execute.
      - name: Compile Compose metrics and stability reports
        run: ./gradlew :app:compileStagingZapstoreReleaseKotlin -Pwhitenoise.enableComposeCompilerReports=true --no-build-cache --profile --no-daemon --stacktrace

      - name: Upload Compose compiler reports
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: compose-compiler-reports
          path: |
            app/build/compose-metrics/
            app/build/compose-reports/
          if-no-files-found: error
          retention-days: 14

      - name: Upload reports
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: android-ci-reports-compose-compiler
          path: app/build/reports/
          if-no-files-found: ignore
          retention-days: 7

      - name: Upload Gradle timing reports
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: android-ci-gradle-profiles-compose-compiler
          path: build/reports/profile/
          if-no-files-found: ignore
          retention-days: 7

  static-analysis:
    needs: changes
    if: needs.changes.outputs.docs_only != 'true'
    name: Android lint (${{ matrix.flavor }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      # Lint each distribution while build-contracts runs the shared style checks.
      fail-fast: false
      matrix:
        flavor: [Zapstore, Play]
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          ref: ${{ github.sha }}

      - name: Configure MarmotKit cache directory
        shell: bash
        run: printf 'WHITENOISE_MARMOTKIT_CACHE_DIR=%s\n' "$RUNNER_TEMP/marmotkit-cache" >> "$GITHUB_ENV"

      # AGP 9.x / Gradle 9.4.1 require JDK 17.
      - name: Set up JDK 17
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: '17'

      # Retain this job's task outputs instead of relying on the Play test cache.
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
        with:
          cache-read-only: ${{ github.event_name == 'merge_group' || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository) }}

      - name: Read MarmotKit artifact pin
        id: marmotkit
        shell: bash
        run: |
          sha="$(awk -F= '$1 == "artifact-sha256" { print $2 }' app/src/main/marmotkit/MARMOT_VERSION)"
          [[ "$sha" =~ ^[0-9a-f]{64}$ ]] || { echo "Invalid MarmotKit artifact SHA-256" >&2; exit 1; }
          printf 'sha=%s\n' "$sha" >> "$GITHUB_OUTPUT"

      - name: Restore MarmotKit artifact
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/marmotkit-cache
          key: marmotkit-${{ runner.os }}-${{ steps.marmotkit.outputs.sha }}

      - name: Android lint
        run: ./gradlew :app:lintDev${{ matrix.flavor }}Debug --build-cache --profile --no-daemon --stacktrace

      # Preserve failure diagnostics with a unique artifact name per job.
      - name: Upload reports
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: android-ci-reports-static-analysis-${{ matrix.flavor }}
          path: |
            app/build/reports/
            app/build/test-results/
            app/build/outputs/roborazzi/
          if-no-files-found: ignore
          retention-days: 7

      # Keep task timings on successful runs too; wall-clock timeouts alone do
      # not show whether compilation, tests, or analysis is doing extra work.
      - name: Upload Gradle timing reports
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: android-ci-gradle-profiles-static-analysis-${{ matrix.flavor }}
          path: build/reports/profile/
          if-no-files-found: ignore
          retention-days: 7

  tests:
    needs: changes
    if: needs.changes.outputs.docs_only != 'true'
    name: Unit tests, screenshots and coverage (${{ matrix.flavor }})
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      ORG_GRADLE_PROJECT_ciTestForks: '3'
    strategy:
      # Keep both variants' diagnostics; two isolated 1 GiB workers per runner.
      fail-fast: false
      matrix:
        flavor: [Zapstore, Play]
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          ref: ${{ github.sha }}

      - name: Configure MarmotKit cache directory
        shell: bash
        run: printf 'WHITENOISE_MARMOTKIT_CACHE_DIR=%s\n' "$RUNNER_TEMP/marmotkit-cache" >> "$GITHUB_ENV"

      # AGP 9.x / Gradle 9.4.1 require JDK 17.
      - name: Set up JDK 17
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: '17'

      # Retain both flavors' compilation outputs; fork PRs remain read-only.
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
        with:
          cache-read-only: ${{ github.event_name == 'merge_group' || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository) }}

      - name: Read MarmotKit artifact pin
        id: marmotkit
        shell: bash
        run: |
          sha="$(awk -F= '$1 == "artifact-sha256" { print $2 }' app/src/main/marmotkit/MARMOT_VERSION)"
          [[ "$sha" =~ ^[0-9a-f]{64}$ ]] || { echo "Invalid MarmotKit artifact SHA-256" >&2; exit 1; }
          printf 'sha=%s\n' "$sha" >> "$GITHUB_OUTPUT"

      - name: Restore MarmotKit artifact
        id: marmotkit-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/marmotkit-cache
          key: marmotkit-${{ runner.os }}-${{ steps.marmotkit.outputs.sha }}

      - name: Unit tests
        id: unit_tests
        run: ./gradlew :app:testDev${{ matrix.flavor }}DebugUnitTest -Proborazzi.test.verify=true --build-cache --profile --daemon --stacktrace

      - name: Require every committed screenshot golden to be compared
        run: >-
          python3 scripts/check_screenshot_baseline_owners.py
          --results app/build/test-results/roborazzi/dev${{ matrix.flavor }}Debug/results-summary.json

      # Coverage gate (phase 2): fail CI when overall line coverage drops below the
      # ratchet floor in app/build.gradle.kts. DevZapstoreDebug only — the aggregate
      # kover tasks pull in release variants, whose packaging trips the unsigned-release
      # guard (no signing in CI).
      - name: Coverage gate (Kover)
        if: matrix.flavor == 'Zapstore'
        run: ./gradlew :app:koverVerifyDevZapstoreDebug -Proborazzi.test.verify=true --build-cache --profile --daemon --stacktrace

      # Coverage visibility (phase 1): generate HTML/XML reports and publish them as
      # an artifact. Continue to uploads on report errors; Zapstore still requires
      # a successful report in the teardown coverage floor below.
      # Flavor-specific DevDebug variants only (see gate step).
      - name: Coverage report (Kover)
        id: coverage_report
        if: ${{ !cancelled() && steps.unit_tests.outcome == 'success' }}
        continue-on-error: true
        run: ./gradlew :app:koverXmlReportDev${{ matrix.flavor }}Debug :app:koverHtmlReportDev${{ matrix.flavor }}Debug -Proborazzi.test.verify=true --build-cache --profile --daemon --stacktrace

      # Reuse the report from the full suite; no extra Gradle invocation or tests.
      # Runtime listener: 16/17 lines (94.1176%), zero eligible branches.
      # Viewport family: 82/82 lines, 52/56 branches; preserve 100%/90% floors.
      - name: Runtime listener and viewport restoration coverage floors
        if: ${{ !cancelled() && matrix.flavor == 'Zapstore' && steps.unit_tests.outcome == 'success' }}
        env:
          COVERAGE_REPORT_OUTCOME: ${{ steps.coverage_report.outcome }}
        run: |
          test "$COVERAGE_REPORT_OUTCOME" = success
          python3 scripts/check_runtime_listener_coverage.py app/build/reports/kover/reportDevZapstoreDebug.xml
          python3 scripts/check_viewport_restoration_coverage.py app/build/reports/kover/reportDevZapstoreDebug.xml

      - name: Save MarmotKit artifact
        if: >-
          ${{ success() && matrix.flavor == 'Play' &&
              github.event_name != 'merge_group' &&
              (github.event_name != 'pull_request' ||
               github.event.pull_request.head.repo.full_name == github.repository) &&
              steps.marmotkit-cache.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/marmotkit-cache
          key: marmotkit-${{ runner.os }}-${{ steps.marmotkit.outputs.sha }}

      - name: Upload full-suite golden comparison evidence
        if: ${{ !cancelled() && steps.unit_tests.outcome == 'success' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: android-ci-golden-results-${{ matrix.flavor }}
          path: app/build/test-results/roborazzi/dev${{ matrix.flavor }}Debug/results-summary.json
          if-no-files-found: error
          retention-days: 7

      - name: Upload Compose regression results
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: compose-backport-regressions-${{ matrix.flavor }}
          path: |
            app/build/test-results/testDev${{ matrix.flavor }}DebugUnitTest/TEST-dev.ipf.whitenoise.android.ui.conversation.messages.ComposeRectListBackportTest.xml
            app/build/test-results/testDev${{ matrix.flavor }}DebugUnitTest/TEST-dev.ipf.whitenoise.android.ui.conversation.messages.BubbleFooterRectListReuseTest.xml
          if-no-files-found: ignore
          retention-days: 14

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: kover-coverage-report-${{ matrix.flavor }}
          path: |
            app/build/reports/kover/
          if-no-files-found: ignore
          retention-days: 7

      # Preserve failure diagnostics with a unique artifact name per job.
      - name: Upload reports
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: android-ci-reports-${{ matrix.flavor }}
          path: |
            app/build/reports/
            app/build/test-results/
            app/build/outputs/roborazzi/
          if-no-files-found: ignore
          retention-days: 7

      # Keep task timings on successful runs too; wall-clock timeouts alone do
      # not show whether compilation, tests, or analysis is doing extra work.
      - name: Upload Gradle timing reports
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: android-ci-gradle-profiles-${{ matrix.flavor }}
          path: build/reports/profile/
          if-no-files-found: ignore
          retention-days: 7

  # Preserve the existing check name for branch protection and consumers.
  # A successful docs-only classifier permits only the named Android skips.
  # Missing outputs, unexpected skips, failures and cancellations remain red.
  validate:
    name: Compile, test, ktlint, detekt, Android lint
    needs: [changes, tooling-contracts, offline-zsp, build-contracts, compose-compiler, static-analysis, tests]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require every validation job to succeed
        env:
          JOB_RESULTS: ${{ toJSON(needs) }}
          CI_EVENT: ${{ github.event_name }}
        shell: bash
        run: |
          set -euo pipefail
          printf '%s\n' "$JOB_RESULTS" | jq -r 'to_entries[] | "\(.key): \(.value.result)"'
          printf '%s\n' "$JOB_RESULTS" | jq -e --arg event "$CI_EVENT" '
            (keys == ["build-contracts", "changes", "compose-compiler", "offline-zsp", "static-analysis", "tests", "tooling-contracts"]) and
            (.changes.result == "success") and
            (."tooling-contracts".result == "success") and
            (.changes.outputs.docs_only == "true" or .changes.outputs.docs_only == "false") and
            (.changes.outputs.supplemental_campaigns == "true" or .changes.outputs.supplemental_campaigns == "false") and
            (.changes.outputs.supplemental_campaigns as $campaigns | if .changes.outputs.docs_only == "true" then
              ($event == "pull_request" or $event == "merge_group") and .changes.outputs.supplemental_campaigns == "false" and all(to_entries[];
                if .key == "changes" or .key == "tooling-contracts" then .value.result == "success"
                else .value.result == "skipped" end)
            else all(to_entries[];
              if .key == "compose-compiler" and $campaigns == "false" then .value.result == "skipped"
              else .value.result == "success" end) end)
          ' > /dev/null
