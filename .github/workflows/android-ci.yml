        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: android-ci-golden-results-${{ matrix.flavor }}-${{ matrix.shard }}
          path: app/build/test-results/roborazzi/dev${{ matrix.flavor }}Debug/results-summary.json
          if-no-files-found: ignore
          retention-days: 7

      - name: Upload shard coverage data
