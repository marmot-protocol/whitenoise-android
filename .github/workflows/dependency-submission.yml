name: Gradle dependency submission

on:
  push:
    branches: [master]

concurrency:
  group: dependency-submission-${{ github.ref }}
  cancel-in-progress: true

# GitHub's dependency submission API represents graph updates as repository
# contents writes. No other workflow receives this permission.
permissions:
  contents: write

jobs:
  submit:
    name: Submit resolved Gradle dependencies
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up JDK 17
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '17'

      - name: Generate and submit dependency graph
        env:
          DEPENDENCY_GRAPH_PLUGIN_VERSION: '1.5.0'
        uses: gradle/actions/dependency-submission@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
        with:
          dependency-graph: generate-and-submit
          additional-arguments: --dependency-verification strict -Dorg.gradle.dependency.verification=strict --no-configuration-cache --stacktrace

      # Export only configurations already resolved by this job; no new compile or matrix.
      - name: Verify selected dependency security floors
        if: success()
        run: python3 scripts/verify_dependency_security.py build/reports/dependency-security

      - name: Export observed dependency inventory
        if: success()
        continue-on-error: true
        run: python3 scripts/verify_dependency_security.py build/reports/dependency-security --inventory build/reports/dependency-security/inventory/selected.json

      - name: Retain selected dependency security evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: dependency-security-${{ github.job }}
          path: build/reports/dependency-security
          if-no-files-found: ignore
          retention-days: 14
