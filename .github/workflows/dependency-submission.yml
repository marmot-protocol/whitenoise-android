name: Gradle dependency submission

on:
  push:
    branches: [master]

concurrency:
  group: dependency-submission-${{ github.ref }}
  cancel-in-progress: true

# GitHub's dependency submission API represents graph updates as repository
# contents writes. No other workflow receives this permission.
permissions:
  contents: write

jobs:
  submit:
    name: Submit resolved Gradle dependencies
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up JDK 17
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: '17'

      - name: Generate and submit dependency graph
        uses: gradle/actions/dependency-submission@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0
        with:
          dependency-graph: generate-and-submit
          additional-arguments: --no-configuration-cache --stacktrace
