name: Android Staging APK
on: workflow_dispatch
permissions:
  contents: read
env:
  BATTERY_SOURCE_SHA: 2f1d7f5425ffb022e4f9de53175153962e572302
  BATTERY_FIXTURE_PACKAGE: dev.ipf.whitenoise.android.batterycalibration
jobs:
  isolated-battery-fixture:
    name: Build isolated master battery fixture
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: 2f1d7f5425ffb022e4f9de53175153962e572302
          persist-credentials: false
      - uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c
        with:
          cache-read-only: true
      - name: Build the pinned master code under a separate application ID
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$BATTERY_SOURCE_SHA"
          cat > "$RUNNER_TEMP/battery-fixture.init.gradle" <<'GRADLE'
          gradle.beforeProject { project ->
              if (project.path == ':app') {
                  project.plugins.withId('com.android.application') {
                      project.androidComponents.finalizeDsl { android ->
                          def flavor = android.productFlavors.getByName('dev')
                          flavor.applicationIdSuffix = '.batterycalibration'
                          flavor.manifestPlaceholders['appName'] = 'White Noise Battery Fixture'
                      }
                  }
              }
          }
          GRADLE
          ./gradlew --init-script "$RUNNER_TEMP/battery-fixture.init.gradle" \
            -Pandroid.injected.build.abi=arm64-v8a \
            :app:assembleDevZapstoreBenchmarkRelease --no-daemon --build-cache --stacktrace
      - name: Record build and APK provenance
        shell: bash
        run: |
          python3 - <<'PY'
          import hashlib
          import json
          import os
          from pathlib import Path
          import shutil

          package = os.environ["BATTERY_FIXTURE_PACKAGE"]
          matches = set()
          for meta in Path("app/build").rglob("output-metadata.json"):
              data = json.loads(meta.read_text())
              if data.get("variantName") != "devZapstoreBenchmarkRelease" or data.get("applicationId") != package:
                  continue
              for entry in data["elements"]:
                  file = meta.parent / entry["outputFile"]
                  if file.is_file() and "arm64-v8a" in file.name:
                      matches.add(file.resolve())
          if len(matches) != 1:
              raise SystemExit("Expected exactly one arm64-v8a battery fixture APK")
          destination = Path("build/battery-fixture")
          destination.mkdir(parents=True)
          apk = destination / "app.apk"
          shutil.copyfile(matches.pop(), apk)
          pin = dict(line.split("=", 1) for line in Path("app/src/main/marmotkit/MARMOT_VERSION").read_text().splitlines()
                     if "=" in line)
          manifest = {"source_sha": os.environ["BATTERY_SOURCE_SHA"], "mdk_sha": pin["mdk-sha"],
                      "package": package, "abi": "arm64-v8a",
                      "apk_sha256": hashlib.sha256(apk.read_bytes()).hexdigest()}
          (destination / "manifest.json").write_text(json.dumps(manifest, indent=2) + "\n")
          PY
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: isolated-master-battery-fixture-2f1d7f5
          path: build/battery-fixture/
          if-no-files-found: error
          retention-days: 7
