name: Android Staging APK

# Builds a signed staging APK for internal installation. This intentionally
# stays separate from android-ci.yml: PR validation remains credential-free,
# while master pushes can produce a downloadable staging artifact.

on:
  push:
    branches: [master]
  workflow_dispatch:

concurrency:
  group: android-staging-apk-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Build signed staging APK
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Configure MarmotKit cache directory
        shell: bash
        run: printf 'WHITENOISE_MARMOTKIT_CACHE_DIR=%s\n' "$RUNNER_TEMP/marmotkit-cache" >> "$GITHUB_ENV"

      # AGP 9.x / Gradle 9.4.1 require JDK 17.
      - name: Set up JDK 17
        uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6.0.0
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0

      - name: Set up Android SDK tools
        uses: android-actions/setup-android@40fd30fb8d7440372e1316f5d1809ec01dcd3699 # v4

      - name: Test release and staging transport tooling
        run: |
          ./scripts/release_test.sh
          .github/scripts/test-staging-apk-transport.sh
          python3 .github/scripts/test-generate-audit-attestation.py

      - name: Read MarmotKit artifact pin
        id: marmotkit
        shell: bash
        run: |
          sha="$(awk -F= '$1 == "artifact-sha256" { print $2 }' app/src/main/marmotkit/MARMOT_VERSION)"
          [[ "$sha" =~ ^[0-9a-f]{64}$ ]] || { echo "Invalid MarmotKit artifact SHA-256" >&2; exit 1; }
          printf 'sha=%s\n' "$sha" >> "$GITHUB_OUTPUT"

      - name: Restore MarmotKit artifact
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/marmotkit-cache
          key: marmotkit-${{ runner.os }}-${{ steps.marmotkit.outputs.sha }}

      - name: Check staging secrets
        env:
          ANDROID_GOOGLE_SERVICES_JSON_BASE64: ${{ secrets.ANDROID_GOOGLE_SERVICES_JSON_BASE64 }}
          WHITENOISE_STAGING_KEYSTORE_BASE64: ${{ secrets.WHITENOISE_STAGING_KEYSTORE_BASE64 }}
          WHITENOISE_STAGING_KEYSTORE_PASSWORD: ${{ secrets.WHITENOISE_STAGING_KEYSTORE_PASSWORD }}
          WHITENOISE_STAGING_KEY_ALIAS: ${{ secrets.WHITENOISE_STAGING_KEY_ALIAS }}
          WHITENOISE_STAGING_KEY_PASSWORD: ${{ secrets.WHITENOISE_STAGING_KEY_PASSWORD }}
          WHITENOISE_STAGING_OTLP_ENDPOINT: ${{ secrets.WHITENOISE_STAGING_OTLP_ENDPOINT }}
          WHITENOISE_STAGING_OTLP_AUTH_TOKEN: ${{ secrets.WHITENOISE_STAGING_OTLP_AUTH_TOKEN }}
          WHITENOISE_STAGING_AUDIT_LOG_ENDPOINT: ${{ secrets.WHITENOISE_STAGING_AUDIT_LOG_ENDPOINT }}
          WHITENOISE_STAGING_AUDIT_LOG_AUTH_TOKEN: ${{ secrets.WHITENOISE_STAGING_AUDIT_LOG_AUTH_TOKEN }}
          WHITENOISE_STAGING_TELEMETRY_TENANT: ${{ secrets.WHITENOISE_STAGING_TELEMETRY_TENANT }}
          WHITENOISE_STAGING_PUSH_SERVER_PUBKEY_HEX: ${{ secrets.WHITENOISE_STAGING_PUSH_SERVER_PUBKEY_HEX }}
          WHITENOISE_STAGING_PUSH_RELAY_HINT: ${{ secrets.WHITENOISE_STAGING_PUSH_RELAY_HINT }}
        shell: bash
        run: |
          set -euo pipefail

          required=(
            ANDROID_GOOGLE_SERVICES_JSON_BASE64
            WHITENOISE_STAGING_KEYSTORE_BASE64
            WHITENOISE_STAGING_KEYSTORE_PASSWORD
            WHITENOISE_STAGING_KEY_ALIAS
            WHITENOISE_STAGING_KEY_PASSWORD
            WHITENOISE_STAGING_OTLP_ENDPOINT
            WHITENOISE_STAGING_OTLP_AUTH_TOKEN
            WHITENOISE_STAGING_AUDIT_LOG_ENDPOINT
            WHITENOISE_STAGING_AUDIT_LOG_AUTH_TOKEN
            WHITENOISE_STAGING_TELEMETRY_TENANT
            WHITENOISE_STAGING_PUSH_SERVER_PUBKEY_HEX
            WHITENOISE_STAGING_PUSH_RELAY_HINT
          )

          missing=()
          for name in "${required[@]}"; do
            if [[ -z "${!name:-}" ]]; then
              missing+=("$name")
            fi
          done

          if (( ${#missing[@]} > 0 )); then
            printf 'Missing staging CI secret(s):\n' >&2
            printf ' - %s\n' "${missing[@]}" >&2
            exit 1
          fi

      - name: Generate trusted audit attestation
        env:
          WHITENOISE_STAGING_AUDIT_LOG_ENDPOINT: ${{ secrets.WHITENOISE_STAGING_AUDIT_LOG_ENDPOINT }}
          WHITENOISE_STAGING_AUDIT_LOG_AUTH_TOKEN: ${{ secrets.WHITENOISE_STAGING_AUDIT_LOG_AUTH_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          .github/scripts/generate-audit-attestation.py \
            app/src/staging/assets/whitenoise-audit-attestation-v1.json
          {
            printf 'WHITENOISE_AUDIT_RUNTIME_REQUIRED=true\n'
            printf 'WHITENOISE_AUDIT_DATA_MODE=obfuscated_sensitive_data\n'
          } >> "$GITHUB_ENV"

      - name: Write Firebase config
        env:
          ANDROID_GOOGLE_SERVICES_JSON_BASE64: ${{ secrets.ANDROID_GOOGLE_SERVICES_JSON_BASE64 }}
        shell: bash
        run: |
          set -euo pipefail
          printf '%s' "$ANDROID_GOOGLE_SERVICES_JSON_BASE64" | base64 --decode > app/google-services.json

          python3 - <<'PY'
          import json
          from pathlib import Path

          package_name = "dev.ipf.whitenoise.android.staging"
          config = json.loads(Path("app/google-services.json").read_text())
          packages = [
              client.get("client_info", {})
              .get("android_client_info", {})
              .get("package_name")
              for client in config.get("client", [])
          ]
          if package_name not in packages:
              raise SystemExit(f"google-services.json is missing client for {package_name}")
          PY

      - name: Decode staging keystore
        env:
          WHITENOISE_STAGING_KEYSTORE_BASE64: ${{ secrets.WHITENOISE_STAGING_KEYSTORE_BASE64 }}
        shell: bash
        run: |
          set -euo pipefail
          keystore_path="$RUNNER_TEMP/whitenoise-staging-release.p12"
          printf '%s' "$WHITENOISE_STAGING_KEYSTORE_BASE64" \
            | base64 --decode > "$keystore_path"
          chmod 600 "$keystore_path"
          printf 'WHITENOISE_STAGING_KEYSTORE_PATH=%s\n' "$keystore_path" >> "$GITHUB_ENV"

      # The raw APK must stay well below the encrypted Marmot media ceiling.
      # Legacy JNI packaging compresses native libraries and makes Android
      # extract them at install time without changing the staging app identity.
      - name: Configure transport-safe staging packaging
        shell: bash
        run: |
          cat > "$RUNNER_TEMP/compact-staging-apk.gradle" <<'GRADLE'
          gradle.beforeProject { project ->
              project.plugins.withId("com.android.application") {
                  project.extensions.getByName("android").packaging.jniLibs.useLegacyPackaging = true
              }
          }
          GRADLE
          printf 'STAGING_INIT_SCRIPT=%s\n' "$RUNNER_TEMP/compact-staging-apk.gradle" >> "$GITHUB_ENV"

      - name: Build staging APK
        env:
          WHITENOISE_STAGING_KEYSTORE_PASSWORD: ${{ secrets.WHITENOISE_STAGING_KEYSTORE_PASSWORD }}
          WHITENOISE_STAGING_KEY_ALIAS: ${{ secrets.WHITENOISE_STAGING_KEY_ALIAS }}
          WHITENOISE_STAGING_KEY_PASSWORD: ${{ secrets.WHITENOISE_STAGING_KEY_PASSWORD }}
          WHITENOISE_STAGING_OTLP_ENDPOINT: ${{ secrets.WHITENOISE_STAGING_OTLP_ENDPOINT }}
          WHITENOISE_STAGING_OTLP_AUTH_TOKEN: ${{ secrets.WHITENOISE_STAGING_OTLP_AUTH_TOKEN }}
          WHITENOISE_STAGING_AUDIT_LOG_ENDPOINT: ${{ secrets.WHITENOISE_STAGING_AUDIT_LOG_ENDPOINT }}
          WHITENOISE_STAGING_AUDIT_LOG_AUTH_TOKEN: ${{ secrets.WHITENOISE_STAGING_AUDIT_LOG_AUTH_TOKEN }}
          WHITENOISE_STAGING_TELEMETRY_TENANT: ${{ secrets.WHITENOISE_STAGING_TELEMETRY_TENANT }}
          WHITENOISE_STAGING_PUSH_SERVER_PUBKEY_HEX: ${{ secrets.WHITENOISE_STAGING_PUSH_SERVER_PUBKEY_HEX }}
          WHITENOISE_STAGING_PUSH_RELAY_HINT: ${{ secrets.WHITENOISE_STAGING_PUSH_RELAY_HINT }}
        run: >-
          ./scripts/release.sh --flavor staging --abi arm64-v8a
          --gradle-init-script "$STAGING_INIT_SCRIPT"

      - name: Verify transport-safe staging APK
        shell: bash
        run: |
          mapfile -t apks < <(find app/build/outputs/apk/stagingZapstore/release \
            -maxdepth 1 -type f -name 'whitenoise-staging-v8a-release-*.apk' -print)
          [[ ${#apks[@]} -eq 1 ]]
          .github/scripts/verify-staging-apk-transport.sh "${apks[0]}"
          python3 - "${apks[0]}" <<'PY'
          import json
          import sys
          import zipfile
          from pathlib import Path

          generated = Path("app/src/staging/assets/whitenoise-audit-attestation-v1.json").read_bytes()
          with zipfile.ZipFile(sys.argv[1]) as apk:
              bundled = apk.read("assets/whitenoise-audit-attestation-v1.json")
          if bundled != generated:
              raise SystemExit("bundled audit attestation differs from the trusted generated source")
          json.loads(bundled)
          PY

      - name: Compute short SHA
        id: sha
        shell: bash
        run: printf 'short=%s\n' "${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - name: Upload staging APK
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          # Unique per run so consecutive master commits don't produce
          # identically-named zips that collide on disk when downloaded.
          # See issue #992.
          name: whitenoise-staging-v8a-release-${{ github.run_number }}-${{ steps.sha.outputs.short }}
          path: app/build/outputs/apk/stagingZapstore/release/whitenoise-staging-v8a-release-*.apk
          if-no-files-found: error
          # Short retention on purpose: the signed APK bakes in the staging
          # OTLP/audit-log auth tokens, so every day it sits in Actions
          # artifacts is another day those are extractable (#224).
          retention-days: 3
