name: Invariant gate

# A pull request to master that closes a bug must change, name or exempt a
# registered invariant gate (docs/invariant-gates.md). The job reads PR metadata
# with the default read-only token, needs no secrets and runs for fork pull
# requests. `edited` re-runs it when the description gains or changes its
# declaration. It compiles nothing and is independent of the visual gate.
#
# What is and is not protected: the checker script and its tests run from the
# base revision, and the pull request's registry is fetched through the API as
# data, so a pull request cannot alter the checker or its tests. This workflow
# file itself runs from the pull request (pull_request event), so a change to it
# is protected only by review: CODEOWNERS requests an owner for .github/, and
# making this check required plus requiring code-owner review are admin
# branch-protection steps. The one exception to base-revision execution is
# bootstrap, when the base has no checker yet (only the pull request that adds
# it), which falls back to the proposed checker with a warning.
on:
  pull_request:
    branches: [master]
    types: [opened, edited, reopened, synchronize, ready_for_review]

concurrency:
  group: invariant-gate-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read
  issues: read
  pull-requests: read

jobs:
  check:
    name: Bug-fix invariant gate
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out the base-revision gate script
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          path: trusted
          # The trusted tests read the base registry and this workflow, so check them out beside the script.
          sparse-checkout: |
            .github/scripts
            .github/workflows/invariant-gate.yml
            docs/invariant-gates.md
          sparse-checkout-cone-mode: false
          persist-credentials: false

      - name: Check out the proposed gate script for bootstrap only
        if: hashFiles('trusted/.github/scripts/check-invariant-gate.js') == ''
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          path: proposed
          sparse-checkout: |
            .github/scripts
            .github/workflows/invariant-gate.yml
            docs/invariant-gates.md
          sparse-checkout-cone-mode: false
          persist-credentials: false

      - name: Select the gate script revision
        id: script
        run: |
          if [ -f trusted/.github/scripts/check-invariant-gate.js ]; then
            echo "root=trusted" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::The base revision has no invariant-gate checker yet; running the proposed one (bootstrap only)."
            echo "root=proposed" >> "$GITHUB_OUTPUT"
          fi

      - name: Test invariant-gate check
        working-directory: ${{ steps.script.outputs.root }}
        run: node --test .github/scripts/check-invariant-gate.test.js

      - name: Check bug-fix invariant gate
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v8
        env:
          GATE_ROOT: ${{ steps.script.outputs.root }}
        with:
          script: |
            const path = require('node:path')
            const root = path.join(process.env.GITHUB_WORKSPACE, process.env.GATE_ROOT)
            const gate = require(path.join(root, '.github/scripts/check-invariant-gate.js'))
            await gate.run({ github, context, core })
