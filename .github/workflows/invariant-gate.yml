name: Invariant gate

# A pull request to master that closes a bug must change, name or exempt a
# registered invariant gate (docs/invariant-gates.md). The job reads PR metadata
# with the default read-only token, needs no secrets and runs for fork pull
# requests. `edited` re-runs it when the description gains or changes its
# declaration. It never builds or compiles, and it is independent of the visual
# gate.
#
# The checker and its tests run from the trusted base revision, so a pull
# request cannot rewrite the check that judges it. The pull request's registry
# is read as data only. The single exception is bootstrap: when the base does
# not contain the checker yet (only the pull request that introduces it), the
# proposed checker runs and the job says so.
on:
  pull_request:
    branches: [master]
    types: [opened, edited, reopened, synchronize, ready_for_review]

concurrency:
  group: invariant-gate-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read
  issues: read
  pull-requests: read

jobs:
  check:
    name: Bug-fix invariant gate
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out the trusted gate script
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          path: trusted
          # The trusted tests read the base registry, so check it out beside the script.
          sparse-checkout: |
            .github/scripts
            docs/invariant-gates.md
          sparse-checkout-cone-mode: false
          persist-credentials: false

      - name: Check out the proposed registry
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          path: proposed
          sparse-checkout: |
            .github/scripts
            docs/invariant-gates.md
          sparse-checkout-cone-mode: false
          persist-credentials: false

      - name: Select the gate script revision
        id: script
        run: |
          if [ -f trusted/.github/scripts/check-invariant-gate.js ]; then
            echo "root=trusted" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::The base revision has no invariant-gate checker yet; running the proposed one (bootstrap only)."
            echo "root=proposed" >> "$GITHUB_OUTPUT"
          fi

      - name: Test invariant-gate check
        working-directory: ${{ steps.script.outputs.root }}
        run: node --test .github/scripts/check-invariant-gate.test.js

      - name: Check bug-fix invariant gate
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v8
        env:
          GATE_ROOT: ${{ steps.script.outputs.root }}
        with:
          script: |
            const path = require('node:path')
            const workspace = process.env.GITHUB_WORKSPACE
            const gate = require(path.join(workspace, process.env.GATE_ROOT, '.github/scripts/check-invariant-gate.js'))
            const registryPath = path.join(workspace, 'proposed/docs/invariant-gates.md')
            await gate.run({ github, context, core, registryPath })
