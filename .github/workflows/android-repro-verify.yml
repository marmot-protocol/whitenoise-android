name: Android Reproducible Release Verify

# Builds two unsigned production Zapstore arm64 release APKs from isolated trees
# at the same commit and requires them to match byte-for-byte. Publishes the
# verified unsigned APK and SHA256SUMS for third-party comparison (#1261).
# Signed store/sideload releases are out of scope — see docs/reproducible-apk-builds.md.

on:
  push:
    tags:
      - '*'
  pull_request:
    branches: [master]
  merge_group:
    types: [checks_requested]
  workflow_dispatch:
  schedule:
    - cron: '17 3 * * *'

concurrency:
  group: android-repro-verify-${{ github.workflow }}-${{ github.event_name }}-${{ github.event_name == 'merge_group' && github.sha || github.ref }}
  cancel-in-progress: ${{ github.event_name != 'merge_group' }}

permissions:
  contents: read

jobs:
  changes:
    name: Classify reproduction campaign inputs
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      supplemental_campaigns: ${{ steps.classify.outputs.supplemental_campaigns }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Test conservative CI classification
        run: python3 -m unittest scripts/test_check_ci_changes.py
      - name: Classify complete PR diff
        id: classify
        env:
          CI_EVENT: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.merge_group.base_sha || github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.merge_group.head_sha || github.event.pull_request.head.sha || github.sha }}
        run: python3 scripts/check_ci_changes.py --event "$CI_EVENT" --base "$BASE_SHA" --head "$HEAD_SHA"

  lint:
    name: Release lint (${{ matrix.variant }})
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        variant: [Production, Staging]
    env:
      WHITENOISE_ALLOW_UNSIGNED_RELEASE: 'true'
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Set up JDK 17
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
        with:
          cache-read-only: ${{ github.event_name == 'merge_group' || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository) }}

      # Run each release assertion once, without competing with R8 or emulator work.
      - name: Check release lint
        run: >-
          ./gradlew :app:lintVital${{ matrix.variant }}ZapstoreRelease
          -Pandroid.injected.testOnly=false --build-cache --no-daemon --stacktrace

      - name: Upload lint reports
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-lint-${{ matrix.variant }}
          path: |
            app/build/reports/lint-results-*
            app/build/intermediates/lint_vital_intermediate_text_report/
          if-no-files-found: ignore
          retention-days: 7

  build:
    needs: changes
    if: needs.changes.outputs.supplemental_campaigns != 'false'
    name: Independent unsigned build (${{ matrix.tree }})
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        tree: [first, second]

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Shell tests (repro-verify)
        run: ./scripts/test-repro-verify.sh

      - name: Set up JDK 21.0.7+6.0.LTS
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: '21.0.7+6.0.LTS'
          verify-signature: true

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
        with:
          cache-disabled: true

      # Only downloaded inputs cross runs. Never restore task outputs or transforms.
      - name: Restore shared build inputs
        id: inputs
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ${{ runner.temp }}/repro-gradle-home/wrapper
            ${{ runner.temp }}/repro-gradle-home/caches/modules-2
            ${{ runner.temp }}/repro-gradle-home/caches/whitenoise/marmotkit
          key: repro-inputs-v2-${{ runner.os }}-${{ hashFiles('gradle/**', '**/*.gradle.kts', 'gradle.properties', 'app/src/main/marmotkit/MARMOT_VERSION') }}
          restore-keys: repro-inputs-v2-${{ runner.os }}-

      - name: Build isolated unsigned APK
        shell: bash
        env:
          BUILD_TREE: ${{ matrix.tree }}
        run: |
          set -euo pipefail
          ./scripts/repro-ci.sh build "$GITHUB_SHA" \
            "$RUNNER_TEMP/repro-$BUILD_TREE" "$RUNNER_TEMP/repro-gradle-home" \
            "$RUNNER_TEMP/repro-evidence"

      # The two runners have independent filesystems but consume identical inputs.
      - name: Save shared build inputs once
        if: >-
          matrix.tree == 'first' && steps.inputs.outputs.cache-hit != 'true' &&
          github.event_name != 'merge_group' &&
          (github.event_name != 'pull_request' ||
           github.event.pull_request.head.repo.full_name == github.repository)
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ${{ runner.temp }}/repro-gradle-home/wrapper
            ${{ runner.temp }}/repro-gradle-home/caches/modules-2
            ${{ runner.temp }}/repro-gradle-home/caches/whitenoise/marmotkit
          key: ${{ steps.inputs.outputs.cache-primary-key }}

      - name: Transfer independent build evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: repro-${{ matrix.tree }}
          path: ${{ runner.temp }}/repro-evidence/
          if-no-files-found: error
          compression-level: 0
          retention-days: 1

      - name: Upload build timing profile
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: build-profile-${{ matrix.tree }}
          path: ${{ runner.temp }}/repro-${{ matrix.tree }}/tree/build/reports/profile/
          if-no-files-found: ignore
          retention-days: 7

  verify:
    name: Verify unsigned production APK reproducibility
    needs: [changes, build, lint]
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Require independent builds and release lint
        env:
          CHANGES_RESULT: ${{ needs.changes.result }}
          CAMPAIGNS: ${{ needs.changes.outputs.supplemental_campaigns }}
          CI_EVENT: ${{ github.event_name }}
          BUILD_RESULT: ${{ needs.build.result }}
          LINT_RESULT: ${{ needs.lint.result }}
        shell: bash
        run: |
          set -euo pipefail
          test "$CHANGES_RESULT" = success
          test "$LINT_RESULT" = success
          case "$CAMPAIGNS" in
            true) test "$BUILD_RESULT" = success ;;
            false) { test "$CI_EVENT" = pull_request || test "$CI_EVENT" = merge_group; } && test "$BUILD_RESULT" = skipped ;;
            *) exit 1 ;;
          esac

      - name: Checkout
        if: needs.changes.outputs.supplemental_campaigns == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Download independent evidence
        if: needs.changes.outputs.supplemental_campaigns == 'true'
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          pattern: repro-*
          path: ${{ runner.temp }}/repro-inputs

      - name: Compare source, toolchains and unsigned APK bytes
        if: needs.changes.outputs.supplemental_campaigns == 'true'
        shell: bash
        run: |
          set -euo pipefail
          ./scripts/repro-ci.sh compare "$GITHUB_SHA" \
            "$RUNNER_TEMP/repro-inputs/repro-first" \
            "$RUNNER_TEMP/repro-inputs/repro-second" \
            "$RUNNER_TEMP/repro-verify-evidence" | tee repro-verify.log

      - name: Upload verified unsigned APK
        if: github.event_name != 'pull_request' && github.event_name != 'merge_group' && needs.changes.outputs.supplemental_campaigns == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: whitenoise-repro-verify-${{ github.run_number }}-${{ github.sha }}
          path: |
            ${{ runner.temp }}/repro-verify-evidence/
            repro-verify.log
          if-no-files-found: error
          retention-days: 90
