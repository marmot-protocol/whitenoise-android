name: Android Reproducible Release Verify

# Builds two unsigned production Zapstore arm64 release APKs from isolated trees
# at the same commit and requires them to match byte-for-byte. Publishes the
# verified unsigned APK and SHA256SUMS for third-party comparison (#1261).
# Signed store/sideload releases are out of scope — see docs/reproducible-apk-builds.md.

on:
  push:
    tags:
      - '*'
  pull_request:
    branches: [master]
  workflow_dispatch:

concurrency:
  group: android-repro-verify-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    name: Verify unsigned production APK reproducibility
    runs-on: ubuntu-24.04
    timeout-minutes: 90

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Shell tests (repro-verify)
        run: ./scripts/test-repro-verify.sh

      - name: Set up JDK 21.0.7+6.0.LTS
        uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6.0.0
        with:
          distribution: temurin
          java-version: '21.0.7+6.0.LTS'
          verify-signature: true

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0
        with:
          cache-disabled: true

      - name: Run reproducibility verifier
        id: verify
        shell: bash
        run: |
          set -euo pipefail
          evidence_dir="$RUNNER_TEMP/repro-verify-evidence"
          mkdir -p "$evidence_dir"
          ./scripts/repro-verify.sh \
            --ref "$GITHUB_SHA" \
            --evidence-dir "$evidence_dir" \
            | tee repro-verify.log
          printf 'evidence_dir=%s\n' "$evidence_dir" >> "$GITHUB_OUTPUT"
          cat "$evidence_dir/repro-build-environment.txt"

      - name: Upload verified unsigned APK
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: whitenoise-repro-verify-${{ github.run_number }}-${{ github.sha }}
          path: |
            ${{ steps.verify.outputs.evidence_dir }}/
            repro-verify.log
          if-no-files-found: error
          retention-days: 90
