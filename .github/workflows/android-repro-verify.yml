name: Android Reproducible Release Verify

# Builds two unsigned production Zapstore arm64 release APKs from isolated trees
# at the same commit and requires them to match byte-for-byte. Publishes the
# verified unsigned APK and SHA256SUMS for third-party comparison (#1261).
# Signed store/sideload releases are out of scope — see docs/reproducible-apk-builds.md.

on:
  push:
    tags:
      - '*'
  pull_request:
    branches: [master]
    paths:
      - '.github/workflows/android-repro-verify.yml'
      - 'scripts/repro-verify.sh'
      - 'scripts/test-repro-verify.sh'
      - 'app/build.gradle.kts'
      - 'gradle/**'
  workflow_dispatch:

concurrency:
  group: android-repro-verify-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    name: Verify unsigned production APK reproducibility
    runs-on: ubuntu-24.04
    timeout-minutes: 90

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Shell tests (repro-verify)
        run: ./scripts/test-repro-verify.sh

      - name: Set up JDK 17.0.19+10
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: '17.0.19+10'
          verify-signature: true

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@3f131e8634966bd73d06cc69884922b02e6faf92 # v6.2.0

      - name: Run reproducibility verifier
        id: verify
        shell: bash
        run: |
          set -euo pipefail
          evidence_dir="$RUNNER_TEMP/repro-verify-evidence"
          mkdir -p "$evidence_dir"
          ./scripts/repro-verify.sh \
            --ref "$GITHUB_SHA" \
            --evidence-dir "$evidence_dir" \
            | tee repro-verify.log
          printf 'evidence_dir=%s\n' "$evidence_dir" >> "$GITHUB_OUTPUT"

      - name: Record verifier toolchain
        shell: bash
        run: |
          set -euo pipefail
          {
            printf 'source_sha=%s\n' "$GITHUB_SHA"
            printf 'runner_os=%s\n' "$RUNNER_OS"
            printf 'runner_arch=%s\n' "$RUNNER_ARCH"
            "$JAVA_HOME/bin/java" -version
            sha256sum gradle/wrapper/gradle-wrapper.jar gradle/wrapper/gradle-wrapper.properties
            find "$ANDROID_HOME/platforms" "$ANDROID_HOME/build-tools" \
              -maxdepth 2 -type f -name source.properties -print -exec sha256sum '{}' ';'
            find "$ANDROID_HOME/platforms" \
              -maxdepth 2 -type f -name android.jar -print -exec sha256sum '{}' ';'
          } > repro-build-environment.txt 2>&1
          cat repro-build-environment.txt

      - name: Upload verified unsigned APK
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: whitenoise-repro-verify-${{ github.run_number }}-${{ github.sha }}
          path: |
            ${{ steps.verify.outputs.evidence_dir }}/
            repro-build-environment.txt
            repro-verify.log
          if-no-files-found: error
          retention-days: 90
