name: Android Reproducible Release Verify

# Builds two unsigned production Zapstore arm64 release APKs from isolated trees
# at the same commit and requires them to match byte-for-byte. Publishes the
# verified unsigned APK and SHA256SUMS for third-party comparison (#1261).
# Signed store/sideload releases are out of scope — see docs/reproducible-apk-builds.md.

on:
  push:
    tags:
      - '*'
  pull_request:
    branches: [master]
  workflow_dispatch:

concurrency:
  group: android-repro-verify-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    name: Release lint (${{ matrix.variant }})
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        variant: [Production, Staging]
    env:
      WHITENOISE_ALLOW_UNSIGNED_RELEASE: 'true'
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Set up JDK 17
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0
        with:
          cache-read-only: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository }}

      # Run each release assertion once, without competing with R8 or emulator work.
      - name: Check release lint
        run: >-
          ./gradlew :app:lintVital${{ matrix.variant }}ZapstoreRelease
          -Pandroid.injected.testOnly=false --build-cache --no-daemon --stacktrace

      - name: Upload lint reports
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-lint-${{ matrix.variant }}
          path: |
            app/build/reports/lint-results-*
            app/build/intermediates/lint_vital_intermediate_text_report/
          if-no-files-found: ignore
          retention-days: 7

  build:
    name: Independent unsigned build (${{ matrix.tree }})
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        tree: [first, second]

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Shell tests (repro-verify)
        run: ./scripts/test-repro-verify.sh

      - name: Set up JDK 21.0.7+6.0.LTS
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: '21.0.7+6.0.LTS'
          verify-signature: true

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0
        with:
          cache-disabled: true

      # Only downloaded inputs cross runs. Never restore task outputs or transforms.
      - name: Restore shared build inputs
        id: inputs
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ${{ runner.temp }}/repro-gradle-home/wrapper
            ${{ runner.temp }}/repro-gradle-home/caches/modules-2
            ${{ runner.temp }}/repro-gradle-home/caches/whitenoise/marmotkit
          key: repro-inputs-v2-${{ runner.os }}-${{ hashFiles('gradle/**', '**/*.gradle.kts', 'gradle.properties', 'app/src/main/marmotkit/MARMOT_VERSION') }}
          restore-keys: repro-inputs-v2-${{ runner.os }}-

      - name: Build isolated unsigned APK
        shell: bash
        env:
          BUILD_TREE: ${{ matrix.tree }}
        run: |
          set -euo pipefail
          ./scripts/repro-ci.sh build "$GITHUB_SHA" \
            "$RUNNER_TEMP/repro-$BUILD_TREE" "$RUNNER_TEMP/repro-gradle-home" \
            "$RUNNER_TEMP/repro-evidence"

      # The two runners have independent filesystems but consume identical inputs.
      - name: Save shared build inputs once
        if: >-
          matrix.tree == 'first' && steps.inputs.outputs.cache-hit != 'true' &&
          (github.event_name != 'pull_request' ||
           github.event.pull_request.head.repo.full_name == github.repository)
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ${{ runner.temp }}/repro-gradle-home/wrapper
            ${{ runner.temp }}/repro-gradle-home/caches/modules-2
            ${{ runner.temp }}/repro-gradle-home/caches/whitenoise/marmotkit
          key: ${{ steps.inputs.outputs.cache-primary-key }}

      - name: Transfer independent build evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: repro-${{ matrix.tree }}
          path: ${{ runner.temp }}/repro-evidence/
          if-no-files-found: error
          compression-level: 0
          retention-days: 1

  verify:
    name: Verify unsigned production APK reproducibility
    needs: [build, lint]
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Require independent builds and release lint
        env:
          BUILD_RESULT: ${{ needs.build.result }}
          LINT_RESULT: ${{ needs.lint.result }}
        run: test "$BUILD_RESULT" = success && test "$LINT_RESULT" = success

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Download independent evidence
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          pattern: repro-*
          path: ${{ runner.temp }}/repro-inputs

      - name: Compare source, toolchains and unsigned APK bytes
        shell: bash
        run: |
          set -euo pipefail
          ./scripts/repro-ci.sh compare "$GITHUB_SHA" \
            "$RUNNER_TEMP/repro-inputs/repro-first" \
            "$RUNNER_TEMP/repro-inputs/repro-second" \
            "$RUNNER_TEMP/repro-verify-evidence" | tee repro-verify.log

      - name: Upload verified unsigned APK
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: whitenoise-repro-verify-${{ github.run_number }}-${{ github.sha }}
          path: |
            ${{ runner.temp }}/repro-verify-evidence/
            repro-verify.log
          if-no-files-found: error
          retention-days: 90
