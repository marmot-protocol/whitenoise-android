name: CodeQL

on:
  pull_request:
    branches: [master]
  push:
    branches: [master]
  schedule:
    - cron: '19 4 * * 2'
  workflow_dispatch:

concurrency:
  group: codeql-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

# Analysis needs to publish SARIF, but it never needs repository write access.
permissions:
  contents: read
  security-events: write

jobs:
  analyze:
    name: Analyze Java and Kotlin (${{ matrix.flavor }})
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          # Retain the existing analysis history for the Zapstore source set.
          - flavor: Zapstore
            category: /language:java-kotlin
          - flavor: Play
            category: /language:java-kotlin/flavor:play

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up JDK 17
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0

      - name: Initialize CodeQL
        uses: github/codeql-action/init@1c5b675653bb5c22dbe9b12b556ec555138e09fd # v4.38.1
        with:
          languages: java-kotlin
          build-mode: manual
          queries: security-extended

      # Each scan extracts shared production code and its flavor-specific code.
      # Compilation must execute under the extractor, even with warm caches.
      # The :benchmark module remains excluded because it contains test drivers.
      - name: Build Java and Kotlin for analysis
        run: >-
          ./gradlew
          :app:compileDev${{ matrix.flavor }}DebugKotlin
          --no-build-cache --no-daemon --stacktrace

      - name: Analyze
        uses: github/codeql-action/analyze@1c5b675653bb5c22dbe9b12b556ec555138e09fd # v4.38.1
        with:
          category: ${{ matrix.category }}

  verify:
    name: Analyze Java and Kotlin
    needs: analyze
    if: always()
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - name: Require both distribution scans
        env:
          SCAN_RESULT: ${{ needs.analyze.result }}
        run: test "$SCAN_RESULT" = success
