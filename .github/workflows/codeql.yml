name: CodeQL

# Scans master after merge, weekly and on demand rather than every PR push.
# No ruleset requires this check, so PRs do not wait for it. A finding on master
# is fixed through an ordinary PR.
on:
  push:
    branches: [master]
  schedule:
    - cron: '19 4 * * 2'
  workflow_dispatch:

concurrency:
  group: codeql-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

# Analysis needs to publish SARIF, but it never needs repository write access.
permissions:
  contents: read
  security-events: write

jobs:
  analyze:
    name: Analyze Java and Kotlin (${{ matrix.flavor }})
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          # Retain the existing analysis history for the Zapstore source set.
          - flavor: Zapstore
            category: /language:java-kotlin
          - flavor: Play
            category: /language:java-kotlin/flavor:play

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up JDK 17
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0

      - name: Initialize CodeQL
        uses: github/codeql-action/init@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          languages: java-kotlin
          build-mode: manual
          queries: security-extended

      # Each scan extracts shared production code and its flavor-specific code.
      # Compilation must execute under the extractor, even with warm caches.
      # The :benchmark module remains excluded because it contains test drivers.
      - name: Build Java and Kotlin for analysis
        run: >-
          ./gradlew
          :app:compileDev${{ matrix.flavor }}DebugKotlin
          --no-build-cache --no-daemon --stacktrace

      - name: Analyze
        uses: github/codeql-action/analyze@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          category: ${{ matrix.category }}

  verify:
    name: Analyze Java and Kotlin
    needs: analyze
    if: always()
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - name: Require both distribution scans
        env:
          SCAN_RESULT: ${{ needs.analyze.result }}
        run: test "$SCAN_RESULT" = success
