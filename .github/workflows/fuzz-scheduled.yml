name: Fuzz scheduled

on:
  schedule:
    - cron: '0 3 * * *'
  workflow_dispatch:
    inputs:
      campaign:
        description: 'Campaign length'
        required: true
        default: nightly
        type: choice
        options:
          - nightly
          - weekly

concurrency:
  group: fuzz-scheduled-${{ github.workflow }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  fuzz-campaign:
    name: Bounded fuzz campaign
    runs-on: ubuntu-latest
    # Nightly reserves margin beyond 9m of targets plus crash minimization/replay.
    timeout-minutes: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.campaign == 'weekly' && 60 || 30 }}

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up JDK 17
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0

      - name: Run bounded fuzz campaign
        env:
          FUZZ_MAX_DURATION: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.campaign == 'weekly' && '10m' || '3m' }}
        run: |
          ./gradlew :fuzz:fuzzScheduledDryRun \
            -PfuzzMaxDuration="$FUZZ_MAX_DURATION" \
            -PfuzzMaxHeap=2g \
            --no-daemon

      - name: Upload sanitized fuzz artifacts
        if: always()
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: fuzz-artifacts
          retention-days: 7
          if-no-files-found: ignore
          path: |
            fuzz/regression-corpus/**
            fuzz/build/fuzz-engine-metadata.properties
            fuzz/build/fuzz-triage-metadata/**
