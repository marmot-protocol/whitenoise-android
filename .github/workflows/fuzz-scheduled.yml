name: Fuzz scheduled

on:
  schedule:
    - cron: '0 3 * * *'
  workflow_dispatch:
    inputs:
      campaign:
        description: 'Campaign length'
        required: true
        default: nightly
        type: choice
        options:
          - nightly
          - weekly

concurrency:
  group: fuzz-scheduled-${{ github.workflow }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  fuzz-campaign:
    name: Bounded fuzz campaign
    runs-on: ubuntu-latest
    # Nightly: 4x90s targets + one <=5.5m triage leaves 3.5m for setup/compile/upload.
    timeout-minutes: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.campaign == 'weekly' && 60 || 15 }}

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up JDK 17
        uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6.0.0
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0

      - name: Run bounded fuzz campaign
        env:
          FUZZ_MAX_DURATION: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.campaign == 'weekly' && '10m' || '90s' }}
        run: |
          ./gradlew :fuzz:fuzzScheduledDryRun \
            -PfuzzMaxDuration="$FUZZ_MAX_DURATION" \
            -PfuzzMaxHeap=2g \
            --no-daemon

      - name: Upload sanitized fuzz artifacts
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: fuzz-artifacts
          retention-days: 7
          if-no-files-found: ignore
          path: |
            fuzz/regression-corpus/**
            fuzz/build/fuzz-engine-metadata.properties
            fuzz/build/fuzz-triage-metadata/**
