      - 'app/src/androidTest/java/dev/ipf/whitenoise/android/state/ChatListColdStartDirectPeerPresentationFfiIntegrationTest.kt'
      - 'app/src/androidTest/java/dev/ipf/whitenoise/android/state/LoopbackNostrRelay.kt'
      - 'scripts/check_instrumented_required_cases.py'
      - 'config/instrumented-required-cases.txt'

# Cancel superseded runs on the same ref so a force-push or rapid re-push does
# not pile up redundant (and expensive) emulator runs.
concurrency:
  group: ${{ github.event_name == 'workflow_dispatch' && inputs.media_startup_trace && 'android-media-startup-trace' || github.event_name == 'workflow_dispatch' && inputs.maestro_pilot && !inputs.mdk_adoption_only && !inputs.range_selection_only && !inputs.media_sandbox_only && !inputs.responsiveness_only && !inputs.outbound_share_only && !inputs.mdk_qualification && !inputs.mdk_preview_qualification && 'android-maestro-pilot' || format('android-instrumented-{0}-{1}-{2}', github.workflow, github.ref, inputs.mdk_preview_qualification && 'mdk-signed-preview' || inputs.mdk_qualification && 'mdk-qualification' || inputs.outbound_share_only && format('outbound-share-{0}', inputs.outbound_share_api) || inputs.range_selection_only && 'range-selection' || inputs.responsiveness_only && 'responsiveness' || 'standard') }}
  cancel-in-progress: ${{ !(github.event_name == 'workflow_dispatch' && (inputs.maestro_pilot || inputs.media_startup_trace || inputs.mdk_qualification || inputs.mdk_preview_qualification)) }}

permissions:
  contents: read

jobs:
  # Draft PRs boot no emulators; ready_for_review starts the run.
  changes:
    name: Select emulator lanes
    if: ${{ !github.event.pull_request.draft && !inputs.mdk_preview_qualification }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      attachment_fixture: ${{ steps.select.outputs.attachment_fixture }}
      attachment_fixture_scope: ${{ steps.select.outputs.attachment_fixture_scope }}
      connected: ${{ steps.select.outputs.connected }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Select lanes from the complete PR diff
        id: select
        env:
          CI_EVENT: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: python3 -m scripts.select_instrumented_lanes --event "$CI_EVENT" --base "$BASE_SHA" --head "$HEAD_SHA"

  attachment-fixture:
    needs: changes
    if: ${{ !inputs.media_startup_trace && needs.changes.outputs.attachment_fixture == 'true' && !inputs.mdk_adoption_only && !inputs.range_selection_only && !inputs.outbound_share_only && !inputs.media_sandbox_only && (github.event_name != 'workflow_dispatch' || (!inputs.maestro_pilot && !inputs.media_sandbox_only && !inputs.responsiveness_only)) && !inputs.mdk_qualification && !inputs.mdk_preview_qualification }}
    name: Controlled attachment fixture (${{ matrix.distribution }})
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        # Zapstore carries the self-updater/installer paths the APK probes
        # exercise; Play runs on master pushes and manual dispatches.
        distribution: ${{ fromJSON(github.event_name == 'pull_request' && '["Zapstore"]' || '["Play", "Zapstore"]') }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2
        env:
          # A PR whose fixture inputs are only the video-metadata scenario's runs that scenario alone.
          FIXTURE_SCOPE: ${{ needs.changes.outputs.attachment_fixture_scope }}
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          disable-animations: true
          emulator-options: -no-snapshot-save -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: |
            [ "$FIXTURE_SCOPE" = video-metadata ] || bash scripts/run-controlled-attachment-fixture.sh emulator-5554 "${{ matrix.distribution }}" ci-api34-x86_64
            [ "$FIXTURE_SCOPE" = video-metadata ] || bash scripts/run-controlled-attachment-fixture.sh emulator-5554 "${{ matrix.distribution }}" ci-api34-x86_64 controller-resume
            [ "$FIXTURE_SCOPE" = video-metadata ] || bash scripts/run-controlled-attachment-fixture.sh emulator-5554 "${{ matrix.distribution }}" ci-api34-x86_64 controller-resume-changed
            [ "$FIXTURE_SCOPE" = video-metadata ] || bash scripts/run-controlled-attachment-fixture.sh emulator-5554 "${{ matrix.distribution }}" ci-api34-x86_64 controller-unknown-length
            [ "$FIXTURE_SCOPE" = video-metadata ] || bash scripts/run-controlled-attachment-fixture.sh emulator-5554 "${{ matrix.distribution }}" ci-api34-x86_64 controller-background
            [ "$FIXTURE_SCOPE" = video-metadata ] || bash scripts/run-controlled-attachment-fixture.sh emulator-5554 "${{ matrix.distribution }}" ci-api34-x86_64 controller-lock
            [ "$FIXTURE_SCOPE" = video-metadata ] || bash scripts/run-controlled-attachment-fixture.sh emulator-5554 "${{ matrix.distribution }}" ci-api34-x86_64 controller-automatic-resume
            [ "$FIXTURE_SCOPE" = video-metadata ] || bash scripts/run-controlled-attachment-fixture.sh emulator-5554 "${{ matrix.distribution }}" ci-api34-x86_64 controller-phases
            [ "$FIXTURE_SCOPE" = video-metadata ] || bash scripts/run-controlled-attachment-fixture.sh emulator-5554 "${{ matrix.distribution }}" ci-api34-x86_64 controller-media
            [ "$FIXTURE_SCOPE" = video-metadata ] || bash scripts/run-controlled-attachment-fixture.sh emulator-5554 "${{ matrix.distribution }}" ci-api34-x86_64 controller-tile-transfer
            [ "$FIXTURE_SCOPE" = video-metadata ] || bash scripts/run-controlled-attachment-fixture.sh emulator-5554 "${{ matrix.distribution }}" ci-api34-x86_64 controller-background-receipt
            [ "$FIXTURE_SCOPE" = video-metadata ] || bash scripts/run-controlled-attachment-fixture.sh emulator-5554 "${{ matrix.distribution }}" ci-api34-x86_64 controller-apk
            [ "$FIXTURE_SCOPE" = video-metadata ] || bash scripts/run-controlled-attachment-fixture.sh emulator-5554 "${{ matrix.distribution }}" ci-api34-x86_64 controller-matrix unshaped,quick
            [ "$FIXTURE_SCOPE" = video-metadata ] || bash scripts/run-controlled-attachment-fixture.sh emulator-5554 "${{ matrix.distribution }}" ci-api34-x86_64 controller-apk-recreation
            [ "$FIXTURE_SCOPE" = video-metadata ] || bash scripts/run-controlled-attachment-fixture.sh emulator-5554 "${{ matrix.distribution }}" ci-api34-x86_64 controller-forward
            bash scripts/run-controlled-attachment-fixture.sh emulator-5554 "${{ matrix.distribution }}" ci-api34-x86_64 controller-video-metadata
      - name: Preserve redacted ledger and measurements on success or failure
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: attachment-fixture-${{ matrix.distribution }}
          path: app/build/reports/attachment-fixture/
          if-no-files-found: error
          retention-days: 7

  instrumented:
    needs: changes
    if: needs.changes.outputs.connected == 'true' && (inputs.media_startup_trace || github.event_name != 'workflow_dispatch' || !inputs.maestro_pilot || inputs.responsiveness_only || inputs.media_sandbox_only || inputs.outbound_share_only || inputs.mdk_adoption_only || inputs.range_selection_only) && !inputs.mdk_qualification && !inputs.mdk_preview_qualification
    name: Connected Android tests (emulator)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      OUTBOUND_SHARE_ANDROID_API: ${{ inputs.outbound_share_api || '34' }}
      RELEASE_VERIFY_REPORT_DIR: app/build/reports/outbound-share-contract

    steps:
      - name: Reject incompatible startup trace inputs
        if: inputs.media_startup_trace && (github.event_name != 'workflow_dispatch' || !inputs.media_sandbox_only || inputs.media_sandbox_api != '30' || inputs.maestro_pilot || inputs.responsiveness_only || inputs.outbound_share_only || inputs.mdk_adoption_only || inputs.review_demo_e2e || inputs.document_provider_matrix)
        run: exit 2

      - name: Reject incompatible MDK acceptance inputs
        if: inputs.mdk_adoption_only && (inputs.maestro_pilot || inputs.media_sandbox_only || inputs.responsiveness_only || inputs.outbound_share_only || inputs.review_demo_e2e || inputs.document_provider_matrix)
        run: |
          echo "Select one focused instrumented suite per dispatch" >&2
          exit 2

      - name: Reject incompatible focused share inputs
        if: inputs.outbound_share_only && (inputs.maestro_pilot || inputs.media_sandbox_only || inputs.responsiveness_only || inputs.review_demo_e2e || inputs.document_provider_matrix)
        run: |
          echo "Select one focused instrumented suite per dispatch" >&2
          exit 2

      - name: Reject incompatible manual suites
        if: github.event_name == 'workflow_dispatch' && inputs.responsiveness_only && inputs.maestro_pilot
        run: |
          echo "Select responsiveness acceptance or Maestro, not both" >&2
          exit 2

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Configure MarmotKit cache directory
        shell: bash
        run: printf 'WHITENOISE_MARMOTKIT_CACHE_DIR=%s\n' "$RUNNER_TEMP/marmotkit-cache" >> "$GITHUB_ENV"

      # AGP 9.x / Gradle 9.4.1 require JDK 17 (matches android-ci.yml).
      - name: Set up JDK 17
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0

      - name: Read MarmotKit artifact pin
        id: marmotkit
        shell: bash
        run: |
          sha="$(awk -F= '$1 == "artifact-sha256" { print $2 }' app/src/main/marmotkit/MARMOT_VERSION)"
          [[ "$sha" =~ ^[0-9a-f]{64}$ ]] || { echo "Invalid MarmotKit artifact SHA-256" >&2; exit 1; }
          printf 'sha=%s\n' "$sha" >> "$GITHUB_OUTPUT"

      - name: Restore MarmotKit artifact
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/marmotkit-cache
          key: marmotkit-${{ runner.os }}-${{ steps.marmotkit.outputs.sha }}

      # KVM lets the emulator run hardware-accelerated on the GitHub-hosted
      # ubuntu runner; without it the AVD boot is far slower or fails.
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Reject incompatible focused decoder inputs
        if: inputs.media_sandbox_only && (inputs.maestro_pilot || inputs.responsiveness_only || inputs.review_demo_e2e || inputs.document_provider_matrix)
        run: |
          echo "Select one focused instrumented suite per dispatch" >&2
          exit 2

      - name: Update SDK cmdline-tools for focused API 37 qualification
        if: ((inputs.outbound_share_only && inputs.outbound_share_api == '37.0') || (inputs.range_selection_only && inputs.range_selection_api == '37.0'))
        shell: bash
        run: |
          set -euo pipefail
          sdk_root="${ANDROID_SDK_ROOT:-${ANDROID_HOME:?}}"
          set +o pipefail
          yes | "$sdk_root/cmdline-tools/latest/bin/sdkmanager" --install 'cmdline-tools;latest' > /dev/null
          set -o pipefail
          # The action prepends latest/bin internally, overriding GITHUB_PATH.
          cmdline_tools_bin="$(python3 scripts/select_android_cmdline_tools.py "$sdk_root" --activate-latest)"
          "$cmdline_tools_bin/avdmanager" list device > /dev/null
          cat "$cmdline_tools_bin/../source.properties"
          printf '%s\n' "$cmdline_tools_bin" >> "$GITHUB_PATH"

      - name: Retry Android 17 input-service readiness for focused qualification
        if: ((inputs.outbound_share_only && inputs.outbound_share_api == '37.0') || (inputs.range_selection_only && inputs.range_selection_api == '37.0'))
        shell: bash
        run: |
          set -euo pipefail
          real_adb="${ANDROID_HOME:-/usr/local/lib/android/sdk}/platform-tools/adb"
          test -x "$real_adb"
          wrapper_dir="$RUNNER_TEMP/android17-share-adb-wrapper"
          mkdir -p "$wrapper_dir"
          ln -s "$GITHUB_WORKSPACE/scripts/android17-adb-wrapper.sh" "$wrapper_dir/adb"
          printf 'ANDROID17_REAL_ADB=%s\n' "$real_adb" >> "$GITHUB_ENV"
          printf '%s\n' "$wrapper_dir" >> "$GITHUB_PATH"

      - name: Reject overlapping range-selection dispatches
        if: inputs.range_selection_only && (inputs.mdk_adoption_only || inputs.mdk_qualification || inputs.mdk_preview_qualification || inputs.maestro_pilot || inputs.media_sandbox_only || inputs.responsiveness_only || inputs.outbound_share_only || inputs.review_demo_e2e || inputs.document_provider_matrix)
        run: |
          echo "Select one focused instrumented suite per dispatch" >&2
          exit 2

      - name: Run connected Android tests
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2
        with:
          api-level: ${{ inputs.range_selection_only && inputs.range_selection_api || inputs.outbound_share_only && inputs.outbound_share_api || inputs.media_sandbox_only && inputs.media_sandbox_api || 34 }}
          target: ${{ ((inputs.outbound_share_only && inputs.outbound_share_api == '37.0') || (inputs.range_selection_only && inputs.range_selection_api == '37.0')) && 'google_apis_ps16k' || 'google_apis' }}
          arch: x86_64
          profile: ${{ ((inputs.outbound_share_only && inputs.outbound_share_api == '37.0') || (inputs.range_selection_only && inputs.range_selection_api == '37.0')) && 'pixel_6' || '' }}
          ram-size: ${{ (inputs.range_selection_only || inputs.outbound_share_only) && '4096M' || '2048M' }}
          disk-size: ${{ (inputs.range_selection_only || inputs.outbound_share_only) && '8G' || '' }}
          pre-emulator-launch-script: ${{ ((inputs.outbound_share_only && inputs.outbound_share_api == '37.0') || (inputs.range_selection_only && inputs.range_selection_api == '37.0')) && './scripts/stabilize-android17-emulator.sh' || 'true' }}
          force-avd-creation: false
          emulator-options: -no-snapshot-save -no-window -gpu ${{ ((inputs.outbound_share_only && inputs.outbound_share_api == '37.0') || (inputs.range_selection_only && inputs.range_selection_api == '37.0')) && 'swangle' || 'swiftshader_indirect' }} -noaudio -no-boot-anim -camera-back none ${{ ((inputs.outbound_share_only && inputs.outbound_share_api == '37.0') || (inputs.range_selection_only && inputs.range_selection_api == '37.0')) && '-feature GLDirectMem' || '' }}
          disable-animations: true
          # android-emulator-runner executes this input through /bin/sh. Keep it
          # to one command and delegate conditional selection to the executable.
          script: ./scripts/run-android-instrumented-tests.sh "${{ github.event_name }}" "${{ inputs.review_demo_e2e }}" "${{ inputs.document_provider_matrix }}" "${{ inputs.responsiveness_only }}" "${{ inputs.media_sandbox_only }}" "${{ inputs.outbound_share_only }}" "${{ inputs.mdk_adoption_only }}" "${{ inputs.media_startup_trace }}" "${{ inputs.media_sandbox_api }}" "${{ inputs.range_selection_only }}"

      - name: Upload instrumented test reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: android-instrumented-reports
          path: |
            app/build/reports/androidTests/
            app/build/outputs/androidTest-results/
            app/build/outputs/connected_android_test_additional_output/
            cryptoBenchmark/build/reports/androidTests/
            cryptoBenchmark/build/outputs/androidTest-results/
            app/build/reports/document-provider-matrix/
            app/build/reports/outbound-share-contract/
            app/build/reports/media-startup-trace/
          if-no-files-found: ignore
          retention-days: 7

      - name: Record instrumentation checkout revision
        id: instrumentation_apk_revision
        if: success() || (failure() && !cancelled() && github.event_name == 'workflow_dispatch' && inputs.media_sandbox_only)
        shell: bash
        env:
          RETAIN_FAILED_MEDIA: ${{ job.status != 'success' }}
          RETAIN_STARTUP_TRACE: ${{ inputs.media_startup_trace }}
        run: |
          if [[ "$RETAIN_FAILED_MEDIA" == 'true' ]]; then
            shopt -s nullglob
            if [[ "$RETAIN_STARTUP_TRACE" == 'true' ]]; then
              app_apks=(app/build/outputs/apk/devZapstore/benchmarkRelease/*-universal-*.apk)
              test_apks=(app/build/outputs/apk/androidTest/devZapstore/benchmarkRelease/*.apk)
            else
              app_apks=(app/build/outputs/apk/devZapstore/debug/*-universal-debug.apk)
              test_apks=(app/build/outputs/apk/androidTest/devZapstore/debug/*.apk)
            fi
            if [[ ${#app_apks[@]} != 1 || ${#test_apks[@]} != 1 ]]; then
              echo "Focused failure capture requires exactly one built app and test APK" >&2
              exit 1
            fi
            [[ -f "${app_apks[0]}" && -f "${test_apks[0]}" ]]
          fi
          git rev-parse HEAD > app/build/outputs/apk/source-revision.txt

      - name: Retain built-revision instrumentation APKs
        if: success() || (failure() && !cancelled() && github.event_name == 'workflow_dispatch' && inputs.media_sandbox_only && steps.instrumentation_apk_revision.outcome == 'success')
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: android-instrumented-apks-${{ github.sha }}
          path: |
            app/build/outputs/apk/**/*.apk
            app/build/outputs/apk/source-revision.txt
            app/build/outputs/mapping/devZapstoreBenchmarkRelease*/mapping.txt
            scripts/outbound-share-fixture/build/fixture.apk
            scripts/outbound-share-fixture/build/control.apk
          if-no-files-found: error
          retention-days: 7

  maestro-pilot:
    name: Optional Maestro onboarding pilot
    if: ${{ !inputs.media_startup_trace && github.event_name == 'workflow_dispatch' && inputs.maestro_pilot && !inputs.mdk_adoption_only && !inputs.range_selection_only && !inputs.media_sandbox_only && !inputs.responsiveness_only && !inputs.outbound_share_only && !inputs.mdk_qualification && !inputs.mdk_preview_qualification && !startsWith(inputs.maestro_suite, 'runtime-') }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      actions: read
    env:
      MAESTRO_SUITE: ${{ inputs.maestro_suite }}
      MAESTRO_ANDROID_API: ${{ inputs.maestro_android_api || '34' }}
      MAESTRO_NAVIGATION_MODE: ${{ inputs.maestro_navigation_mode || 'button' }}
      MAESTRO_REPETITIONS: ${{ inputs.maestro_repetitions }}
      MAESTRO_NEGATIVE_CONTROL: ${{ inputs.maestro_negative_control }}
      MAESTRO_CLI_NO_ANALYTICS: 'true'
      MAESTRO_DISABLE_UPDATE_CHECK: 'true'
      MAESTRO_CLI_ANALYSIS_NOTIFICATION_DISABLED: 'true'
    steps:
      - name: Checkout the selected flow revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Validate selection and retained APK provenance
        env:
          GH_TOKEN: ${{ github.token }}
          ARTIFACT_ID: ${{ inputs.maestro_artifact_id }}
          SOURCE_SHA: ${{ inputs.maestro_source_sha }}
          REVIEW_DEMO: ${{ inputs.review_demo_e2e }}
          DOCUMENT_MATRIX: ${{ inputs.document_provider_matrix }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build/maestro-pilot
          printf 'setup_started_at=%s\n' "$(date +%s)" > build/maestro-pilot/timings.env
          [[ "$REVIEW_DEMO" != true && "$DOCUMENT_MATRIX" != true ]] || { echo 'Select only the Maestro pilot'; exit 2; }
          [[ "$MAESTRO_ANDROID_API" == 34 && "$MAESTRO_NAVIGATION_MODE" == button ]] || { echo 'OS/navigation qualification requires a runtime suite'; exit 2; }
          python3 -m unittest scripts/test_maestro_apk.py scripts/test_maestro_suite.py scripts/test_maestro_offline_batches.py
          python3 scripts/maestro_suite.py validate --suite "$MAESTRO_SUITE" \
            --repetitions "$MAESTRO_REPETITIONS" --negative "$MAESTRO_NEGATIVE_CONTROL"
          python3 scripts/maestro_apk.py fetch --artifact-id "$ARTIFACT_ID" --source "$SOURCE_SHA" \
            --repetitions "$MAESTRO_REPETITIONS" --destination build/maestro-pilot/apk

      - name: Require the expected dev package and API 34 compatibility
        shell: bash
        run: |
          set -euo pipefail
          aapt=$(find "$ANDROID_HOME/build-tools" -mindepth 2 -maxdepth 2 -type f -name aapt | sort -V | tail -1)
          test -x "$aapt"
          "$aapt" dump badging build/maestro-pilot/apk/app.apk > build/maestro-pilot/apk-badging.txt
          grep -q "^package: name='dev.ipf.whitenoise.android.dev' " build/maestro-pilot/apk-badging.txt
          min_sdk=$(sed -n "s/^sdkVersion:'\([0-9]*\)'$/\1/p" build/maestro-pilot/apk-badging.txt)
          [[ "$min_sdk" =~ ^[0-9]+$ && "$min_sdk" -le 34 ]]

      - name: Set up Java for Maestro
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '17'

      - name: Reuse the checksummed Maestro distribution
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/maestro.zip
          key: maestro-cli-${{ runner.os }}-2.11.0-5384593cb4e7a106489e75a821d157dd43f4e438df6bc308b72e82c685e1283a

      - name: Install the pinned Maestro CLI
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! -f "$RUNNER_TEMP/maestro.zip" ]]; then
            curl --fail --location --retry 2 --max-time 120 \
              https://github.com/mobile-dev-inc/Maestro/releases/download/cli-2.11.0/maestro.zip \
              --output "$RUNNER_TEMP/maestro.zip"
          fi
          echo '5384593cb4e7a106489e75a821d157dd43f4e438df6bc308b72e82c685e1283a  '"$RUNNER_TEMP/maestro.zip" | sha256sum -c -
          unzip -q "$RUNNER_TEMP/maestro.zip" -d "$RUNNER_TEMP/maestro-cli"
          printf '%s\n' "$RUNNER_TEMP/maestro-cli/maestro/bin" >> "$GITHUB_PATH"

      - name: Enable KVM
        shell: bash
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run the offline journey against the installed APK
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          disable-animations: true
          emulator-options: -no-snapshot-save -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: bash scripts/run-maestro-pilot.sh

      - name: Retain pilot results on success or failure
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: maestro-pilot-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            build/maestro-pilot/*.json
            build/maestro-pilot/*.xml
            build/maestro-pilot/*.txt
            build/maestro-pilot/*.env
            build/maestro-pilot/batches/
            build/maestro-pilot/debug/
            build/maestro-pilot/screenshots/
          if-no-files-found: warn
          retention-days: 7

  maestro-runtime-build:
    name: Build isolated Maestro fixture pair
    if: ${{ !inputs.media_startup_trace && github.event_name == 'workflow_dispatch' && inputs.maestro_pilot && !inputs.mdk_adoption_only && !inputs.range_selection_only && !inputs.media_sandbox_only && !inputs.responsiveness_only && !inputs.outbound_share_only && !inputs.mdk_qualification && !inputs.mdk_preview_qualification && startsWith(inputs.maestro_suite, 'runtime-') }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      slices: ${{ steps.selection.outputs.slices }}
      pair_artifact: ${{ steps.fixture.outputs.pair_artifact }}
      pair_attempt: ${{ steps.fixture.outputs.pair_attempt }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Validate explicit fixture selection
        id: selection
        env:
          SELECTED: ${{ inputs.maestro_suite }}
          REPEATS: ${{ inputs.maestro_repetitions }}
          NEGATIVE: ${{ inputs.maestro_negative_control }}
          DEMO: ${{ inputs.review_demo_e2e }}
          DOCUMENTS: ${{ inputs.document_provider_matrix }}
          ANDROID_API: ${{ inputs.maestro_android_api || '34' }}
          NAVIGATION: ${{ inputs.maestro_navigation_mode || 'button' }}
        run: |
          [[ "$REPEATS" == 1 && "$NEGATIVE" == false && "$DEMO" == false && "$DOCUMENTS" == false ]] || exit 2
          python3 scripts/maestro_environment.py validate --api "$ANDROID_API" --navigation "$NAVIGATION"
          python3 -m scripts.maestro_runtime_selection "$SELECTED" "$ANDROID_API" >> "$GITHUB_OUTPUT"
          python3 -m unittest scripts/test_maestro_runtime.py scripts/test_maestro_screen_coverage.py scripts/test_maestro_suite.py scripts/test_maestro_apk.py scripts/test_maestro_environment.py scripts/test_maestro_host_pressure.py
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
        with:
          # An unrelated release cache must not consume this optional pair's build budget.
          gradle-home-cache-strict-match: true
          cache-read-only: false
      - name: Build app and test APK once for this source revision
        id: fixture
        run: |
          ./gradlew --init-script scripts/maestro-runtime.init.gradle -Pandroid.injected.testOnly=true :app:assembleDevZapstoreDebug :app:assembleDevZapstoreDebugAndroidTest --no-daemon
          mkdir -p build/maestro-runtime-pair
          app_apks=(app/build/outputs/apk/devZapstore/debug/*-universal-debug.apk)
          test_apks=(app/build/outputs/apk/androidTest/devZapstore/debug/*.apk)
          [[ ${#app_apks[@]} == 1 && ${#test_apks[@]} == 1 ]]
          cp "${app_apks[0]}" build/maestro-runtime-pair/app.apk
          cp "${test_apks[0]}" build/maestro-runtime-pair/test.apk
          python3 scripts/maestro_runtime_pair.py stage build/maestro-runtime-pair
          printf 'pair_artifact=maestro-runtime-pair-%s-%s-%s\n' "$GITHUB_SHA" "$GITHUB_RUN_ID" "$GITHUB_RUN_ATTEMPT" >> "$GITHUB_OUTPUT"
          printf 'pair_attempt=%s\n' "$GITHUB_RUN_ATTEMPT" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: ${{ steps.fixture.outputs.pair_artifact }}
          path: build/maestro-runtime-pair/
          if-no-files-found: error
          retention-days: 7

  maestro-runtime:
    if: ${{ !inputs.media_startup_trace }}
    name: Maestro generated accounts (${{ matrix.slice }} ${{ matrix.partition }}/${{ matrix.partitions }})
    needs: maestro-runtime-build
    runs-on: ubuntu-latest
    timeout-minutes: 65
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        include: ${{ fromJSON(needs.maestro-runtime-build.outputs.slices) }}
    env:
      MAESTRO_CLI_NO_ANALYTICS: 'true'
      MAESTRO_DISABLE_UPDATE_CHECK: 'true'
      MAESTRO_CLI_ANALYSIS_NOTIFICATION_DISABLED: 'true'
      MAESTRO_PAIR_PRODUCER_ATTEMPT: ${{ needs.maestro-runtime-build.outputs.pair_attempt }}
      MAESTRO_ANDROID_API: ${{ inputs.maestro_android_api || '34' }}
      MAESTRO_NAVIGATION_MODE: ${{ inputs.maestro_navigation_mode || 'button' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: ${{ needs.maestro-runtime-build.outputs.pair_artifact }}
          path: build/maestro-runtime-pair
      - name: Verify the matching app and instrumentation pair
        run: python3 scripts/maestro_runtime_pair.py verify build/maestro-runtime-pair
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '17'
      - name: Reuse the checksummed Maestro distribution
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/maestro.zip
          key: maestro-cli-${{ runner.os }}-2.11.0-5384593cb4e7a106489e75a821d157dd43f4e438df6bc308b72e82c685e1283a

      - name: Install the pinned Maestro CLI
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! -f "$RUNNER_TEMP/maestro.zip" ]]; then
            curl --fail --location --retry 2 --max-time 120 \
              https://github.com/mobile-dev-inc/Maestro/releases/download/cli-2.11.0/maestro.zip \
              --output "$RUNNER_TEMP/maestro.zip"
          fi
          echo '5384593cb4e7a106489e75a821d157dd43f4e438df6bc308b72e82c685e1283a  '"$RUNNER_TEMP/maestro.zip" | sha256sum -c -
          unzip -q "$RUNNER_TEMP/maestro.zip" -d "$RUNNER_TEMP/maestro-cli"
          printf '%s\n' "$RUNNER_TEMP/maestro-cli/maestro/bin" >> "$GITHUB_PATH"

      - name: Enable KVM
        shell: bash
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Update SDK cmdline-tools for API 37
        if: inputs.maestro_android_api == '37.0'
        shell: bash
        run: |
          set -euo pipefail
          sdk_root="${ANDROID_SDK_ROOT:-${ANDROID_HOME:?}}"
          set +o pipefail
          yes | "$sdk_root/cmdline-tools/latest/bin/sdkmanager" \
            --install 'cmdline-tools;latest' > /dev/null
          set -o pipefail
          mapfile -t cmdline_tools_bins < <(
            find "$sdk_root/cmdline-tools" \
              -mindepth 2 -maxdepth 2 -type d -name bin \
              -path '*/latest*/bin' -print \
              | sort -V
          )
          if [[ ${#cmdline_tools_bins[@]} -eq 0 ]]; then
            printf 'Updated Android SDK cmdline-tools were not found\n' >&2
            exit 1
          fi
          cmdline_tools_bin="${cmdline_tools_bins[${#cmdline_tools_bins[@]} - 1]}"
          "$cmdline_tools_bin/avdmanager" list device > /dev/null
          printf '%s\n' "$cmdline_tools_bin" >> "$GITHUB_PATH"

      - name: Retry Android 17 input-service readiness
        if: inputs.maestro_android_api == '37.0'
        shell: bash
        run: |
          set -euo pipefail
          sdk_root="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          real_adb="$sdk_root/platform-tools/adb"
          test -x "$real_adb"
          wrapper_dir="$RUNNER_TEMP/android17-adb-wrapper"
          mkdir -p "$wrapper_dir"
          ln -s "$GITHUB_WORKSPACE/scripts/android17-adb-wrapper.sh" "$wrapper_dir/adb"
          printf 'ANDROID17_REAL_ADB=%s\n' "$real_adb" >> "$GITHUB_ENV"
          printf '%s\n' "$wrapper_dir" >> "$GITHUB_PATH"

      - name: Test Android 17 stabilization handshake
        if: inputs.maestro_android_api == '37.0'
        run: ./scripts/test-android17-emulator-stabilization.sh

      - name: Verify the emulator system image before launch
        run: python3 scripts/maestro_sdk_image.py --api "$MAESTRO_ANDROID_API" --reports build/maestro-sdk-image

      - name: Run generated native-account UI cases
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2
        with:
          emulator-boot-timeout: 300
          api-level: ${{ inputs.maestro_android_api || '34' }}
          target: ${{ inputs.maestro_android_api == '37.0' && 'google_apis_ps16k' || 'google_apis' }}
          arch: x86_64
          profile: ${{ inputs.maestro_android_api == '37.0' && 'pixel_6' || '' }}
          ram-size: 4096M
          disk-size: 8G
          pre-emulator-launch-script: ${{ inputs.maestro_android_api == '37.0' && './scripts/stabilize-android17-emulator.sh' || 'true' }}
          disable-animations: true
          emulator-options: -no-snapshot-save -no-window -gpu swangle -noaudio -no-boot-anim -camera-back none ${{ inputs.maestro_android_api == '37.0' && '-feature GLDirectMem' || '' }}
          script: |
            python3 scripts/maestro_environment.py configure --api "$MAESTRO_ANDROID_API" --navigation "$MAESTRO_NAVIGATION_MODE" --output build/maestro-runtime-environment.json
            python3 scripts/maestro_apk.py locale
            python3 scripts/maestro_apk.py offline
            adb -s emulator-5554 install -r -t build/maestro-runtime-pair/app.apk
            adb -s emulator-5554 install -r -t build/maestro-runtime-pair/test.apk
            python3 scripts/maestro_runtime.py --suite "${{ matrix.slice }}" --partition "${{ matrix.partition }}" --reports "build/maestro-runtime-${{ matrix.slice }}-${{ matrix.partition }}"
      - name: Retain runtime results, including failed or incomplete cases
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: maestro-runtime-results-${{ matrix.slice }}-${{ matrix.partition }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            build/maestro-runtime-${{ matrix.slice }}-${{ matrix.partition }}/
            build/maestro-runtime-pair/pair.json
            build/maestro-runtime-environment.json
            build/maestro-sdk-image/
          if-no-files-found: warn
          retention-days: 7

  maestro-runtime-summary:
    name: Reconcile every selected Maestro runtime case
    if: ${{ !inputs.media_startup_trace && always() && github.event_name == 'workflow_dispatch' && inputs.maestro_pilot && !inputs.mdk_adoption_only && !inputs.range_selection_only && !inputs.media_sandbox_only && !inputs.responsiveness_only && !inputs.outbound_share_only && !inputs.mdk_qualification && !inputs.mdk_preview_qualification && startsWith(inputs.maestro_suite, 'runtime-') }}
    needs: [maestro-runtime-build, maestro-runtime]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      MAESTRO_ANDROID_API: ${{ inputs.maestro_android_api || '34' }}
      MAESTRO_NAVIGATION_MODE: ${{ inputs.maestro_navigation_mode || 'button' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Collect selected runtime shard evidence
        continue-on-error: true
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          pattern: maestro-runtime-results-*-${{ github.run_id }}-*
          path: build/maestro-campaign-shards
      - name: Reconcile UI and native evidence for every selected case
        run: >-
          python3 scripts/maestro_runtime_summary.py
          --artifacts build/maestro-campaign-shards
          --suite "${{ inputs.maestro_suite }}"
          --output build/maestro-campaign-summary.json
      - name: Retain the complete campaign verdict
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: maestro-campaign-summary-${{ github.run_id }}-${{ github.run_attempt }}
          path: build/maestro-campaign-summary.json
          if-no-files-found: error
          retention-days: 7

  mdk-qualification:
    name: Populated MarmotKit upgrade and recovery (emulator)
    if: github.event_name == 'workflow_dispatch' && inputs.mdk_qualification && !inputs.mdk_preview_qualification
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - name: Reject mixed campaigns
        if: inputs.media_startup_trace || inputs.range_selection_only || inputs.mdk_adoption_only || inputs.maestro_pilot || inputs.media_sandbox_only || inputs.responsiveness_only || inputs.outbound_share_only || inputs.review_demo_e2e || inputs.document_provider_matrix
        run: exit 2
      - name: Checkout exact candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Set up JDK 17
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
      - name: Verify qualification evidence contracts
        run: python3 -m unittest scripts.test_mdk_qualification scripts.test_maestro_apk
      - name: Build baseline and candidate with one disposable signer
        run: ./scripts/build-mdk-qualification.sh
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Qualify retained data and recovery
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          ram-size: 4096M
          disk-size: 8G
          emulator-options: -no-snapshot-save -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          script: python3 scripts/run_mdk_qualification.py
      - name: Retain sanitized qualification evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: mdk-qualification-${{ github.sha }}
          path: build/mdk-qualification/
          if-no-files-found: error
          retention-days: 30
      - name: Retain exact disposable qualification APKs
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: mdk-qualification-apks-${{ github.sha }}
          path: build/mdk-pair/
          if-no-files-found: warn
          retention-days: 30

  mdk-signed-preview:
    name: Exact trusted preview upgrade and cold restart
    if: github.event_name == 'workflow_dispatch' && inputs.mdk_preview_qualification
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      PREVIEW_EMULATOR_OPTIONS: -no-snapshot-save -no-window -gpu swangle -feature -Vulkan -noaudio -no-boot-anim -camera-back none
      PREVIEW_EMULATOR_REVISION: '37.1.11'
    permissions:
      contents: read
      actions: read
    steps:
      - name: Reject mixed campaigns
        if: inputs.media_startup_trace || inputs.range_selection_only || inputs.mdk_qualification || inputs.mdk_adoption_only || inputs.maestro_pilot || inputs.media_sandbox_only || inputs.responsiveness_only || inputs.outbound_share_only || inputs.review_demo_e2e || inputs.document_provider_matrix
        run: exit 2
      - name: Checkout exact candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Verify qualification and emulator observer contracts
        run: python3 -m unittest scripts.test_mdk_qualification scripts.test_maestro_apk
      - name: Set up JDK 17
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '17'
      - name: Retain exact unsigned build provenance for comparison with the trusted signed APK
        env:
          GH_TOKEN: ${{ github.token }}
          PREVIEW_BUILD_RUN: ${{ inputs.mdk_preview_build_run }}
        run: |
          set -euo pipefail
          [[ "$PREVIEW_BUILD_RUN" =~ ^[1-9][0-9]*$ ]]
          mkdir -p build/mdk-preview-unsigned
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$PREVIEW_BUILD_RUN" > build/mdk-preview-build-run.json
          gh run download "$PREVIEW_BUILD_RUN" --repo "$GITHUB_REPOSITORY" -n pr-preview-isolated -D build/mdk-preview-unsigned
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Exercise unchanged ARM64 release bytes through ordinary UI
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2
        with:
          # Retain the version used by the passing explicit ANGLE/SwiftShader comparison.
          emulator-build: '15917651'
          api-level: 34
          target: google_apis
          arch: x86_64
          ram-size: 4096M
          disk-size: 8G
          emulator-options: ${{ env.PREVIEW_EMULATOR_OPTIONS }}
          disable-animations: true
          pre-emulator-launch-script: python3 scripts/observe_preview_emulator.py install
          script: python3 scripts/observe_preview_emulator.py driver
      - name: Retain preview host diagnostics
        if: always()
        run: |
          mkdir -p build/mdk-signed-preview
          free -m > build/mdk-signed-preview/host-memory.txt || true
          ps -eo pid,comm,rss --sort=-rss > build/mdk-signed-preview/host-processes.txt || true
          sudo dmesg --ctime | tail -n 200 > build/mdk-signed-preview/host-kernel.txt || true
      - name: Retain signed preview qualification evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: mdk-signed-preview-${{ github.sha }}
          path: build/mdk-signed-preview/
          if-no-files-found: error
          retention-days: 30
      - name: Retain exact signed preview pair
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: mdk-signed-preview-apks-${{ github.sha }}
          path: build/mdk-signed-preview-apks/
          if-no-files-found: warn
          retention-days: 30
