name: Android Instrumented Tests

# Runs app/src/androidTest on an emulator (connectedDevZapstoreDebugAndroidTest).
# Zapstore debug exercises the direct-distribution manifest/config (self-update
# permissions). These tests are slow and need a booted emulator + KVM, so they live in their own
# workflow off the fast unit/ktlint path (see android-ci.yml). Ordinary PRs do
# not run it, but MarmotKit artifact-integration changes must prove the pinned
# x86_64 native library loads before merge.
#
# On PRs the `changes` job narrows the path-filtered run to the emulator lane(s)
# the diff can affect, runs the attachment fixture for Zapstore only and skips
# draft PRs until they are marked ready. master pushes run both lanes and both
# distributions; an unreadable diff runs both lanes.
#
# Ordinary runs use dev debug. The opt-in review demo and document matrix use
# unsigned isolated preview debug builds and disposable identities.

on:
  workflow_dispatch:
    inputs:
      mdk_qualification:
        description: Populated current-master runtime upgrade, cold restart and both recovery modes
        required: false
        type: boolean
        default: false
      mdk_preview_qualification:
        description: Qualify the unchanged trusted PR3371 signed preview pair through release UI
        required: false
        type: boolean
        default: false
      mdk_preview_build_run:
        description: Successful trusted-dispatch Android PR APK run for this exact candidate
        required: false
        type: string
      mdk_adoption_only:
        description: Run real Welcome roles and explicitly enabled native diagnostic export acceptance
        required: false
        type: boolean
        default: false
      outbound_share_only:
        description: Run only implicit share discovery and URI grants in primary and secondary users
        required: false
        type: boolean
        default: false
      outbound_share_api:
        description: Android API for focused share visibility qualification
        required: false
        type: choice
        options: ['30', '34', '37.0']
        default: '34'
      media_sandbox_only:
        description: Run only codec isolation and recovery on the selected Android API
        required: false
        type: boolean
        default: false
      media_startup_trace:
        description: Trace only the fixed image baseline on hosted API 30
        required: false
        type: boolean
        default: false
      media_sandbox_api:
        description: Android API for focused decoder compatibility
        required: false
        type: choice
        options: ['30', '34', '36']
        default: '30'
      range_selection_only:
        description: Run only real-window held-pointer range-selection regression
        required: false
        type: boolean
        default: false
      range_selection_api:
        description: Android API for real-window held-pointer qualification
        required: false
        type: choice
        options: ['34', '37.0']
        default: '34'
      responsiveness_only:
        description: Run only retained transcript and connectivity responsiveness acceptance
        required: false
        type: boolean
        default: false
      maestro_pilot:
        description: Run only Maestro against a retained APK (no build or connected tests)
        required: false
        type: boolean
        default: false
      maestro_artifact_id:
        description: Artifact ID of a maestro-dev-apk output from successful Android CI
        required: false
        type: string
      maestro_source_sha:
        description: Full source commit SHA displayed by the producer Android CI run
        required: false
        type: string
      maestro_suite:
        description: Offline retained-APK coverage or opt-in generated-account runtime slice
        required: false
        type: choice
        options: [onboarding, offline, offline-signin, offline-signup, offline-edge, runtime-navigation, runtime-settings, runtime-conversation, runtime-preferences, runtime-advanced, runtime-connectors, runtime-groups, runtime-creation, runtime-actions, runtime-polls, runtime-folders, runtime-nested, runtime-reader, runtime-composer, runtime-developer, runtime-support, runtime-ballots, runtime-profiles, runtime-chats, runtime-chatstate, runtime-consent, runtime-keys, runtime-search, runtime-permissions, runtime-reports, runtime-acquisition, runtime-speech, runtime-speech-validation, runtime-dictation, runtime-reactions, runtime-alert-dialogs, runtime-smart-folders, runtime-account-guards, runtime-account-actions, runtime-app-lock, runtime-settings-lifecycle, runtime-speech-persistence, runtime-profile-text, runtime-folder-rules, runtime-relay-validation, runtime-inbound-share, runtime-presentation, runtime-modals, runtime-all]
        default: onboarding
      maestro_repetitions:
        description: Suite repetitions (onboarding 1–20, offline 1–3, focused suites 1)
        required: false
        type: string
        default: '1'
      maestro_negative_control:
        description: Append an impossible assertion to verify failure reporting (job must fail)
        required: false
        type: boolean
        default: false
      maestro_android_api:
        description: Android version for the manual generated-account campaign
        required: false
        type: choice
        options: ['33', '34', '36', '37.0']
        default: '34'
      maestro_navigation_mode:
        description: Observed system navigation and reactor Back action in the manual runtime campaign
        required: false
        type: choice
        options: [button, gesture]
        default: button
      review_demo_e2e:
        description: Run the opt-in isolated-preview real-relay demo test
        required: true
        type: boolean
        default: false
      document_provider_matrix:
        description: Run the opt-in isolated-preview real provider and relay matrix
        required: true
        type: boolean
        default: false
  push:
    branches: [master]
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - '.github/workflows/android-instrumented.yml'
      - 'scripts/select_instrumented_lanes.py'
      - 'scripts/media-latency.init.gradle'
      - 'app/build.gradle.kts'
      - 'app/src/androidTest/AndroidManifest.xml'
      - 'app/src/main/AndroidManifest.xml'
      - 'app/src/main/java/dev/ipf/whitenoise/android/share/OutboundShare.kt'
      - 'app/src/main/java/dev/ipf/whitenoise/android/ui/conversation/media/MessageOutboundShare.kt'
      - 'app/src/androidTest/java/dev/ipf/whitenoise/android/share/OutboundShareDeviceContractTest.kt'
      - 'scripts/outbound-share-fixture/**'
      - 'scripts/install-outbound-share-fixture.sh'
      - 'scripts/run-outbound-share-contract.sh'
      # Scroll masks must preserve real IME geometry and Android accessibility export.
      - 'app/src/main/java/dev/ipf/whitenoise/android/ui/common/VerticalEdgeFade.kt'
      - 'app/src/main/java/dev/ipf/whitenoise/android/ui/common/ScrollEdgeFade.kt'
      - 'app/src/androidTest/java/dev/ipf/whitenoise/android/ui/common/ScrollEdgeFadeImeAndroidTest.kt'
      - 'app/src/main/java/dev/ipf/whitenoise/android/ui/common/WhiteNoiseScrollContainers.kt'
      - 'app/src/main/java/dev/ipf/whitenoise/android/ui/common/WhiteNoiseScaffold.kt'
      - 'app/src/androidTest/java/dev/ipf/whitenoise/android/ui/ComposerResizeAccessibilityAndroidTest.kt'
      - 'app/src/androidTest/java/dev/ipf/whitenoise/android/ui/profile/ProfileEditImeNoticeTest.kt'
      - 'app/src/androidTest/java/dev/ipf/whitenoise/android/ui/ComposerDraftNavigationAndroidTest.kt'
      - 'app/src/main/java/dev/ipf/whitenoise/android/ui/conversation/composer/ComposerPills.kt'
      - 'app/src/main/java/dev/ipf/whitenoise/android/ui/conversation/composer/ComposerBar.kt'
      - 'app/src/main/java/dev/ipf/whitenoise/android/ui/conversation/messages/ReportMessageSheet.kt'
      - 'app/src/androidTest/java/dev/ipf/whitenoise/android/ui/conversation/messages/ReportMessageImeTest.kt'
      - 'app/src/main/marmotkit/**'
      - 'app/src/androidTest/java/dev/ipf/whitenoise/android/WarmResumeFirstUsefulFrameTest.kt'
      # Retained content and banner assertions inspect actual Android draws at foreground handoff.
      - 'app/src/androidTest/java/dev/ipf/whitenoise/android/ui/conversation/ConversationRetainedTranscriptFirstFrameAndroidTest.kt'
      - 'app/src/androidTest/java/dev/ipf/whitenoise/android/ui/conversation/ConversationDragSelectionPopupAndroidTest.kt'
