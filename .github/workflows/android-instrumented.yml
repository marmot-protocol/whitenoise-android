name: Android Instrumented Tests

# Runs app/src/androidTest on an emulator (connectedDevZapstoreDebugAndroidTest).
# Zapstore debug exercises the direct-distribution manifest/config (self-update
# permissions). These tests are slow and need a booted emulator + KVM, so they live in their own
# workflow off the fast unit/ktlint path (see android-ci.yml). Ordinary PRs do
# not run it, but MarmotKit artifact-integration changes must prove the pinned
# x86_64 native library loads before merge.
#
# Ordinary runs use dev debug. The opt-in review demo and document matrix use
# unsigned isolated preview debug builds and disposable identities.

on:
  workflow_dispatch:
    inputs:
      maestro_pilot:
        description: Run only Maestro against a retained APK (no build or connected tests)
        required: false
        type: boolean
        default: false
      maestro_artifact_id:
        description: Artifact ID of a maestro-dev-apk output from successful Android CI
        required: false
        type: string
      maestro_source_sha:
        description: Full source commit SHA displayed by the producer Android CI run
        required: false
        type: string
      maestro_repetitions:
        description: Journeys in one emulator boot (1 through 20)
        required: false
        type: string
        default: '1'
      maestro_negative_control:
        description: Append an impossible assertion to verify failure reporting (job must fail)
        required: false
        type: boolean
        default: false
      review_demo_e2e:
        description: Run the opt-in isolated-preview real-relay demo test
        required: true
        type: boolean
        default: false
      document_provider_matrix:
        description: Run the opt-in isolated-preview real provider and relay matrix
        required: true
        type: boolean
        default: false
  push:
    branches: [master]
  pull_request:
    paths:
      - '.github/workflows/android-instrumented.yml'
      - 'buildSrc/**'
      - 'gradle/compose-ui-backport.gradle.kts'
      - 'third_party/compose-ui/**'
      - 'app/build.gradle.kts'
      - 'app/src/androidTest/AndroidManifest.xml'
      - 'app/src/androidTest/java/dev/ipf/whitenoise/android/ui/ComposerDraftNavigationAndroidTest.kt'
      - 'app/src/main/java/dev/ipf/whitenoise/android/ui/conversation/messages/ReportMessageSheet.kt'
      - 'app/src/androidTest/java/dev/ipf/whitenoise/android/ui/conversation/messages/ReportMessageImeTest.kt'
      - 'app/src/main/marmotkit/**'
      - 'app/src/androidTest/java/dev/ipf/whitenoise/android/WarmResumeFirstUsefulFrameTest.kt'
      - 'app/src/androidTest/java/dev/ipf/whitenoise/android/notifications/NotificationHapticVisualTimingDeviceTest.kt'
      - 'app/src/androidTest/java/dev/ipf/whitenoise/android/notifications/NotificationCatchUpAlertDeviceTest.kt'
      - 'app/src/androidTest/java/dev/ipf/whitenoise/android/core/ForwardMediaReferenceFfiIntegrationTest.kt'
      # Read-aloud highlights are geometry over real font metrics, which
      # Robolectric only simulates. Device evidence must gate changes to them.
      - 'app/src/androidTest/java/dev/ipf/whitenoise/android/ui/conversation/TimelineRowTtsHighlightPaintAndroidTest.kt'
      - 'app/src/androidTest/java/dev/ipf/whitenoise/android/ui/conversation/TtsHighlightPlacementAndroidTest.kt'
      - 'app/src/androidTest/java/dev/ipf/whitenoise/android/ui/conversation/TtsRichLeafPlacementAndroidTest.kt'
      - 'app/src/androidTest/java/dev/ipf/whitenoise/android/ui/conversation/messages/LongCjkBubbleScrollAndroidTest.kt'
      - 'app/src/androidTest/java/dev/ipf/whitenoise/android/ui/conversation/messages/ComposeRectListBackportAndroidTest.kt'
      - 'app/src/testSupport/kotlin/dev/ipf/whitenoise/android/ui/conversation/messages/ComposeRectListReuseFixture.kt'
      - 'app/src/main/java/dev/ipf/whitenoise/android/ui/conversation/messages/TtsReadAloudHighlight.kt'
      - 'app/src/androidTest/java/dev/ipf/whitenoise/android/media/MediaReferenceSupportFuzzIntegrationTest.kt'
      - 'app/src/main/java/dev/ipf/whitenoise/android/media/MediaReferenceSupport.kt'
      - 'app/src/main/java/dev/ipf/whitenoise/android/media/AnimationSource*.kt'
      - 'app/src/main/java/dev/ipf/whitenoise/android/media/MediaPipeline.kt'
      - 'app/src/main/java/dev/ipf/whitenoise/android/ui/conversation/media/AnimatedAttachmentImage.kt'
      - 'app/src/androidTest/java/dev/ipf/whitenoise/android/media/AnimationSourceAdmissionDeviceTest.kt'
      - 'cryptoBenchmark/**'
      - 'settings.gradle.kts'
      - 'app/src/main/java/dev/ipf/whitenoise/android/core/nostr/NostrEvent.kt'
      - 'app/src/main/java/dev/ipf/whitenoise/android/core/nostr/NostrEventVerifier.kt'
      - 'gradle/libs.versions.toml'
      - 'app/src/androidTest/java/dev/ipf/whitenoise/android/share/ExternalShareDispatchActivity.java'
      - 'app/src/androidTest/java/dev/ipf/whitenoise/android/share/ExternalShareTestFileProvider.java'
      - 'app/src/androidTest/java/dev/ipf/whitenoise/android/share/InboundShareTaskReuseDeviceTest.kt'
      - 'scripts/prepare_marmotkit_artifact.py'
      - 'scripts/test_prepare_marmotkit_artifact.py'
      - 'scripts/run-android-instrumented-tests.sh'
      - 'scripts/run-controlled-attachment-fixture.sh'
      - 'tools/attachment-fixture/**'
      - 'app/src/androidTest/java/dev/ipf/whitenoise/android/media/ControlledAttachmentProbe.kt'
      - 'app/src/androidTest/java/dev/ipf/whitenoise/android/media/MediaAttachmentLatencyProbe.kt'
      - 'app/src/androidTest/java/dev/ipf/whitenoise/android/media/NativePhaseAttachmentProbe.kt'
      - 'app/src/androidTest/java/dev/ipf/whitenoise/android/media/AndroidAttachmentFixtureSender.kt'
      - 'app/src/androidTest/java/dev/ipf/whitenoise/android/media/MediaLifecycleAttachmentProbe.kt'
      - 'app/src/androidTest/java/dev/ipf/whitenoise/android/media/ForwardAttachmentProbe.kt'
      - 'app/src/androidTest/java/dev/ipf/whitenoise/android/media/FixtureMediaAssets.kt'
      - 'app/src/androidTest/java/dev/ipf/whitenoise/android/media/ApkInstallerAttachmentProbe.kt'
      - 'app/src/androidTest/java/dev/ipf/whitenoise/android/media/FixtureSession.kt'
      - 'app/src/androidTest/java/dev/ipf/whitenoise/android/media/MatrixAttachmentProbe.kt'
      - 'app/src/main/java/dev/ipf/whitenoise/android/state/AttachmentPlaintextResolver.kt'
      - 'app/src/main/java/dev/ipf/whitenoise/android/state/AppStateForwardTransport.kt'
      - 'app/src/main/java/dev/ipf/whitenoise/android/state/MessageForwarding.kt'
      # Stored direct-peer title and membership separation (#2149) against the real native runtime.
      - 'app/src/androidTest/java/dev/ipf/whitenoise/android/state/ChatListColdStartDirectPeerPresentationFfiIntegrationTest.kt'
      - 'app/src/androidTest/java/dev/ipf/whitenoise/android/state/LoopbackNostrRelay.kt'
      - 'scripts/check_instrumented_required_cases.py'
      - 'config/instrumented-required-cases.txt'

# Cancel superseded runs on the same ref so a force-push or rapid re-push does
# not pile up redundant (and expensive) emulator runs.
concurrency:
  group: ${{ github.event_name == 'workflow_dispatch' && inputs.maestro_pilot && 'android-maestro-pilot' || format('android-instrumented-{0}-{1}', github.workflow, github.ref) }}
  cancel-in-progress: ${{ !(github.event_name == 'workflow_dispatch' && inputs.maestro_pilot) }}

permissions:
  contents: read

jobs:
  attachment-fixture:
    if: github.event_name != 'workflow_dispatch' || !inputs.maestro_pilot
    name: Controlled attachment fixture (${{ matrix.distribution }})
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        distribution: [Play, Zapstore]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          disable-animations: true
          emulator-options: -no-snapshot-save -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: |
            bash scripts/run-controlled-attachment-fixture.sh emulator-5554 "${{ matrix.distribution }}" ci-api34-x86_64
            bash scripts/run-controlled-attachment-fixture.sh emulator-5554 "${{ matrix.distribution }}" ci-api34-x86_64 controller-resume
            bash scripts/run-controlled-attachment-fixture.sh emulator-5554 "${{ matrix.distribution }}" ci-api34-x86_64 controller-resume-changed
            bash scripts/run-controlled-attachment-fixture.sh emulator-5554 "${{ matrix.distribution }}" ci-api34-x86_64 controller-unknown-length
            bash scripts/run-controlled-attachment-fixture.sh emulator-5554 "${{ matrix.distribution }}" ci-api34-x86_64 controller-background
            bash scripts/run-controlled-attachment-fixture.sh emulator-5554 "${{ matrix.distribution }}" ci-api34-x86_64 controller-lock
            bash scripts/run-controlled-attachment-fixture.sh emulator-5554 "${{ matrix.distribution }}" ci-api34-x86_64 controller-automatic-resume
            bash scripts/run-controlled-attachment-fixture.sh emulator-5554 "${{ matrix.distribution }}" ci-api34-x86_64 controller-phases
            bash scripts/run-controlled-attachment-fixture.sh emulator-5554 "${{ matrix.distribution }}" ci-api34-x86_64 controller-media
            bash scripts/run-controlled-attachment-fixture.sh emulator-5554 "${{ matrix.distribution }}" ci-api34-x86_64 controller-tile-transfer
            bash scripts/run-controlled-attachment-fixture.sh emulator-5554 "${{ matrix.distribution }}" ci-api34-x86_64 controller-apk
            bash scripts/run-controlled-attachment-fixture.sh emulator-5554 "${{ matrix.distribution }}" ci-api34-x86_64 controller-matrix unshaped,quick
            bash scripts/run-controlled-attachment-fixture.sh emulator-5554 "${{ matrix.distribution }}" ci-api34-x86_64 controller-apk-recreation
            bash scripts/run-controlled-attachment-fixture.sh emulator-5554 "${{ matrix.distribution }}" ci-api34-x86_64 controller-forward
      - name: Preserve redacted ledger and measurements on success or failure
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: attachment-fixture-${{ matrix.distribution }}
          path: app/build/reports/attachment-fixture/
          if-no-files-found: error
          retention-days: 7

  instrumented:
    if: github.event_name != 'workflow_dispatch' || !inputs.maestro_pilot
    name: Connected Android tests (emulator)
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Configure MarmotKit cache directory
        shell: bash
        run: printf 'WHITENOISE_MARMOTKIT_CACHE_DIR=%s\n' "$RUNNER_TEMP/marmotkit-cache" >> "$GITHUB_ENV"

      # AGP 9.x / Gradle 9.4.1 require JDK 17 (matches android-ci.yml).
      - name: Set up JDK 17
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0

      - name: Read MarmotKit artifact pin
        id: marmotkit
        shell: bash
        run: |
          sha="$(awk -F= '$1 == "artifact-sha256" { print $2 }' app/src/main/marmotkit/MARMOT_VERSION)"
          [[ "$sha" =~ ^[0-9a-f]{64}$ ]] || { echo "Invalid MarmotKit artifact SHA-256" >&2; exit 1; }
          printf 'sha=%s\n' "$sha" >> "$GITHUB_OUTPUT"

      - name: Restore MarmotKit artifact
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/marmotkit-cache
          key: marmotkit-${{ runner.os }}-${{ steps.marmotkit.outputs.sha }}

      # KVM lets the emulator run hardware-accelerated on the GitHub-hosted
      # ubuntu runner; without it the AVD boot is far slower or fails.
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run connected Android tests
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          force-avd-creation: false
          emulator-options: -no-snapshot-save -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          # android-emulator-runner executes this input through /bin/sh. Keep it
          # to one command and delegate conditional selection to the executable.
          script: ./scripts/run-android-instrumented-tests.sh "${{ github.event_name }}" "${{ inputs.review_demo_e2e }}" "${{ inputs.document_provider_matrix }}"

      - name: Upload instrumented test reports
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: android-instrumented-reports
          path: |
            app/build/reports/androidTests/
            app/build/outputs/androidTest-results/
            app/build/outputs/connected_android_test_additional_output/
            cryptoBenchmark/build/reports/androidTests/
            cryptoBenchmark/build/outputs/androidTest-results/
            app/build/reports/document-provider-matrix/
          if-no-files-found: ignore
          retention-days: 7

  maestro-pilot:
    name: Optional Maestro onboarding pilot
    if: github.event_name == 'workflow_dispatch' && inputs.maestro_pilot
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      actions: read
    env:
      MAESTRO_REPETITIONS: ${{ inputs.maestro_repetitions }}
      MAESTRO_NEGATIVE_CONTROL: ${{ inputs.maestro_negative_control }}
      MAESTRO_CLI_NO_ANALYTICS: 'true'
      MAESTRO_DISABLE_UPDATE_CHECK: 'true'
      MAESTRO_CLI_ANALYSIS_NOTIFICATION_DISABLED: 'true'
    steps:
      - name: Checkout the selected flow revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Validate selection and retained APK provenance
        env:
          GH_TOKEN: ${{ github.token }}
          ARTIFACT_ID: ${{ inputs.maestro_artifact_id }}
          SOURCE_SHA: ${{ inputs.maestro_source_sha }}
          REVIEW_DEMO: ${{ inputs.review_demo_e2e }}
          DOCUMENT_MATRIX: ${{ inputs.document_provider_matrix }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build/maestro-pilot
          printf 'setup_started_at=%s\n' "$(date +%s)" > build/maestro-pilot/timings.env
          [[ "$REVIEW_DEMO" != true && "$DOCUMENT_MATRIX" != true ]] || { echo 'Select only the Maestro pilot'; exit 2; }
          python3 scripts/maestro_apk.py fetch --artifact-id "$ARTIFACT_ID" --source "$SOURCE_SHA" \
            --repetitions "$MAESTRO_REPETITIONS" --destination build/maestro-pilot/apk

      - name: Require the expected dev package and API 34 compatibility
        shell: bash
        run: |
          set -euo pipefail
          aapt=$(find "$ANDROID_HOME/build-tools" -mindepth 2 -maxdepth 2 -type f -name aapt | sort -V | tail -1)
          test -x "$aapt"
          "$aapt" dump badging build/maestro-pilot/apk/app.apk > build/maestro-pilot/apk-badging.txt
          grep -q "^package: name='dev.ipf.whitenoise.android.dev' " build/maestro-pilot/apk-badging.txt
          min_sdk=$(sed -n "s/^sdkVersion:'\([0-9]*\)'$/\1/p" build/maestro-pilot/apk-badging.txt)
          [[ "$min_sdk" =~ ^[0-9]+$ && "$min_sdk" -le 34 ]]

      - name: Set up Java for Maestro
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: '17'

      - name: Reuse the checksummed Maestro distribution
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/maestro.zip
          key: maestro-cli-${{ runner.os }}-2.11.0-5384593cb4e7a106489e75a821d157dd43f4e438df6bc308b72e82c685e1283a

      - name: Install the pinned Maestro CLI
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! -f "$RUNNER_TEMP/maestro.zip" ]]; then
            curl --fail --location --retry 2 --max-time 120 \
              https://github.com/mobile-dev-inc/Maestro/releases/download/cli-2.11.0/maestro.zip \
              --output "$RUNNER_TEMP/maestro.zip"
          fi
          echo '5384593cb4e7a106489e75a821d157dd43f4e438df6bc308b72e82c685e1283a  '"$RUNNER_TEMP/maestro.zip" | sha256sum -c -
          unzip -q "$RUNNER_TEMP/maestro.zip" -d "$RUNNER_TEMP/maestro-cli"
          printf '%s\n' "$RUNNER_TEMP/maestro-cli/maestro/bin" >> "$GITHUB_PATH"

      - name: Enable KVM
        shell: bash
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run the offline journey against the installed APK
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          disable-animations: true
          emulator-options: -no-snapshot-save -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: bash scripts/run-maestro-pilot.sh

      - name: Retain pilot results on success or failure
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: maestro-pilot-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            build/maestro-pilot/*.json
            build/maestro-pilot/*.xml
            build/maestro-pilot/*.txt
            build/maestro-pilot/*.env
            build/maestro-pilot/debug/
            build/maestro-pilot/screenshots/
          if-no-files-found: warn
          retention-days: 7
