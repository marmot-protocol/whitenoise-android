name: Tag Android Staging Build

on:
  workflow_dispatch:
    inputs:
      build_run_id:
        description: Run ID of the successful Android Staging APK build you selected
        required: true
        type: string

permissions: {}

concurrency:
  group: android-staging-tag-${{ inputs.build_run_id }}
  cancel-in-progress: false

jobs:
  tag:
    name: Tag the chosen staging build
    if: github.repository == 'marmot-protocol/whitenoise-android' && github.ref == 'refs/heads/develop'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
      actions: read
    steps:
      - name: Check out the trusted workflow revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Verify the build and create its staging tag
        env:
          GH_TOKEN: ${{ github.token }}
          BUILD_RUN_ID: ${{ inputs.build_run_id }}
        run: python3 -m scripts.tag_staging_build "$BUILD_RUN_ID"
