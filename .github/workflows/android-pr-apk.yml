name: Android PR APK

# This pull_request workflow is intentionally unprivileged. It compiles the PR
# code and hands unsigned preview candidates to android-pr-preview-publish.yml;
# it never receives signing or upload credentials. workflow_dispatch lets a
# current internal PR head be rebuilt after merge to restore missing preview links.
on:
  pull_request:
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
      - '.github/ISSUE_TEMPLATE/**'
  workflow_dispatch:
    inputs:
      pr_number:
        description: Open internal PR to rebuild and republish
        required: true
        type: string

concurrency:
  group: android-pr-apk-${{ github.event.pull_request.number || inputs.pr_number || github.run_id }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Build untrusted preview candidates
    # Preview signing is intentionally limited to branches in this repository.
    # Skip fork PRs cleanly instead of failing inside the internal-PR resolver.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      matrix:
        channel: [stable, isolated]
    env:
      PR_PREVIEW_CHANNEL: ${{ matrix.channel }}
      GITHUB_RUN_NUMBER: ${{ github.run_number }}
      WHITENOISE_ALLOW_UNSIGNED_RELEASE: 'true'

    steps:
      - name: Resolve exact current internal PR head
        id: resolve
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT_NAME: ${{ github.event_name }}
          EVENT_PR_NUMBER: ${{ github.event.pull_request.number }}
          EVENT_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          EVENT_HEAD_REPOSITORY: ${{ github.event.pull_request.head.repo.full_name }}
          REQUESTED_PR_NUMBER: ${{ inputs.pr_number }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$EVENT_NAME" == pull_request ]]; then
            pr_number=$EVENT_PR_NUMBER
            head_sha=$EVENT_HEAD_SHA
            head_repository=$EVENT_HEAD_REPOSITORY
          else
            [[ "$REQUESTED_PR_NUMBER" =~ ^[1-9][0-9]*$ ]]
            pr_number=$REQUESTED_PR_NUMBER
            read -r state head_sha head_repository < <(
              gh api "repos/${GITHUB_REPOSITORY}/pulls/${pr_number}" \
                --jq '[.state, .head.sha, .head.repo.full_name] | @tsv'
            )
            [[ "$state" == open ]]
          fi
          [[ "$head_repository" == "$GITHUB_REPOSITORY" ]]
          [[ "$head_sha" =~ ^[0-9a-f]{40}$ ]]
          # Re-read immediately before exporting so a dispatch racing a new PR
          # commit cannot build stale code under current provenance.
          current=$(gh api "repos/${GITHUB_REPOSITORY}/pulls/${pr_number}" \
            --jq '[.state, .head.sha, .head.repo.full_name] | @tsv')
          expected=$(printf 'open\t%s\t%s' "$head_sha" "$GITHUB_REPOSITORY")
          [[ "$current" == "$expected" ]]
          printf 'pr_number=%s\nhead_sha=%s\n' "$pr_number" "$head_sha" >> "$GITHUB_OUTPUT"
          printf 'PR_NUMBER=%s\nPREVIEW_HEAD_SHA=%s\n' "$pr_number" "$head_sha" >> "$GITHUB_ENV"

      - name: Checkout PR commit without credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ steps.resolve.outputs.head_sha }}
          persist-credentials: false

      - name: Configure MarmotKit cache directory
        shell: bash
        run: printf 'WHITENOISE_MARMOTKIT_CACHE_DIR=%s\n' "$RUNNER_TEMP/marmotkit-cache" >> "$GITHUB_ENV"

      - name: Set up JDK 17
        uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6.0.0
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle read-only cache
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0
        with:
          cache-read-only: true

      - name: Read MarmotKit artifact pin
        id: marmotkit
        shell: bash
        run: |
          sha="$(awk -F= '$1 == "artifact-sha256" { print $2 }' app/src/main/marmotkit/MARMOT_VERSION)"
          [[ "$sha" =~ ^[0-9a-f]{64}$ ]] || { echo "Invalid MarmotKit artifact SHA-256" >&2; exit 1; }
          printf 'sha=%s\n' "$sha" >> "$GITHUB_OUTPUT"

      - name: Restore MarmotKit artifact read-only
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/marmotkit-cache
          key: marmotkit-${{ runner.os }}-${{ steps.marmotkit.outputs.sha }}

      - name: Test preview workflow contract
        run: |
          .github/scripts/test-pr-preview-contract.sh
          .github/scripts/test-pr-preview-validation.sh
          node --test .github/scripts/update-pr-preview-links.test.js

      # Keep exact-head source intact while changing only generated preview APK
      # packaging. Compressed JNI libraries require extractNativeLibs=true; AGP
      # emits that manifest contract when legacy JNI packaging is enabled.
      - name: Configure transport-safe preview packaging
        shell: bash
        run: |
          cat > "$RUNNER_TEMP/compact-pr-preview.gradle" <<'GRADLE'
          gradle.beforeProject { project ->
              project.plugins.withId("com.android.application") {
                  project.extensions.getByName("android").packaging.jniLibs.useLegacyPackaging = true
              }
          }
          GRADLE
          printf 'PR_PREVIEW_INIT_SCRIPT=%s\n' "$RUNNER_TEMP/compact-pr-preview.gradle" >> "$GITHUB_ENV"

      # The Play distribution deliberately omits Zapstore's production-style
      # self-updater. Preview APKs are replaced only from the PR install link.
      - name: Assemble preview candidate
        run: ./gradlew :app:assemblePreviewPlayRelease --no-daemon --stacktrace -I "$PR_PREVIEW_INIT_SCRIPT"

      - name: Stage candidate and provenance
        shell: bash
        run: |
          set -euo pipefail
          apk=$(find app/build/outputs/apk -type f -name '*arm64-v8a*.apk' -print -quit)
          test -n "$apk"
          mapping=app/build/outputs/mapping/previewPlayRelease/mapping.txt
          test -s "$mapping"
          apk_sha256=$(sha256sum "$apk" | cut -d' ' -f1)
          mkdir -p preview-candidate preview-diagnostic
          cp "$apk" "preview-candidate/whitenoise-pr-${PR_NUMBER}-${PR_PREVIEW_CHANNEL}-unsigned.apk"
          (cd preview-candidate && sha256sum *.apk > SHA256SUMS)
          printf '%s\n' \
            "pr_number=$PR_NUMBER" \
            "channel=$PR_PREVIEW_CHANNEL" \
            "head_sha=$PREVIEW_HEAD_SHA" \
            "run_number=$GITHUB_RUN_NUMBER" > preview-candidate/provenance.env
          cp "$mapping" preview-diagnostic/mapping.txt
          (cd preview-diagnostic && sha256sum mapping.txt > SHA256SUMS)
          printf '%s\n' \
            "pr_number=$PR_NUMBER" \
            "channel=$PR_PREVIEW_CHANNEL" \
            "head_sha=$PREVIEW_HEAD_SHA" \
            "run_number=$GITHUB_RUN_NUMBER" \
            "unsigned_apk_sha256=$apk_sha256" > preview-diagnostic/provenance.env

      - name: Upload untrusted candidate
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: pr-preview-${{ matrix.channel }}
          path: preview-candidate/
          if-no-files-found: error
          retention-days: 1

      - name: Upload untrusted optimizer diagnostics
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: pr-preview-${{ matrix.channel }}-diagnostics
          path: preview-diagnostic/
          if-no-files-found: error
          retention-days: 1
