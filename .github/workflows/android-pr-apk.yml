name: Android PR APK

# This pull_request workflow is intentionally unprivileged. It compiles the PR
# code and hands unsigned preview candidates to android-pr-preview-publish.yml;
# it never receives signing or upload credentials.
on:
  pull_request:
    branches: [master]
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
      - '.github/ISSUE_TEMPLATE/**'

concurrency:
  group: android-pr-apk-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Build untrusted preview candidates
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      matrix:
        channel: [stable, isolated]
    env:
      PR_NUMBER: ${{ github.event.pull_request.number }}
      PR_PREVIEW_CHANNEL: ${{ matrix.channel }}
      PREVIEW_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
      GITHUB_RUN_NUMBER: ${{ github.run_number }}
      WHITENOISE_ALLOW_UNSIGNED_RELEASE: 'true'

    steps:
      - name: Checkout PR commit without credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false

      - name: Set up JDK 17
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle read-only cache
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0
        with:
          cache-read-only: true

      - name: Test preview workflow contract
        run: .github/scripts/test-pr-preview-contract.sh

      # The Play distribution deliberately omits Zapstore's production-style
      # self-updater. Preview APKs are replaced only from the PR install link.
      - name: Assemble preview candidate
        run: ./gradlew :app:assemblePreviewPlayRelease --no-daemon --stacktrace

      - name: Stage candidate and provenance
        shell: bash
        run: |
          set -euo pipefail
          apk=$(find app/build/outputs/apk -type f -name '*arm64-v8a*.apk' -print -quit)
          test -n "$apk"
          mkdir -p preview-candidate
          cp "$apk" "preview-candidate/whitenoise-pr-${PR_NUMBER}-${PR_PREVIEW_CHANNEL}-unsigned.apk"
          (cd preview-candidate && sha256sum *.apk > SHA256SUMS)
          printf '%s\n' \
            "pr_number=$PR_NUMBER" \
            "channel=$PR_PREVIEW_CHANNEL" \
            "head_sha=${{ github.event.pull_request.head.sha }}" \
            "run_number=$GITHUB_RUN_NUMBER" > preview-candidate/provenance.env

      - name: Upload untrusted candidate
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: pr-preview-${{ matrix.channel }}
          path: preview-candidate/
          if-no-files-found: error
          retention-days: 1
